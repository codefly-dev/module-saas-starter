name: Dependency audit auto-remediation

# Keeps transitive security bumps flowing into main ahead of release. A
# newly-published advisory can redden an otherwise-clean release at tag time
# even when the lockfile never changed (#406, browserslist in #400). This job
# runs the same `npm audit` policy the release gate enforces, remediates what
# it safely can into a rolling pull request, and fails loudly when an advisory
# needs manual attention — so tags cut from an already-remediated tree.
#
# It needs a token that can open a pull request. The remediation half works with
# GITHUB_TOKEN, but `gh pr create` does not: this organisation has "Allow GitHub
# Actions to create and approve pull requests" turned off, so the call fails with
# `GitHub Actions is not permitted to create or approve pull requests`. That is
# the same constraint combine-deps.yml documents, and the same DEPS_COMBINE_TOKEN
# answers it — see that file's header for why the setting is not simply turned on.
#
# Until this was fixed the failure was silent in the worst way. The job remediated
# correctly and force-pushed the branch, then died on `gh pr create` — which sits
# BEFORE the `gh workflow run` line, so the pushed head never even got CI, and no
# pull request existed to make the fix visible. Six consecutive daily runs failed
# that way with three critical advisories already remediated on the branch; the
# pull request had to be opened by hand (#1228). So: push and trigger CI first,
# treat a create refusal as loud but non-fatal, and let the residual audit gate
# below decide the run's verdict.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# Serialize runs so an on-demand dispatch overlapping the daily schedule can't
# double-force-push the branch and race `gh pr create`. Never cancel a run
# mid-push; let the newer run wait.
concurrency:
  group: dep-audit-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # DEPS_COMBINE_TOKEN is a PAT (or GitHub App token) with `repo` scope, shared
      # with combine-deps.yml. An empty secret is falsy, so this degrades to
      # GITHUB_TOKEN: everything except opening the pull request still works.
      GH_TOKEN: ${{ secrets.DEPS_COMBINE_TOKEN || secrets.GITHUB_TOKEN }}
      HAVE_PR_TOKEN: ${{ secrets.DEPS_COMBINE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DEPS_COMBINE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Remediate transitive advisories in the lockfiles
        shell: bash
        run: |
          for dir in \
            module/services/frontend/code \
            module/services/marketing/code; do
            # `audit fix` exits non-zero when advisories remain after the safe
            # fixes; the residual gate below is the authoritative check, so a
            # partial fix here must not abort the run before the PR is opened.
            npm --prefix "$dir" audit fix --package-lock-only --omit=dev || true
          done
      - name: Open or update the remediation pull request
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No transitive advisories to remediate; lockfiles unchanged."
            exit 0
          fi
          # module-verify re-checks the frontend workspace install graph, so a
          # non-conforming lock from `audit fix` fails here, not on the PR.
          node module/tools/module-verify.mjs
          branch="chore/dep-audit-remediation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "chore(deps): remediate transitive security advisories"
          git push --force origin "$branch"

          # A create refusal must not abort the step: the dispatch below is what
          # gives the pushed head its CI, and the contract test pins the dispatch
          # to run after a new or updated pull request. So record the outcome and
          # carry on.
          create_status=0
          if [[ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            echo "Remediation pull request is already open; branch updated in place."
          elif [[ "$HAVE_PR_TOKEN" == "true" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(deps): auto-remediate transitive security advisories (#406)" \
              --body "Automated \`npm audit fix --package-lock-only --omit=dev\` remediation of newly-published advisories against the pinned dependency tree. Review the lockfile diff and let the release gate confirm the audit is clean before merging." || create_status=$?
          else
            echo "::error::Remediated advisories are pushed to '$branch' but no pull request could be opened."
            echo "::error::GITHUB_TOKEN cannot create one: Actions is not permitted to create pull requests in this organisation."
            echo "::error::Add DEPS_COMBINE_TOKEN as an organisation secret (a PAT with 'repo' scope); combine-deps.yml needs the same one."
            echo "::error::Until then, open the pull request by hand: gh pr create --base main --head $branch"
            create_status=1
          fi

          # GITHUB_TOKEN suppresses push/pull_request workflow triggers, but
          # workflow_dispatch runs CI on the pushed head for new and updated PRs.
          # Unconditional: with a PAT the push raises its own event too, so that
          # head may get two runs — preferred over a head with none.
          gh workflow run ci.yml --ref "$branch"

          # Reached only when the dispatch succeeded; -e has already propagated a
          # dispatch failure. A pull request that could not be opened is a failure
          # of this job: by now the working tree holds the REMEDIATED lockfiles, so
          # the residual gate below would report a clean audit and the run would go
          # green with an advisory on a branch nobody is looking at.
          exit "$create_status"
      - name: Fail if high-severity advisories remain after auto-fix
        shell: bash
        run: |
          # Mirrors the first-party vulnerability gate in ci.yml. A failure here
          # means `audit fix` could not fully remediate (e.g. the fix needs a
          # major bump or an explicit override) and a maintainer must act before
          # the next release tag.
          npm --prefix module/services/frontend/code audit --omit=dev --audit-level=high
          npm --prefix module/services/marketing/code audit --omit=dev --audit-level=high
