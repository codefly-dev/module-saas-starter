name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-boundary:
    name: Codefly SDK boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: Reject direct Codefly runtime-carrier access
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: go test codefly_sdk_boundary_test.go
      - name: Enforce deterministic protocol generation
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: go test -run TestMergedProtocolGeneratorsUseOneInvocation .

  codefly:
    name: Codefly CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install Codefly
        uses: codefly-dev/cli/.github/actions/install@3d6f02e21e1ee1e862ebd1c8c15eb0c1807f60ef # v0.1.27
      # The published go-grpc 0.1.12 agent resolves proto companion image
      # codeflydev/proto:0.0.10, which is missing protoc-gen-go and
      # protoc-gen-go-grpc (fixed in 0.0.11). buf runs INSIDE that container, so
      # host plugins don't help. The runner pulls the companion only when it is
      # absent locally (core GetImageIfNotPresent), so pre-seed the 0.0.10 tag
      # from the fixed 0.0.11 image (same plugin versions, plus the two missing
      # Go plugins). Stopgap until go-grpc ships an agent built against
      # core >= v0.2.29, which pins proto 0.0.11.
      - name: Pin fixed proto companion image
        shell: bash
        run: |
          docker pull codeflydev/proto:0.0.11
          docker tag codeflydev/proto:0.0.11 codeflydev/proto:0.0.10
      - name: Run Codefly-owned gate
        shell: bash
        env:
          CODEFLY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(ci run --head "${GITHUB_SHA}" --output .codefly/ci)
          if [[ -n "${CODEFLY_BASE}" && "${CODEFLY_BASE}" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--base "${CODEFLY_BASE}")
          else
            args+=(--all)
          fi
          codefly "${args[@]}"
