name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The saas-starter is a multi-module repo: the module root plus each
        # Go service. Build + vet each independently against published core.
        module:
          - "."
          - "module/services/accounts/code"
          - "module/services/auth-sidecar/code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '${{ matrix.module }}/go.mod'
      - name: Build (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  base-integrity:
    # The base-file manifest must stay current with canonical's files: editing
    # any base file without regenerating the manifest fails here. Consumers run
    # the SAME command (`base-integrity.mjs check`) to prove they only ADD files
    # on the side and never modify the base they synced from canonical.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Base-file integrity (manifest current vs canonical)
        run: node module/tools/base-integrity.mjs check
