version: v1
module:
  name: saas-starter
  namespace: saas-starter
  service_entry: frontend
  description: "SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit"
interface:
  - service: auth-sidecar
    endpoint: grpc
    visibility: module
  - service: frontend
    endpoint: http
    visibility: public
  - service: marketing
    endpoint: http
    visibility: public
services:
  - name: accounts
    version: 0.0.0
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.33
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - abuse-protection
      - application
      - billing
      - email
      - identity
      - internal-auth
      - observability
      - product-analytics
      - security
    endpoints:
      - name: connect
        api: connect
        visibility: private
        port: 8080
      - name: grpc
        api: grpc
        visibility: private
        port: 9090
      - name: rest
        api: rest
        visibility: private
        port: 8080
    dependencies:
      - service: cache
        endpoints:
          - read
          - write
      - service: store
        endpoints:
          - tcp
      - service: telemetry
        endpoints:
          - grpc
      - service: vault
        endpoints:
          - http
    public_egress_ports:
      - 443
    spec:
      hot-reload: true
      rest-endpoint: true
      connect-endpoint: true
      protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
  - name: auth-sidecar
    version: 0.0.0
    description: |
      Single ingress + auth brain. Hosts two listeners:
        - gRPC ext_authz for Envoy
        - private HTTP API gateway behind the frontend entry
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.33
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - gateway
      - internal-auth
      - observability
      - security
    endpoints:
      - name: grpc
        api: grpc
        visibility: module
        port: 9090
      - name: rest
        api: rest
        visibility: private
        port: 8080
    dependencies:
      - service: accounts
        endpoints:
          - connect
          - grpc
          - rest
      - service: cache
        endpoints:
          - write
      - service: telemetry
        endpoints:
          - grpc
    spec:
      hot-reload: true
      rest-endpoint: true
      protocol-output-dirs:
        - code/pkg/gen
  - name: cache
    version: 0.0.0
    agent:
      kind: codefly:service
      name: redis
      # 0.0.82: read-replica runtime-load fix (two tcp endpoints on one port),
      # codefly-dev/service-redis#16 — resolved, hold lifted.
      version: 0.0.82
      publisher: codefly.dev
    endpoints:
      - name: read
        api: tcp
        visibility: private
        port: 6379
      - name: write
        api: tcp
        visibility: private
        port: 6379
    spec:
      watch: false
      with-read-replicas: true
  - name: frontend
    version: 0.0.0
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.145
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - abuse-protection
      - error-tracking
      - identity
      - internal-auth
      - product-analytics
    endpoints:
      - name: http
        api: http
        visibility: public
        port: 3000
    dependencies:
      - service: auth-sidecar
        endpoints:
          - rest
    public_egress_ports:
      - 443
    spec:
      # Next dev/Turbopack owns source HMR. Restarting the entire dev server on
      # every TS/TSX save invalidates browser chunks instead of applying HMR.
      hot-reload: false
      execution-profiles:
        local: development
        local-dogfood: development
        production: production
      mode: ssr
  - name: marketing
    version: 0.0.0
    description: |
      Independently deployable public company site. Owns public content,
      metadata, pricing presentation, and safe product handoff without product
      sessions, tenant state, database access, or secrets.
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.145
      publisher: codefly.dev
    endpoints:
      - name: http
        api: http
        visibility: public
        port: 3000
    public_egress_ports:
      - 443
    spec:
      hot-reload: false
      execution-profiles:
        local: development
        production: production
      mode: ssr
  - name: store
    version: 0.0.0
    agent:
      kind: codefly:service
      name: postgres
      version: 0.0.125
      publisher: codefly.dev
    endpoints:
      - name: tcp
        api: tcp
        visibility: external
        port: 5432
    bootstrap_job_endpoints:
      - tcp
    spec:
      database-name: users
      debug: false
      runtime-read-write-roles:
        - app_tenant
        - app_control_plane
        - app_billing_worker
        - app_webhook_worker
        - app_job_worker
      persist: true
      silent: true
      watch: true
      without-ssl: false
  - name: telemetry
    version: 0.0.0
    description: |
      In-graph OTLP gateway. Accounts resolves this endpoint exclusively
      through the Codefly SDK; the collector either logs locally or forwards
      trace, metric, and log protobufs to a configured OTLP/HTTP destination.
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.33
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - observability
    endpoints:
      - name: grpc
        api: grpc
        visibility: private
        port: 8080
    public_egress_ports:
      - 443
    spec:
      hot-reload: true
      protocol-output-dirs:
        - code/pkg/gen
  - name: vault
    version: 0.0.0
    agent:
      kind: codefly:service
      name: vault
      version: 0.0.25
      publisher: codefly.dev
    secret_service_configurations:
      - name: vault
        entries:
          - key: vault_token
    endpoints:
      - name: http
        api: http
        visibility: module
        port: 8200
    spec:
      transit-key: api-keys
