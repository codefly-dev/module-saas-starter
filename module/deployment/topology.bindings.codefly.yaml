version: v1
module:
  name: saas-starter
  namespace: saas-starter
  service_entry: frontend
  description: "SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit"
interface:
  - service: auth-gateway
    endpoint: grpc
    visibility: module
  - service: frontend
    endpoint: http
    visibility: public
  - service: marketing
    endpoint: http
    visibility: public
services:
  - name: accounts
    version: 0.0.0
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.36
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - abuse-protection
      - application
      - billing
      - email
      - identity
      - internal-auth
      - observability
      - product-analytics
      - security
    endpoints:
      - name: connect
        api: connect
        visibility: private
        port: 8080
      - name: grpc
        api: grpc
        visibility: private
        port: 9090
      - name: rest
        api: rest
        visibility: private
        port: 8080
    dependencies:
      - service: cache
        endpoints:
          - read
          - write
      - service: store
        endpoints:
          - tcp
      - service: telemetry
        endpoints:
          - grpc
      - service: vault
        endpoints:
          - http
    public_egress_ports:
      - 443
    spec:
      hot-reload: true
      rest-endpoint: true
      connect-endpoint: true
      service-account:
        name: accounts
      protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
  - name: auth-gateway
    version: 0.0.0
    description: |
      Single ingress + auth brain. Hosts two listeners:
        - gRPC ext_authz for Envoy
        - private HTTP API gateway behind the frontend entry
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.36
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - gateway
      - internal-auth
      - observability
      - security
    endpoints:
      - name: grpc
        api: grpc
        visibility: module
        port: 9090
      - name: rest
        api: rest
        visibility: private
        port: 8080
    dependencies:
      - service: accounts
        endpoints:
          - connect
          - grpc
          - rest
      - service: cache
        endpoints:
          - write
      - service: telemetry
        endpoints:
          - grpc
    spec:
      hot-reload: true
      rest-endpoint: true
      runtime-assets:
        - routing
      service-account:
        name: auth-gateway
      protocol-output-dirs:
        - code/pkg/gen
  - name: cache
    version: 0.0.0
    agent:
      kind: codefly:service
      name: redis
      # 0.0.82: read-replica runtime-load fix (two tcp endpoints on one port),
      # codefly-dev/service-redis#16 — resolved, hold lifted.
      version: 0.0.84
      publisher: codefly.dev
    endpoints:
      - name: read
        api: tcp
        visibility: private
        port: 6379
      - name: write
        api: tcp
        visibility: private
        port: 6379
    spec:
      watch: false
      with-read-replicas: true
  - name: frontend
    version: 0.0.0
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.150
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - abuse-protection
      - error-tracking
      - identity
      - internal-auth
      - legal
      - product-analytics
    endpoints:
      - name: http
        api: http
        visibility: public
        port: 3000
    dependencies:
      - service: auth-gateway
        endpoints:
          - rest
    public_egress_ports:
      - 443
    spec:
      # Next dev/Turbopack owns source HMR. Restarting the entire dev server on
      # every TS/TSX save invalidates browser chunks instead of applying HMR.
      hot-reload: false
      execution-profiles:
        local: development
        local-dogfood: development
        production: production
      mode: ssr
      # White-label skin delivery (obin-ai/lodestar#70). The module ships only
      # the MECHANISM: the SSR resolver in src/lib/skin reads a skin descriptor
      # per request from the mounted ConfigMap and applies it on <html>. No skin
      # DATA ships here — obin-fleet supplies the frontend-skin ConfigMap per
      # environment; the compiled default stays brand-neutral. config-mounts is
      # consumed once codefly-dev/service-nextjs#100 renders it and the pin is
      # bumped; the mount is optional so an env with no ConfigMap keeps the
      # default. FRONTEND_SKIN_RUNTIME is a build-time flag: it forces the
      # layout to render dynamically so an image built without a skin still
      # resolves one mounted at runtime.
      config-mounts:
        - name: skin
          config-map: frontend-skin
          mount-path: /etc/codefly/skin
          optional: true
      environment:
        FRONTEND_SKIN_DIR: /etc/codefly/skin
      build-args:
        FRONTEND_SKIN_RUNTIME: "1"
  - name: marketing
    version: 0.0.0
    description: |
      Independently deployable public company site. Owns public content,
      metadata, pricing presentation, and safe product handoff without product
      sessions, tenant state, database access, or secrets.
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.150
      publisher: codefly.dev
    endpoints:
      - name: http
        api: http
        visibility: public
        port: 3000
    public_egress_ports:
      - 443
    spec:
      hot-reload: false
      execution-profiles:
        local: development
        production: production
      mode: ssr
  - name: store
    version: 0.0.0
    agent:
      kind: codefly:service
      name: postgres
      # 0.0.130: Alpine OpenSSL rebuild to 3.5.8-r0 (CVE-2026-14456),
      # codefly-dev/service-postgres#74 — resolved.
      version: 0.0.130
      publisher: codefly.dev
    endpoints:
      - name: tcp
        api: tcp
        visibility: external
        port: 5432
    bootstrap_job_endpoints:
      - tcp
    spec:
      database-name: users
      debug: false
      runtime-read-write-roles:
        - app_tenant
        - app_control_plane
        - app_billing_worker
        - app_webhook_worker
        - app_job_worker
      persist: true
      silent: true
      watch: true
      without-ssl: false
  - name: telemetry
    version: 0.0.0
    description: |
      In-graph OTLP gateway. Accounts resolves this endpoint exclusively
      through the Codefly SDK; the collector either logs locally or forwards
      trace, metric, and log protobufs to a configured OTLP/HTTP destination.
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.36
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - observability
    endpoints:
      - name: grpc
        api: grpc
        visibility: private
        port: 8080
    public_egress_ports:
      - 443
    spec:
      hot-reload: true
      protocol-output-dirs:
        - code/pkg/gen
  - name: vault
    version: 0.0.0
    agent:
      kind: codefly:service
      name: vault
      # 0.0.28: go deps bumped for CVE-2026-56854 (golang.org/x/crypto ssh
      # auth-bypass, CRITICAL) + CVE-2026-84304 (google.golang.org/grpc),
      # codefly-dev/service-vault#42 — resolved.
      version: 0.0.28
      publisher: codefly.dev
    secret_service_configurations:
      - name: vault
        entries:
          - key: vault_token
    endpoints:
      - name: http
        api: http
        visibility: module
        port: 8200
    spec:
      transit-key: api-keys
# Store-writing one-shot deploy step: seeds the composed built-in role catalog
# into the store after its migration. Runs the accounts image (which carries the
# role-catalog-import binary and connects under the app_control_plane migration
# authority) but writes to the store dependency, so it is a module deploy Job,
# not a self-serving store bootstrap_job_endpoints Job. force applies the
# authoritative generated catalog past the importer's empty-catalog truncation
# guard; re-runs of an unchanged catalog are an empty no-op.
deploy_jobs:
  - name: role-catalog-import
    service: accounts
    command: role-catalog-import
    catalog: deployment/generated/contributed-roles.json
    force: true
    writes:
      service: store
      endpoint: tcp
    after:
      - store
