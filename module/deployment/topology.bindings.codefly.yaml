version: v1
module:
  name: saas-starter
  namespace: saas-starter
  service_entry: auth-sidecar
  description: "SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit"
interface:
  - service: auth-sidecar
    endpoint: grpc
    visibility: module
  - service: auth-sidecar
    endpoint: rest
    visibility: public
  - service: marketing
    endpoint: http
    visibility: public
services:
  - name: accounts
    version: 0.0.0
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.21
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - application
      - identity
      - internal-auth
      - security
    endpoints:
      - name: connect
        api: connect
        visibility: private
        port: 8080
      - name: grpc
        api: grpc
        visibility: private
        port: 9090
      - name: rest
        api: rest
        visibility: private
        port: 8080
    dependencies:
      - service: cache
        endpoints:
          - read
          - write
      - service: object-storage
        endpoints:
          - accounts
      - service: store
        endpoints:
          - tcp
      - service: vault
        endpoints:
          - http
    public_egress_ports:
      - 443
    spec:
      hot-reload: true
      rest-endpoint: true
      connect-endpoint: true
      with-workspace: true
      protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
  - name: auth-sidecar
    version: 0.0.0
    description: |
      Single ingress + auth brain. Hosts two listeners:
        - gRPC ext_authz for Envoy
        - HTTP reverse proxy for public and local traffic
    agent:
      kind: codefly:service
      name: go-grpc
      version: 0.1.21
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - gateway
      - internal-auth
      - security
    endpoints:
      - name: grpc
        api: grpc
        visibility: module
        port: 9090
      - name: rest
        api: rest
        visibility: public
        port: 8080
    dependencies:
      - service: accounts
        endpoints:
          - connect
          - grpc
          - rest
      - service: cache
        endpoints:
          - write
      - service: frontend
        endpoints:
          - http
    spec:
      hot-reload: true
      rest-endpoint: true
      protocol-output-dirs:
        - code/pkg/gen
  - name: cache
    version: 0.0.0
    agent:
      kind: codefly:service
      name: redis
      version: 0.0.74
      publisher: codefly.dev
    endpoints:
      - name: read
        api: tcp
        visibility: private
        port: 6379
      - name: write
        api: tcp
        visibility: private
        port: 6379
    spec:
      watch: false
      with-read-replicas: true
  - name: frontend
    version: 0.0.0
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.121
      publisher: codefly.dev
    workspace_configuration_dependencies:
      - identity
    endpoints:
      - name: http
        api: http
        visibility: module
        port: 3000
    dependencies:
      - service: accounts
        endpoints:
          - connect
          - rest
    public_egress_ports:
      - 443
    spec:
      # Next dev/Turbopack owns source HMR. Restarting the entire dev server on
      # every TS/TSX save invalidates browser chunks instead of applying HMR.
      hot-reload: false
      execution-profiles:
        local: development
        local-dogfood: development
        production: production
      mode: ssr
  - name: marketing
    version: 0.0.0
    description: |
      Independently deployable public company site. Owns public content,
      metadata, pricing presentation, and safe product handoff without product
      sessions, tenant state, database access, or secrets.
    agent:
      kind: codefly:service
      name: nextjs
      version: 0.0.118
      publisher: codefly.dev
    endpoints:
      - name: http
        api: http
        visibility: public
        port: 3000
    public_egress_ports:
      - 443
    spec:
      hot-reload: false
      execution-profiles:
        local: development
        production: production
      mode: ssr
  - name: object-storage
    version: 0.0.0
    agent:
      kind: codefly:service
      name: s3
      version: 0.0.16
      publisher: codefly.dev
    secret_service_configurations:
      - name: s3
        entries:
          - key: minio_root_password
          - key: minio_root_user
    endpoints:
      - name: accounts
        api: tcp
        visibility: private
        port: 9000
    spec:
      watch: false
  - name: store
    version: 0.0.0
    agent:
      kind: codefly:service
      name: postgres
      version: 0.0.108
      publisher: codefly.dev
    endpoints:
      - name: tcp
        api: tcp
        visibility: external
        port: 5432
    bootstrap_job_endpoints:
      - tcp
    spec:
      database-name: users
      debug: false
      runtime-read-write-roles:
        - app_tenant
        - app_control_plane
        - app_billing_worker
        - app_webhook_worker
        - app_job_worker
      persist: true
      silent: true
      watch: true
      without-ssl: false
  - name: vault
    version: 0.0.0
    agent:
      kind: codefly:service
      name: vault
      version: 0.0.15
      publisher: codefly.dev
    secret_service_configurations:
      - name: vault
        entries:
          - key: vault_token
    endpoints:
      - name: http
        api: http
        visibility: module
        port: 8200
    spec:
      transit-key: api-keys
