# Store-writing one-shot deploy steps the module bundle emits for the promotion
# driver. A step runs a service's image once with a command and writes to a
# dependency's endpoint; core's job.codefly.yaml describes a runnable job with an
# agent and an execution, which this is not, so these keep a file of their own.
version: v1
deploy_jobs:
  # Seeds the composed built-in role catalog into the store after its migration.
  # Runs the accounts image (which carries the role-catalog-import binary and
  # connects under the app_control_plane migration authority) but writes to the
  # store dependency, so it is a module deploy Job, not a self-serving store
  # bootstrap Job. force applies the authoritative generated catalog past the
  # importer's empty-catalog truncation guard; re-runs of an unchanged catalog
  # are an empty no-op. The import records one audit event per changed role
  # through the same emitter as the accounts service, so it runs under the
  # service's AUDIT_SINK: under a swap value (ADR 0009) its events go to the
  # queue the accounts relay delivers, not to audit_events. AUDIT_SINK is the one
  # audit setting the importer reads; the rest name destinations only the relay
  # writes to. The importer reads it through the same auditsink package as the
  # service but, unlike the service, has no default: if the Job does not receive
  # the variable it exits before touching the store, rather than guess postgres
  # and write its events where a warehouse deployment never reads them. The
  # accounts service manifest declares the raw default AUDIT_SINK=postgres;
  # an explicit environment service-config value replaces it for both service
  # and Job. A driver must resolve service defaults before inheriting them.
  # Automatic promotion requires deploy-job execution and a migration barrier;
  # a driver without that support must refuse this required step.
  - name: role-catalog-import
    service: accounts
    command: role-catalog-import
    catalog: deployment/generated/contributed-roles.json
    force: true
    writes:
      service: store
      endpoint: tcp
    after:
      - store
    service_environment:
      - AUDIT_SINK
