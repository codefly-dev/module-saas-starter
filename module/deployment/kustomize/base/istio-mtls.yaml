apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: saas-starter-mtls
  namespace: saas-starter
spec:
  # STRICT — every pod-to-pod call inside the namespace must be
  # mTLS. Combined with the AuthorizationPolicy below, this gives
  # us identity-based authz: only pods with a known SPIFFE ID
  # signed by Istio's CA can reach our services.
  #
  # NOTE: this requires every workload to have the istio-proxy
  # sidecar (controlled by `istio-injection: enabled` on the
  # namespace). Pods without the sidecar can't speak mTLS and
  # will be rejected — that's the intent.
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: saas-starter
spec:
  # No spec.rules = deny everything by default. Per-service Allow
  # policies (one per Application overlay) explicitly open up the
  # call paths our apps need.
  {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-from-istio-ingress
  namespace: saas-starter
spec:
  # Allow public traffic from the istio ingress-gateway to land
  # on auth-sidecar's HTTP listener. Internal pod→pod calls are
  # gated by separate per-service policies (see overlays).
  selector:
    matchLabels:
      app: auth-sidecar
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            ports:
              - "8080"
              - "80"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-istio-ingress-to-marketing
  namespace: saas-starter
spec:
  selector:
    matchLabels:
      app: marketing
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            ports:
              - "3000"
