apiVersion: v1
kind: ResourceQuota
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  # Hard caps on what the saas-starter namespace can consume.
  # Tune up in prod overlay; these are dev/staging-shaped.
  hard:
    # Compute. Sum of all containers' requests and limits across
    # the namespace. Hitting these blocks new pods from scheduling.
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    # Storage. Aggregate of every PVC in the namespace.
    requests.storage: 100Gi
    persistentvolumeclaims: "20"
    # Object counts. Stops a runaway controller from spamming the
    # API server.
    pods: "60"
    services: "30"
    secrets: "60"
    configmaps: "60"
