apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Module-level shared resources. Per-env overlays add the ArgoCD
# Applications that point at the per-service rendered kustomize trees.
resources:
  - namespace.yaml          # PSS labels, istio-injection
  - project.yaml            # ArgoCD AppProject (RBAC scope)
  - resource-quota.yaml     # namespace-wide CPU/memory/PVC caps
  - limit-range.yaml        # default + max requests/limits per container
  - network-policy.yaml     # generated default-deny + topology-scoped allows
  - istio-mtls.yaml         # STRICT mTLS + AuthorizationPolicy default-deny
  - istio-gateway.yaml      # public ingress → auth-sidecar + DestinationRule defaults
