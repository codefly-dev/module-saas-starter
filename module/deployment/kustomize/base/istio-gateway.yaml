apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  # Use the cluster's istio ingress gateway. Override in the prod
  # overlay if you run multiple ingress gateways (e.g. one per
  # tenant) by patching the selector here.
  selector:
    istio: ingressgateway
  servers:
    # HTTP (dev / pre-cert): redirect to HTTPS in the prod overlay
    # by adding `tls.httpsRedirect: true`.
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    # HTTPS — the cert lives as a k8s Secret in the istio-system
    # namespace. Bootstrap one with cert-manager + an Issuer
    # pointing at Let's Encrypt or your CA, then patch this
    # Gateway in the prod overlay to reference it by name.
    # Left commented in base/ so dev/k3d still works without a cert.
    # - port:
    #     number: 443
    #     name: https
    #     protocol: HTTPS
    #   tls:
    #     mode: SIMPLE
    #     credentialName: saas-starter-tls
    #   hosts:
    #     - app.example.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  hosts:
    - "*"
  gateways:
    - saas-starter
  http:
    # Local host routing preserves independent public and authenticated
    # runtimes. Production overlays replace these .localhost authorities with
    # exact adopter domains.
    - name: marketing
      match:
        - authority:
            regex: "^((www|docs)\\.)?saas\\.localhost(:[0-9]+)?$"
      route:
        - destination:
            host: marketing.saas-starter.svc.cluster.local
            port:
              number: 3000
      timeout: 10s
      retries:
        attempts: 1
        perTryTimeout: 5s
        retryOn: gateway-error,connect-failure,refused-stream
      headers:
        response:
          set:
            Cache-Control: "public, max-age=60, stale-while-revalidate=300"
    # Product traffic continues through auth-sidecar so the gateway remains
    # the only browser-facing authentication and API boundary.
    - match:
        - authority:
            regex: "^app\\.saas\\.localhost(:[0-9]+)?$"
      route:
        - destination:
            host: auth-sidecar.saas-starter.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
    # Backward-compatible local fallback for existing localhost workflows.
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: auth-sidecar.saas-starter.svc.cluster.local
            port:
              number: 8080
      # Defaults for the public path. Tune in overlays per
      # tenant tier or per-route.
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: saas-starter-defaults
  namespace: saas-starter
spec:
  # Apply to every host in the namespace. The exportTo restricts
  # propagation so other namespaces' VirtualServices don't pick
  # this up by accident.
  host: "*.saas-starter.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    # Connection-pool defaults — keep socket counts sane and avoid
    # connection storms during deploys.
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    # Outlier detection — eject pods that fail repeatedly so a
    # bad replica during rollout doesn't poison the connection
    # pool for 30s+.
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
