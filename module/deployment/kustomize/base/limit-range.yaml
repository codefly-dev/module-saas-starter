apiVersion: v1
kind: LimitRange
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  # Defaults applied to any container that doesn't specify its own
  # requests/limits. Stops "I forgot" pods from being unbounded —
  # critical when ResourceQuota is in force (a pod with no requests
  # is rejected outright otherwise).
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      # Per-container ceilings. Stops a single misbehaving pod from
      # eating the whole namespace quota.
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
    # PVCs. Same idea — bound the size to keep storage costs sane.
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi
