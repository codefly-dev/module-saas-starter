apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: saas-starter
  namespace: argocd
  # Without finalizer, deleting the project orphans Applications.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: saas-starter module — RBAC scope for all per-service Applications.

  # Where Applications can pull manifests from. Tighten this in a
  # real install to your actual git remote.
  sourceRepos:
    - "*"

  # Where Applications can sync to. Locks the project to the
  # saas-starter namespace + the in-cluster server. Add additional
  # destinations (other clusters, other namespaces) explicitly here.
  destinations:
    - namespace: saas-starter
      server: https://kubernetes.default.svc

  # Allow the namespaced resource kinds Applications need.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Cluster-scoped resources are tighter — only what the per-service
  # agents emit (Namespace is whitelisted because some agent overlays
  # include one, which kustomize merges with the base).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
