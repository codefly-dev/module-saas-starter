apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3d / kind overlay. All seven services run in-cluster.
# After scaffolding, populate the repoURL field in each Application
# (search for REPLACE_ME) with your actual git remote, then commit
# the rendered tree.

resources:
  - ../../base
  - applications/accounts.yaml
  - applications/auth-sidecar.yaml
  - applications/frontend.yaml
  - applications/store.yaml
  - applications/cache.yaml
  - applications/vault.yaml
  - applications/object-storage.yaml
