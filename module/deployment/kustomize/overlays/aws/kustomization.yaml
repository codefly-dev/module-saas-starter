apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS EKS production overlay. Only the three application services run
# in-cluster. Stateful dependencies (store / cache / vault / object-storage)
# are AWS-managed:
#
#   store          → Amazon RDS for Postgres
#   cache          → Amazon ElastiCache for Redis
#   vault          → AWS Secrets Manager (or a dedicated Vault cluster)
#   object-storage → Amazon S3
#
# Connection strings are wired via External Secrets Operator (which
# pulls from Secrets Manager / SSM Parameter Store) into Kubernetes
# Secrets that the in-cluster apps consume. See externalname-services/
# below — those are the service-discovery shims so app code can keep
# using "store", "cache", etc. as DNS names regardless of where they
# actually live.
#
# When you bootstrap this overlay, populate REPLACE_ME in each
# Application with your git remote.

resources:
  - ../../base
  - applications/accounts.yaml
  - applications/auth-sidecar.yaml
  - applications/frontend.yaml

  # External-name shims so saas-starter:5432 resolves to the RDS
  # endpoint, etc. Uncomment + fill in once your AWS resources are
  # provisioned.
  # - externalname-services/store.yaml
  # - externalname-services/cache.yaml
  # - externalname-services/vault.yaml
  # - externalname-services/object-storage.yaml
