apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - example.com
        - www.example.com
        - app.example.com
        - docs.example.com
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - example.com
        - www.example.com
        - app.example.com
        - docs.example.com
      tls:
        mode: SIMPLE
        credentialName: replace-with-certificate-secret
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: saas-starter
  namespace: saas-starter
spec:
  hosts:
    - example.com
    - www.example.com
    - app.example.com
    - docs.example.com
  gateways:
    - saas-starter
  http:
    - name: apex-redirect
      match:
        - authority:
            exact: example.com
      redirect:
        authority: www.example.com
        redirectCode: 308
    - name: marketing
      match:
        - authority:
            exact: www.example.com
        - authority:
            exact: docs.example.com
      route:
        - destination:
            host: marketing.saas-starter.svc.cluster.local
            port:
              number: 3000
    - name: product
      match:
        - authority:
            exact: app.example.com
      route:
        - destination:
            host: auth-sidecar.saas-starter.svc.cluster.local
            port:
              number: 8080
