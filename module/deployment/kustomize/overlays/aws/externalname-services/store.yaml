apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: saas-starter
spec:
  # ExternalName Service — DNS lookup for `store.saas-starter.svc.cluster.local`
  # returns this CNAME. Lets app code keep saying "store:5432" while the
  # actual database lives on RDS. Replace with your provisioned RDS
  # writer endpoint.
  type: ExternalName
  externalName: REPLACE_ME.cluster-XXXX.us-east-1.rds.amazonaws.com
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
