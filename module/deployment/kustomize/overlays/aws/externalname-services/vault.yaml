apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: saas-starter
spec:
  # If you keep a HashiCorp Vault cluster outside the EKS cluster
  # (recommended for prod — separate failure domain from the apps),
  # point this at its load balancer. Otherwise use AWS Secrets
  # Manager directly via External Secrets Operator and remove this
  # Service entirely.
  type: ExternalName
  externalName: REPLACE_ME.vault.example.com
  ports:
    - port: 8200
      targetPort: 8200
      protocol: TCP
