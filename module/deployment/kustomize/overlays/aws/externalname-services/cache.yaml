apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: saas-starter
spec:
  # Points DNS for `cache` at the ElastiCache primary endpoint. For
  # cluster-mode, prefer a Configuration endpoint and let the client
  # discover shards.
  type: ExternalName
  externalName: REPLACE_ME.XXXX.ng.0001.use1.cache.amazonaws.com
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
