apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas-starter-accounts-aws
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: saas-starter
  source:
    repoURL: REPLACE_ME
    targetRevision: main
    path: deployments/modules/saas-starter/services/accounts/overlays/aws
  destination:
    # Defaults to the cluster ArgoCD is running in. If ArgoCD lives on
    # a separate management cluster, change to the registered cluster
    # name (e.g. https://<eks-endpoint>.eks.amazonaws.com).
    server: https://kubernetes.default.svc
    namespace: saas-starter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
