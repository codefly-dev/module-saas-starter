# dev-admin fixture — seeds a complete dev environment
# Used with: codefly run service --fixture dev-admin
# This file is shared across all services in the module, and it is the ONE
# fixture every composition seeds — a module playground, a module page or a
# solution run locally with the authority. Its five people are the same
# everywhere:
#
#   admin@acme.com   Sarah Chen    the platform admin (super_admin), owner of Acme Corp
#   alice@acme.com   Alice Johnson the organisation admin of Acme Corp
#   bob@acme.com     Bob Williams  a member: the viewer of every target
#   carol@acme.com   Carol Davis   a member: the editor of every target
#   dana@example.com Dana Lee      a member: the installer of every target
#
# Every role-gated target the composition delivers (a solution, a module page
# declaring roles) is installed at Acme Corp by Alice, each declared role to
# its `<target>-<role>` team, and Bob, Carol and Dana join the team of their
# role (`installations`, below). Signed in as Sarah or Alice, "Act as this
# team" on any of those teams opens a session that is that team and nothing
# else; signed in as Bob, Carol or Dana, the product shows that one team's
# reach. The other people below are the authority interface's own local
# fixture, kept for parity with its sign-in page.

# User ids are pinned so a reseed keeps the same principal uuid: committed
# configuration (grants, e2e specs, runbooks) can quote a fixture principal
# without re-deriving it after every fresh seed.
users:
  - id: 00000000-0000-7000-8000-0000000000a1
    email: admin@acme.com
    name: Sarah Chen
    role: super_admin
    provider: email
    provider_id: dev-admin
    # Development-only assurance attestation. The fixture validator is never
    # wired in production; this lets browser journeys exercise strict AAL2
    # operations without weakening their runtime policy.
    mfa_verified: true

  - id: 00000000-0000-7000-8000-0000000000a2
    email: alice@acme.com
    name: Alice Johnson
    role: admin
    provider: email
    provider_id: dev-alice

  - id: 00000000-0000-7000-8000-0000000000a3
    email: bob@acme.com
    name: Bob Williams
    role: member
    provider: email
    provider_id: dev-bob

  - id: 00000000-0000-7000-8000-0000000000a4
    email: carol@acme.com
    name: Carol Davis
    role: member
    provider: email
    provider_id: dev-carol

  - id: 00000000-0000-7000-8000-0000000000a5
    email: dana@example.com
    name: Dana Lee
    role: member
    provider: email
    provider_id: dev-dana

  # The people of the host authority interface's local fixture, signed in by
  # the same fixture tokens, so a composition whose host is accounts offers the
  # sign-in page the authority gateway offers, with the same organisations and
  # teams. What they hold at a composed module is a role over that module's
  # permissions, which this host cannot name: the composing workspace's own
  # fixture adds those roles and assigns them by email (`assignments`). Here
  # alex and dev are Acme administrators and zoe owns Globex. maya's and remi's
  # names carry no role word: which module role each holds is the composing
  # workspace's choice, and a sign-in page naming the opposite one misleads.
  - id: 00000000-0000-7000-8000-0000000000b1
    email: maya@acme.test
    name: Maya Rossi
    role: member
    provider: email
    provider_id: fixture-maya

  - id: 00000000-0000-7000-8000-0000000000b2
    email: remi@acme.test
    name: Remi Laurent
    role: member
    provider: email
    provider_id: fixture-remi

  - id: 00000000-0000-7000-8000-0000000000b3
    email: alex@acme.test
    name: Alex Admin
    role: member
    provider: email
    provider_id: fixture-alex

  - id: 00000000-0000-7000-8000-0000000000b4
    email: dev@acme.test
    name: Dev Developer
    role: member
    provider: email
    provider_id: fixture-dev

  - id: 00000000-0000-7000-8000-0000000000b5
    email: zoe@globex.test
    name: Zoe Admin
    role: member
    provider: email
    provider_id: fixture-zoe

  - id: 00000000-0000-7000-8000-0000000000b6
    email: omar@globex.test
    name: Omar Member
    role: member
    provider: email
    provider_id: fixture-omar

# Organization ids are pinned for the same reason as user ids: a module
# principal grant (the module envelope) names its tenant by organization id, and a
# committed grant can only quote an id that survives a fresh seed.
organizations:
  - id: 00000000-0000-7000-8000-0000000000c1
    name: Acme Corp
    owner: admin@acme.com
    members:
      - email: alice@acme.com
        role: admin
      - email: bob@acme.com
        role: member
      - email: carol@acme.com
        role: member
      - email: dana@example.com
        role: member
      - email: maya@acme.test
        role: member
      - email: remi@acme.test
        role: member
      - email: alex@acme.test
        role: admin
      - email: dev@acme.test
        role: admin

  - id: 00000000-0000-7000-8000-0000000000c2
    name: Globex
    owner: zoe@globex.test
    members:
      - email: omar@globex.test
        role: member

teams:
  - name: Engineering
    org: Acme Corp
    members:
      - alice@acme.com
      - bob@acme.com
      - remi@acme.test
      - alex@acme.test
      - dev@acme.test

  - name: Design
    org: Acme Corp
    members:
      - carol@acme.com

  - name: Finance
    org: Acme Corp
    members:
      - maya@acme.test
      - alex@acme.test

  - name: Ops
    org: Globex
    members:
      - zoe@globex.test
      - omar@globex.test

roles:
  - org: Acme Corp
    name: Collection reader
    description: Read collection content in explicitly granted collections
    permissions:
      - resource: example-records
        action: read

collections:
  - org: Acme Corp
    label: Example Collection
    role: Collection reader
    readers:
      - admin@acme.com
      - bob@acme.com

# The same people on every target: a row whose target is "*" stands for every
# role-gated target the composition delivers to this host, whatever the
# composition is, so no composition has to name its targets here. It is
# expanded at each delivery pass into one installation per such target —
# installed by Alice as an administrator installs it, each declared role to
# its `<target>-<role>` team — and each member joins the team of the role
# named, where the target declares that role. A composing workspace's
# `fixture-grants.yaml` may still name a target explicitly; that row is kept
# and the target is not expanded again.
installations:
  - org: Acme Corp
    target: "*"
    owner: alice@acme.com
    members:
      viewer: [bob@acme.com]
      editor: [carol@acme.com]
      installer: [dana@example.com]
