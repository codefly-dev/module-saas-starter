kind: module
name: saas-starter
description: SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit
service-entry: frontend
# An interface entry EXPORTS an endpoint; it does not grant reach to it. The
# `allow-modules` wildcards that used to sit on these four entries are deleted,
# because core v0.14.0 refuses the key here by name: "an allow-list is derived
# from the consumers' declared service dependencies, never written by the module
# it would grant — a module asks for what it consumes, and the target names
# nobody". A host writing `["*"]` was answering a question that is not its to
# answer, and the wildcard made it unanswerable besides.
interface:
    endpoints:
        - service: accounts
          endpoint: authority
          visibility: internal
        - service: accounts
          endpoint: connect
          visibility: internal
          # The published host authority interfaces, served where their
          # services are mounted: the Connect listener, which serves every
          # interface method under its own policy (the authority endpoint
          # admits only the internal module-authority procedures). The same
          # contract the authority gateway implements for a local run. A
          # consumer depends on the interface, never on this service.
          implements:
              - codefly.dev/artifact@0.1.0
              - codefly.dev/authority@0.3.5
              - codefly.dev/composition@0.2.0
              - codefly.dev/installation@0.4.0
              - codefly.dev/session@0.2.0
        - service: auth-gateway
          endpoint: grpc
          visibility: internal
        # The hop on a cell: every module call goes through it. The list is
        # sorted by service and endpoint: the topology compiler requires it.
        - service: auth-gateway
          endpoint: hop
          visibility: internal
        - service: auth-gateway
          endpoint: rest
          visibility: internal
        - service: auth-gateway
          endpoint: workload
          visibility: internal
        - service: frontend
          endpoint: http
          visibility: public
        - service: marketing
          endpoint: http
          visibility: public
services:
    - name: accounts
    - name: auth-gateway
    - name: cache
    - name: frontend
    - name: marketing
    - name: object-storage
    - name: store
    - name: vault
