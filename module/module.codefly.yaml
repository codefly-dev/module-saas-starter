kind: module
name: saas-starter
description: SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit
service-entry: frontend
# An interface entry EXPORTS an endpoint; it does not grant reach to it. The
# `allow-modules` wildcards that used to sit on these four entries are deleted,
# because core v0.14.0 refuses the key here by name: "an allow-list is derived
# from the consumers' declared service dependencies, never written by the module
# it would grant — a module asks for what it consumes, and the target names
# nobody". A host writing `["*"]` was answering a question that is not its to
# answer, and the wildcard made it unanswerable besides.
interface:
    endpoints:
        - service: accounts
          endpoint: authority
          visibility: internal
          # The host authority interfaces (obin-ai/authority): the same contract
          # the mini gateway implements for a local run. A consumer depends on
          # the interface, never on this service.
          implements:
              - obin.ai/authority@0.1.0
              - obin.ai/composition@0.1.0
              - obin.ai/installation@0.1.0
              - obin.ai/session@0.1.0
        - service: accounts
          endpoint: connect
          visibility: internal
        - service: auth-gateway
          endpoint: grpc
          visibility: internal
        - service: auth-gateway
          endpoint: rest
          visibility: internal
        - service: auth-gateway
          endpoint: workload
          visibility: internal
        - service: frontend
          endpoint: http
          visibility: public
        - service: marketing
          endpoint: http
          visibility: public
services:
    - name: accounts
    - name: auth-gateway
    - name: cache
    - name: frontend
    - name: marketing
    - name: policy-log
    - name: store
    - name: telemetry
    - name: vault
