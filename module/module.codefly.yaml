kind: module
name: saas-starter
description: "SaaS foundation — auth, multi-tenancy, RBAC, OPA gateway, impersonation, audit"
interface:
    endpoints:
        # Public ingress — every external request enters through the gateway
        # hosted by auth-sidecar. Frontend and api are internal only.
        - service: auth-sidecar
          endpoint: http
          visibility: public
        - service: auth-sidecar
          endpoint: grpc
          visibility: module
        - service: api
          endpoint: grpc
          visibility: module
        - service: api
          endpoint: connect
          visibility: module
        - service: frontend
          endpoint: http
          visibility: module
services:
    - name: store
    - name: vault
    - name: api
    - name: auth-sidecar
    - name: cache
    - name: frontend
