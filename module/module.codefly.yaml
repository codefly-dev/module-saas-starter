kind: module
name: saas-starter
description: SaaS foundation — auth, multi-tenancy, generated RPC policy, RBAC, impersonation, audit
service-entry: frontend
interface:
    endpoints:
        - service: accounts
          endpoint: authority
          visibility: module
        - service: accounts
          endpoint: connect
          visibility: module
        - service: auth-gateway
          endpoint: grpc
          visibility: module
        - service: auth-gateway
          endpoint: rest
          visibility: module
        - service: frontend
          endpoint: http
          visibility: public
        - service: marketing
          endpoint: http
          visibility: public
services:
    - name: accounts
    - name: auth-gateway
    - name: cache
    - name: frontend
    - name: marketing
    - name: store
    - name: telemetry
    - name: vault
