syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Audit Log
// ============================================================================

message AuditEvent {
  string id = 1;
  string actor_id = 2;
  string actor_type = 3;
  string action = 4 [deprecated = true]; // superseded by event_type
  string resource = 5;
  string resource_id = 6;
  string org_id = 7;
  map<string, string> metadata = 8 [deprecated = true]; // superseded by payload
  string ip_address = 9;
  google.protobuf.Timestamp created_at = 10;
  // event_type is the registered discriminator (see the typed audit-event
  // registry). schema_version records which payload schema the row was written
  // against; payload is the typed, per-type payload; category groups types.
  string event_type = 11;
  int32 schema_version = 12;
  google.protobuf.Struct payload = 13;
  string category = 14;
}

message QueryAuditLogRequest {
  string org_id = 1;
  string actor_id = 2;
  string action = 3 [deprecated = true]; // use event_type
  string resource = 4;
  string resource_id = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  int32 page_size = 8 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  string page_token = 9;
  string event_type = 10;
  string category = 11;
  // payload_contains is a JSONB containment filter: every key/value must match
  // the event's payload.
  map<string, string> payload_contains = 12;
}

message QueryAuditLogResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ExportAuditLogRequest {
  string org_id = 1;
  string format = 2; // "csv" or "json"
  string actor_id = 3;
  string action = 4 [deprecated = true]; // use event_type
  string event_type = 5;
}

message ExportAuditLogResponse {
  bytes data = 1;
  string content_type = 2;
  string filename = 3;
}

// AuditMetric is one aggregation computed per group. op selects the function;
// field names the payload key it reads. A payload field is written
// "payload:<key>" (e.g. "payload:amount"); the bare column names actor_id,
// event_type, category, resource, resource_id are also accepted by
// count_distinct.
message AuditMetric {
  // op ∈ {count, count_distinct, sum, avg, min, max, percentile}.
  string op = 1;
  // field is required for every op except count. Numeric ops (sum/avg/min/max/
  // percentile) require a "payload:<key>" field; non-numeric payload values are
  // ignored.
  string field = 2;
  // percentile ∈ (0,1], used only when op == percentile (0.95 → p95).
  double percentile = 3;
  // alias names this metric in the response map. Defaults to "count" for count,
  // else "<op>_<key>".
  string alias = 4;
}

// AuditDerivedMetric is a ratio of two other metrics computed per group (e.g. an
// error rate). numerator/denominator reference metric aliases. The ratio is
// omitted for a group where either operand is absent or the denominator is 0 —
// an undefined ratio is "no data", not zero.
message AuditDerivedMetric {
  string alias = 1;
  string numerator = 2;
  string denominator = 3;
}

message AggregateAuditLogRequest {
  string org_id = 1;
  string actor_id = 2;
  string event_type = 3;
  string category = 4;
  string resource = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  // group_by ∈ {event_type, category, actor, time, payload:<key>}. Defaults to
  // event_type. Superseded by group_bys when that is set.
  string group_by = 8;
  // bucket sizes the time grain for a "time" dimension: day|week|month.
  string bucket = 9;
  // group_bys lists group dimensions for multi-dimensional grouping. When set it
  // supersedes group_by; each entry is one of the group_by values above.
  repeated string group_bys = 10;
  // metrics selects the aggregations computed per group. When empty a single
  // COUNT(*) is returned.
  repeated AuditMetric metrics = 11;
  // derived computes ratios of the metrics above, per group.
  repeated AuditDerivedMetric derived = 12;
}

message AuditAggregateBucket {
  // key is the first group dimension's value; keys holds every dimension.
  string key = 1;
  // count is the group's COUNT(*), always populated for back-compat and also
  // available in metrics under any requested count alias.
  int64 count = 2;
  // keys are the group dimension values, aligned with the effective group_bys.
  repeated string keys = 3;
  // metrics maps each requested metric and derived alias to its value. An alias
  // is omitted for a group where the metric is undefined (min/avg/max/percentile
  // over zero numeric values) — absence means "no data", not zero.
  map<string, double> metrics = 4;
}

message AggregateAuditLogResponse {
  repeated AuditAggregateBucket buckets = 1;
}

message ListAuditEventTypesRequest {}

message AuditEventType {
  string name = 1;
  int32 version = 2;
  string category = 3;
  string owner = 4;
  bool deprecated = 5;
  string description = 6;
}

message ListAuditEventTypesResponse {
  repeated AuditEventType types = 1;
}

// AuditService — append-only audit event log
service AuditService {
  rpc QueryAuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "audit:read"
      scopes: "audit:read"
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/audit-log"};
  }
  rpc AggregateAuditLog(AggregateAuditLogRequest) returns (AggregateAuditLogResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "audit:read"
      scopes: "audit:read"
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/audit-log:aggregate"};
  }
  rpc ListAuditEventTypes(ListAuditEventTypesRequest) returns (ListAuditEventTypesResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_NONE
      permissions: "audit:read"
      scopes: "audit:read"
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_INTERNAL
      response_sensitivity: SENSITIVITY_INTERNAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/audit-event-types"};
  }
  rpc ExportAuditLog(ExportAuditLogRequest) returns (ExportAuditLogResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "audit:read"
      scopes: "audit:read"
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/audit-log:export"
      body: "*"
    };
  }
}
