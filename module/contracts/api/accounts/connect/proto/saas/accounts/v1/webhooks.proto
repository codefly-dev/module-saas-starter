syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Webhooks
// ============================================================================

enum WebhookDeliveryStatus {
	WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
	WEBHOOK_DELIVERY_STATUS_PENDING = 1;
	WEBHOOK_DELIVERY_STATUS_SUCCESS = 2;
	WEBHOOK_DELIVERY_STATUS_FAILED = 3;
	reserved 4 to 6;
}

message WebhookSubscription {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  string url = 3 [(buf.validate.field).string.uri = true];
  repeated string events = 4;
  bool active = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
  // Generated by the server and returned only by CreateSubscription. List and
  // all later reads leave this empty; store it in the consumer immediately.
  string secret = 8;
}

message WebhookDelivery {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string subscription_id = 2 [(buf.validate.field).string.uuid = true];
  string event_type = 3;
  string payload = 4;
  WebhookDeliveryStatus status = 5;
  int32 attempts = 6;
  int32 http_status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp delivered_at = 9;
  // response_body — captured upstream response (truncated server-side
  // to 4KiB). Empty when the request never connected.
  string response_body = 10;
	reserved 11;
  // Stable across endpoint fan-out and manual replay; use with the signed
  // timestamp to reject replayed events idempotently.
  string event_id = 12 [(buf.validate.field).string.uuid = true];
	reserved 13;
	google.protobuf.Timestamp last_attempt_at = 14;
	reserved 15, 16;
}

message CreateWebhookSubscriptionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string url = 2 [(buf.validate.field).string.uri = true];
  repeated string events = 3;
  string description = 4;
}

message DeleteWebhookSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListWebhookSubscriptionsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  string page_token = 3;
}

message ListWebhookSubscriptionsResponse {
  repeated WebhookSubscription subscriptions = 1;
  string next_page_token = 2;
}

message ListWebhookDeliveriesRequest {
  string subscription_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  string page_token = 3;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  string next_page_token = 2;
}

message TestWebhookRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // event_type to queue. Empty defaults to "webhook.test"; otherwise it must
  // use the same canonical lowercase routing vocabulary as subscriptions. The
  // payload is server-generated and the generic outbox worker sends it.
  string event_type = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 128
      pattern: "^[a-z][a-z0-9._-]*$"
    }
  ];
}

message GetWebhookDeliveryRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ReplayWebhookDeliveryRequest {
  // Queue the existing delivery's exact payload for its subscription's current
  // URL and secret. The result is a NEW pending delivery row; the original row
  // is unchanged and the generic outbox worker owns execution.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RotateWebhookSecretRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // grace_period_seconds — how long the OLD secret stays valid for
  // signature verification on incoming replays. 0 = revoke
  // immediately; 86400 (24h) is the recommended default for staged
  // rollouts. Bound to a 7-day max server-side.
  int32 grace_period_seconds = 2;
}

message RotateWebhookSecretResponse {
  // The new signing secret, returned ONCE on rotation. Show + copy
  // in the FE; not retrievable again.
  string secret = 1;
  google.protobuf.Timestamp old_secret_expires_at = 2;
}

// WebhookService — webhook subscription and delivery management
service WebhookService {
  rpc CreateSubscription(CreateWebhookSubscriptionRequest) returns (WebhookSubscription) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "webhooks:write"
      scopes: "webhooks:write"
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "webhook.created"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/webhooks"
      body: "*"
    };
  }
  rpc DeleteSubscription(DeleteWebhookSubscriptionRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "webhooks:write"
      scopes: "webhooks:write"
      resource_bindings: {
        request_field: "id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "webhook.deleted"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {delete: "/v1/webhooks/{id}"};
  }
  rpc ListSubscriptions(ListWebhookSubscriptionsRequest) returns (ListWebhookSubscriptionsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "webhooks:read"
      scopes: "webhooks:read"
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/webhooks"};
  }
  rpc ListDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "webhooks:read"
      scopes: "webhooks:read"
      resource_bindings: {
        request_field: "subscription_id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/webhooks/{subscription_id}/deliveries"};
  }
  rpc GetDelivery(GetWebhookDeliveryRequest) returns (WebhookDelivery) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "webhooks:read"
      scopes: "webhooks:read"
      resource_bindings: {
        request_field: "id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/webhooks/deliveries/{id}"};
  }
  rpc ReplayDelivery(ReplayWebhookDeliveryRequest) returns (WebhookDelivery) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "webhooks:write"
      scopes: "webhooks:write"
      resource_bindings: {
        request_field: "id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "webhook.replayed"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/webhooks/deliveries/{id}:replay"
      body: "*"
    };
  }
  rpc TestWebhook(TestWebhookRequest) returns (WebhookDelivery) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "webhooks:write"
      scopes: "webhooks:write"
      resource_bindings: {
        request_field: "id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/webhooks/{id}:test"
      body: "*"
    };
  }
  rpc RotateSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      permissions: "webhooks:write"
      scopes: "webhooks:write"
      resource_bindings: {
        request_field: "id"
        target: RESOURCE_TARGET_OWNED_RESOURCE
        lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION
      }
      mfa: MFA_REQUIREMENT_RECENT_STEP_UP
      audit: {
        events: "webhook.secret_rotated"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_SENSITIVE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/webhooks/{id}:rotateSecret"
      body: "*"
    };
  }
}
