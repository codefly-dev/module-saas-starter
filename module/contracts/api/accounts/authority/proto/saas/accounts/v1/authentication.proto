syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "saas/accounts/v1/common.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Authentication (JWT token issuance)
// ============================================================================

message OAuthCodeAuthentication {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string redirect_uri = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  string state = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string code_verifier = 4 [(buf.validate.field).string = {
    min_len: 43
    max_len: 128
    pattern: "^[A-Za-z0-9._~-]+$"
  }];
}

message FixtureAuthentication {
  // Opaque token looked up in the explicitly selected development fixture.
  // It is not a provider subject and is never trusted without the fixture
  // validator.
  string token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message HeaderJWTAuthentication {
  // Signed JWT copied verbatim by the login route from the gateway-injected
  // identity header. It is verified against the configured JWKS (or, under an
  // explicit perimeter-trust decode mode, decoded with exp/aud still enforced)
  // before any claim is trusted.
  string token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
}

message AuthenticateRequest {
  string provider = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  // Deprecated caller-asserted identity fields. Kept only for wire
  // compatibility during the v0 transition; Authenticate ignores them.
  string provider_id = 2 [deprecated = true];
  string provider_email = 3 [deprecated = true];
  bool email_verified = 4 [deprecated = true];
  // Optional signup/profile metadata. OAuth protocol fields do not belong here.
  map<string, string> profile = 5;
  // Bounded display-only device description (typically the browser user-agent).
  // It is persisted with the refresh family for session management and is
  // never trusted as an authentication or authorization signal.
  string device_info = 6 [(buf.validate.field).string.max_len = 512];
  oneof authentication {
    option (buf.validate.oneof).required = true;
    OAuthCodeAuthentication oauth_code = 7;
    FixtureAuthentication fixture = 8;
    HeaderJWTAuthentication header_jwt = 9;
  }
}

message AuthenticateResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
  bool mfa_required = 5;
  // Opaque, short-lived, one-use login transaction. Present only when
  // mfa_required is true; it is not an access or refresh token.
  string mfa_token = 6;
}

// CompleteMFAChallengeRequest is deliberately distinct from VerifyTOTPRequest:
// this completes a login transaction, while VerifyTOTP only confirms a new
// authenticator during enrollment.
message CompleteMFAChallengeRequest {
  string mfa_token = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 255
  }];
  // Six-digit TOTP or a one-use backup code.
  string code = 2 [(buf.validate.field).string = {
    min_len: 6
    max_len: 64
  }];
}

message CompleteMFAChallengeResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

// Begins a WebAuthn assertion for an existing primary-authentication handoff.
// The mfa_token remains the login credential; the returned ceremony token is
// an independently random, short-lived handle for server-side WebAuthn state.
message BeginWebAuthnMFAChallengeRequest {
  string mfa_token = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 255
  }];
}

message BeginWebAuthnMFAChallengeResponse {
  string ceremony_token = 1;
  // JSON-encoded PublicKeyCredentialRequestOptions. The browser hands these
  // generated options directly to the WebAuthn API.
  string public_key_options_json = 2;
}

message CompleteWebAuthnMFAChallengeRequest {
  string mfa_token = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 255
  }];
  string ceremony_token = 2 [(buf.validate.field).string = {
    min_len: 32
    max_len: 255
  }];
  // JSON-encoded PublicKeyCredential assertion returned by the browser.
  string credential_response_json = 3 [(buf.validate.field).string = {
    min_len: 2
    max_len: 131072
  }];
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message SwitchOrganizationRequest {
  // Target tenant for this existing device session. The server resolves the
  // caller's current membership and role; no role is accepted from the client.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
}

message SwitchOrganizationResponse {
  // Fresh access token for organization_id. The refresh token and device
  // family do not rotate, so switching cannot race with normal refresh-token
  // reuse detection or create an extra active device.
  string access_token = 1;
  int64 expires_in = 2;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message JWKSResponse {
  string keys_json = 1;
}

// BeginOAuthRequest is the FE's first hop on the authorization-code
// flow. Server returns a server-signed `state` token bound to
// (provider, redirect_uri); the FE embeds it in the provider's
// authorize URL alongside its own PKCE code_challenge. Authenticate
// later verifies the state before exchanging the code.
message BeginOAuthRequest {
  string provider = 1 [(buf.validate.field).string.min_len = 1];
  string redirect_uri = 2 [(buf.validate.field).string.min_len = 1];
}

message BeginOAuthResponse {
  // state is opaque to the FE — pass it back unchanged in the
  // authorize URL and again in the Authenticate request.
  string state = 1;
}

// ============================================================================
// First-party client authorization (issue #853)
//
// A registered client (see clients.proto) sends the person to the host's login
// page rather than to an identity provider. The three RPCs below are the whole
// of the client's side of that flow: validate the request before any sign-in UI
// is shown, issue a one-time code once the person is signed in, and exchange
// that code — or a previously issued refresh token — for tokens in the response
// body. A public client never receives the host's session cookie.
// ============================================================================

// ClientAuthorizationRequest is the authorization request a client encodes into
// the host's login-page URL. code_challenge is the S256 hash of a verifier the
// client keeps, so an intercepted code cannot be redeemed by anyone else.
message ClientAuthorizationRequest {
  string client_id = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 64
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];
  string redirect_uri = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // Base64url-encoded SHA-256 of the client's code verifier (RFC 7636 S256).
  string code_challenge = 3 [(buf.validate.field).string = {
    min_len: 43
    max_len: 128
    pattern: "^[A-Za-z0-9._~-]+$"
  }];
  // S256 is the only accepted method. It is carried explicitly so a client
  // sending "plain" is refused rather than silently upgraded.
  string code_challenge_method = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
}

message ValidateClientAuthorizationRequest {
  ClientAuthorizationRequest authorization = 1 [(buf.validate.field).required = true];
}

// ValidateClientAuthorizationResponse carries only what the login page needs to
// name the client to the person. The registry itself — other redirect URIs, the
// client's origins — is never served to a browser.
message ValidateClientAuthorizationResponse {
  string client_name = 1;
}

message IssueClientAuthorizationCodeRequest {
  ClientAuthorizationRequest authorization = 1 [(buf.validate.field).required = true];
}

message IssueClientAuthorizationCodeResponse {
  // One-time authorization code, valid for expires_in seconds and bound to the
  // client, redirect URI, and code challenge it was issued against.
  string code = 1;
  int64 expires_in = 2;
}

// AuthorizationCodeGrant redeems a code issued by IssueClientAuthorizationCode.
// redirect_uri must be the one the code was issued for, and code_verifier the
// preimage of its challenge.
message AuthorizationCodeGrant {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  string redirect_uri = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  string code_verifier = 3 [(buf.validate.field).string = {
    min_len: 43
    max_len: 128
    pattern: "^[A-Za-z0-9._~-]+$"
  }];
}

// ClientRefreshTokenGrant rotates a client's own refresh token. The presented
// token must belong to the named client: one client can never refresh another's
// session, and the host's own web session is not refreshable here at all.
message ClientRefreshTokenGrant {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message ExchangeClientTokenRequest {
  string client_id = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 64
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];
  oneof grant {
    option (buf.validate.oneof).required = true;
    AuthorizationCodeGrant authorization_code = 2;
    ClientRefreshTokenGrant refresh_token = 3;
  }
}

// ExchangeClientTokenResponse returns both halves in the body. A public client
// has no cookie jar the host controls and no place to keep a client secret, so
// the tokens are the whole credential and the refresh half rotates on every use.
message ExchangeClientTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

// AuthService — JWT token issuance and session management
service AuthService {
  // BeginOAuth issues a server-signed `state` for the OAuth code flow.
  // Public RPC: callable without authentication (this is the start of
  // the login flow).
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/oauth/begin"
      body: "*"
    };
  }

  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.login"
        events: "saas.auth.mfa_challenge_started"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/authenticate"
      body: "*"
    };
  }

  // Public RPC: possession of the opaque mfa_token is the temporary login
  // credential. Successful verification atomically consumes it and creates
  // the normal refreshable session.
  rpc CompleteMFAChallenge(CompleteMFAChallengeRequest) returns (CompleteMFAChallengeResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.login"
        events: "saas.auth.mfa_challenge_completed"
        events: "saas.mfa.backup_code_used"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
      authentication_factor_attempt: true
    };
    option (google.api.http) = {
      post: "/v1/auth/mfa/complete"
      body: "*"
    };
  }

  // Public RPCs: possession of the opaque mfa_token gates both operations.
  // Finish atomically consumes both the WebAuthn ceremony and login handoff.
  rpc BeginWebAuthnMFAChallenge(BeginWebAuthnMFAChallengeRequest) returns (BeginWebAuthnMFAChallengeResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/mfa/webauthn/begin"
      body: "*"
    };
  }

  rpc CompleteWebAuthnMFAChallenge(CompleteWebAuthnMFAChallengeRequest) returns (CompleteMFAChallengeResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.login"
        events: "saas.auth.mfa_challenge_completed"
        events: "saas.mfa.webauthn_used"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
      authentication_factor_attempt: true
    };
    option (google.api.http) = {
      post: "/v1/auth/mfa/webauthn/complete"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // Exchanges the authenticated access-token context for another organization
  // in the same device family. Membership and current role are resolved under
  // the locked session row before the selected organization is persisted.
  rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.organization_switched"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_SENSITIVE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/switch-organization"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  rpc GetJWKS(google.protobuf.Empty) returns (JWKSResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_PUBLIC
      request_sensitivity: SENSITIVITY_PUBLIC
      response_sensitivity: SENSITIVITY_PUBLIC
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/auth/.well-known/jwks.json"};
  }

  // ValidateClientAuthorization checks a client's authorization request before
  // any sign-in UI is rendered. Public RPC: this runs before the person has
  // authenticated, which is the point — an unregistered client id or a redirect
  // URI that client did not register is refused while the browser is still on
  // the host, never after credentials have been entered.
  rpc ValidateClientAuthorization(ValidateClientAuthorizationRequest) returns (ValidateClientAuthorizationResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/clients/validate"
      body: "*"
    };
  }

  // IssueClientAuthorizationCode mints the one-time code the host redirects
  // back to the client with. The caller is the signed-in person's own host
  // session, so the code is bound to an identity the client never saw
  // authenticate.
  rpc IssueClientAuthorizationCode(IssueClientAuthorizationCodeRequest) returns (IssueClientAuthorizationCodeResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.client_authorized"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_SENSITIVE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/clients/authorize"
      body: "*"
    };
  }

  // ExchangeClientToken is the registered client's token endpoint. Public RPC:
  // possession of the authorization code plus its PKCE verifier, or of the
  // client's own rotating refresh token, is the credential. Both grants mint a
  // session bound to the client, separate from any host web session the person
  // holds.
  rpc ExchangeClientToken(ExchangeClientTokenRequest) returns (ExchangeClientTokenResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_PUBLIC
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.auth.login"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_AUTHENTICATION
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/auth/token"
      body: "*"
    };
  }
}
