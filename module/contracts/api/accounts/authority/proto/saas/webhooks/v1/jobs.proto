syntax = "proto3";

package saas.webhooks.v1;

import "buf/validate/validate.proto";

// OutboundWebhookJob is the versioned workload retained by the generic
// outbox. raw_body contains the exact JSON bytes stored in delivery history;
// workers sign and transmit these bytes without reconstructing the event.
message OutboundWebhookJob {
  string delivery_id = 1 [(buf.validate.field).string.uuid = true];
  string subscription_id = 2 [(buf.validate.field).string.uuid = true];
  string event_id = 3 [(buf.validate.field).string.uuid = true];
  string event_type = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z][a-z0-9._-]*$"
  }];
  bytes raw_body = 5 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 983040
  }];
}
