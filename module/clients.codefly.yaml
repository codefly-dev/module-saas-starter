# Which client libraries `codefly publish clients` builds from this module's
# exported API contracts, and how wide each one's facade is.
#
# This file is product-owned publication policy, deliberately kept OUT of
# module.codefly.yaml: that file is generated from
# deployment/topology.bindings.codefly.yaml, so a module sync would replace an
# inline block here on the next regeneration. The CLI reads this path only
# (generators.LoadModuleClientsConfig), with strict field checking.
#
# An endpoint that exports a contract and is NOT listed here publishes a client
# in every default language with its FULL service surface. Listing every
# exported endpoint is therefore load-bearing, not documentation — the
# clients-config gate in module/tools/composition enforces it.
schema: codefly/module-clients-config/v1
endpoints:
    # Publishes saas-starter-accounts-connect-client (go / typescript / python)
    # at the package version. The facade is restricted to the public surface a
    # solution may reach; a generated binding is one proto file, so a service
    # that must not ship keeps its messages in its own .proto (see
    # accessible_scopes.proto).
    - service: accounts
      endpoint: connect
      languages: [go, typescript, python]
      services: [AccessibleScopeService, AuditService, DatasourceService, WebhookService]
    # Reached only through the mesh by this module's own services; no
    # out-of-module consumer exists, and the stores publish PUBLIC repositories,
    # so no client is published for it.
    - service: auth-gateway
      endpoint: grpc
      publish: false
