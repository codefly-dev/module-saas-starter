# Not a command to run. `module/tools/generated-pins-gate.mjs` reads the plugin
# versions it checks this service's checked-in generated Go against from here,
# so this file must keep naming the versions the proto companion image runs.
# Regenerate with the command in proto/README.md.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: policy-log/pkg/gen
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: code/pkg/gen
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1]
    out: code/pkg/gen
    opt: paths=source_relative
