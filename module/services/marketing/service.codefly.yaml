name: marketing
version: 0.0.0
description: |
    Independently deployable public company site. Owns public content,
    metadata, pricing presentation, and safe product handoff without product
    sessions, tenant state, database access, or secrets.
agent:
    kind: codefly:service
    name: nextjs
    # 0.0.167 is the security floor: the agent pinned next 16.3.6 exactly through
    # 0.0.166, and no service it builds can resolve past its pin. See frontend's
    # manifest for the three advisories that pin cleared (service-nextjs#177).
    version: 0.0.167
    publisher: codefly.dev
endpoints:
    - name: http
      visibility: public
      # Required at core v0.14.0; both values are decisions, recorded in
      # ../../deployment/AGENTS.md under "`exposure` on a public endpoint".
      exposure: public
spec:
    # Declare the argument at its source so regeneration preserves the opt-in
    # production-readiness gate; an empty default does not force it off.
    build-args:
        MARKETING_STRICT_READINESS: ""
    execution-profiles:
        local: development
        production: production
    hot-reload: false
    mode: ssr
    deployment:
        endpoint-ports:
            http: 3000
        public-egress-ports:
            - 443
