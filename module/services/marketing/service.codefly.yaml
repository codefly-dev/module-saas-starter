name: marketing
version: 0.0.0
description: |
    Independently deployable public company site. Owns public content,
    metadata, pricing presentation, and safe product handoff without product
    sessions, tenant state, database access, or secrets.
agent:
    kind: codefly:service
    name: nextjs
    version: 0.0.162
    publisher: codefly.dev
endpoints:
    - name: http
      visibility: public
      # Required at core v0.14.0: "a public endpoint never omits it, so a
      # manifest written when public meant an address fails here instead of
      # losing it". `public` is the value this endpoint already has in effect —
      # v0.13.0's `visibility == public` is precisely the condition v0.14.0
      # moves to `exposure`, and today's render of this endpoint is a plain
      # ClusterIP Service with no Ingress, HTTPRoute, LoadBalancer or NodePort
      # anywhere under deployments/. `none` is the risky half, not this one: it
      # could take the local ingress binding away. The key is DROPPED by core
      # v0.8.1 and v0.13.0, so it is inert on every CLI that ships today.
      exposure: public
spec:
    # Declare the argument at its source so regeneration preserves the opt-in
    # production-readiness gate; an empty default does not force it off.
    build-args:
        MARKETING_STRICT_READINESS: ""
    execution-profiles:
        local: development
        production: production
    hot-reload: false
    mode: ssr
    deployment:
        endpoint-ports:
            http: 3000
        public-egress-ports:
            - 443
