name: frontend
version: 0.0.0
agent:
    kind: codefly:service
    name: nextjs
    version: 0.0.1
    publisher: codefly.dev
service-dependencies:
    - name: api
workspace-configuration-dependencies:
    - workos
endpoints:
    - name: http
      api: http
      # Internal only — public traffic enters via auth-sidecar gateway.
      visibility: module
spec:
    hot-reload: true
    auth-provider: workos
    mode: ssr
