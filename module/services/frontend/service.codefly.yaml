name: frontend
version: 0.0.0
agent:
    kind: codefly:service
    name: nextjs
    # A released agent, moved by `codefly update workspace`. The floor is 0.0.162:
    # the release that ships the builder fix the content kit needs. 0.0.163 also
    # carries core v0.15.1's NewAPI fix (an endpoint keeps its exposure and
    # location) and the ConfigMap quoting fix.
    #
    # 0.0.167 is the security floor. The agent pins the framework EXACTLY in
    # `base/code` and `templates/factory/code`, and its framework gate holds the
    # lockfile's resolved version equal to the declared one, so no service built
    # by it can resolve past the agent's pin. Through 0.0.166 that pin was
    # next 16.3.6, which carries three criticals: unauthenticated RCE in the
    # Image Optimization API via SVG (GHSA-2464-fhr4-w9xw), DoS in App Router
    # Server Actions (GHSA-p3m5-59mp-jv5r), and RCE in `use cache` functions
    # returning typed arrays (GHSA-673q-mjm6-r5xr). 0.0.167 ships next 16.4.1
    # (service-nextjs#177), and with it Go 1.27.3 for GO-2026-6809 (#178) and
    # typescript back to ^5, the only major typescript-eslint@8 admits (#179).
    version: 0.0.167
    publisher: codefly.dev
service-dependencies:
    - name: auth-gateway
      endpoints:
        - name: rest
workspace-configuration-dependencies:
    - abuse-protection
    # APP_BASE_URL: this deployment's public origin. The frontend presents it to
    # accounts as the verified origin that binds a sign-in redirect, and judges the
    # solution proxy's same-origin requests against it. Undeclared, it is never
    # delivered and a deployed build has no public origin at all.
    - application
    - error-tracking
    - identity
    - internal-auth
    - legal
    - product-analytics
    - product-features
endpoints:
    - name: http
      visibility: public
      # Required at core v0.14.0; both values are decisions, recorded in
      # ../../deployment/AGENTS.md under "`exposure` on a public endpoint".
      exposure: public
spec:
    build-args:
        FRONTEND_SKIN_RUNTIME: "1"
    config-mounts:
        - config-map: frontend-skin
          mount-path: /etc/codefly/skin
          name: skin
          optional: true
    environment:
        FRONTEND_SKIN_DIR: /etc/codefly/skin
    execution-profiles:
        local: development
        local-dogfood: development
        production: production
    hot-reload: false
    mode: ssr
    deployment:
        endpoint-ports:
            http: 3000
        public-egress-ports:
            - 443
        # Internal topology reads share the public HTTP port and require a
        # path-scoped mesh policy in addition to the application credential.
        internal-http-routes:
            - path: /api/internal/solutions
              methods:
                - GET
