# Code generated from deployment/topology.bindings.codefly.yaml and services/frontend/code/server/plugin-service-allowlist.generated.json. DO NOT EDIT.
name: frontend
version: 0.0.0
agent:
    kind: codefly:service
    name: nextjs
    version: 0.0.145
    publisher: codefly.dev
service-dependencies:
    - name: auth-sidecar
      endpoints:
        - name: rest
workspace-configuration-dependencies:
    - abuse-protection
    - error-tracking
    - identity
    - internal-auth
    - product-analytics
endpoints:
    - name: http
      visibility: public
spec:
    build-args:
        FRONTEND_SKIN_RUNTIME: "1"
    config-mounts:
        - config-map: frontend-skin
          mount-path: /etc/codefly/skin
          name: skin
          optional: true
    environment:
        FRONTEND_SKIN_DIR: /etc/codefly/skin
    execution-profiles:
        local: development
        local-dogfood: development
        production: production
    hot-reload: false
    mode: ssr
