name: frontend
version: 0.0.0
agent:
    kind: codefly:service
    name: nextjs
    # A released agent. 0.0.162 is the release that ships the builder fix the content
    # kit needs, replacing the prerelease this pin used to carry.
    version: 0.0.162
    publisher: codefly.dev
service-dependencies:
    - name: auth-gateway
      endpoints:
        - name: rest
workspace-configuration-dependencies:
    - abuse-protection
    - error-tracking
    - identity
    - internal-auth
    - legal
    - product-analytics
    - product-features
endpoints:
    - name: http
      visibility: public
      # Required at core v0.14.0; both values are decisions, recorded in
      # ../../deployment/AGENTS.md under "`exposure` on a public endpoint".
      exposure: public
spec:
    build-args:
        FRONTEND_SKIN_RUNTIME: "1"
    config-mounts:
        - config-map: frontend-skin
          mount-path: /etc/codefly/skin
          name: skin
          optional: true
    environment:
        FRONTEND_SKIN_DIR: /etc/codefly/skin
    execution-profiles:
        local: development
        local-dogfood: development
        production: production
    hot-reload: false
    mode: ssr
    deployment:
        endpoint-ports:
            http: 3000
        public-egress-ports:
            - 443
        # Internal topology reads share the public HTTP port and require a
        # path-scoped mesh policy in addition to the application credential.
        internal-http-routes:
            - path: /api/internal/solutions
              methods:
                - GET
