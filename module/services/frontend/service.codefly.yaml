name: frontend
version: 0.0.0
agent:
    kind: codefly:service
    name: nextjs
    version: 0.0.158
    publisher: codefly.dev
service-dependencies:
    - name: auth-gateway
      endpoints:
        - name: rest
workspace-configuration-dependencies:
    - abuse-protection
    - error-tracking
    - identity
    - internal-auth
    - legal
    - product-analytics
endpoints:
    - name: http
      visibility: public
spec:
    build-args:
        FRONTEND_SKIN_RUNTIME: "1"
    config-mounts:
        - config-map: frontend-skin
          mount-path: /etc/codefly/skin
          name: skin
          optional: true
    environment:
        FRONTEND_SKIN_DIR: /etc/codefly/skin
    execution-profiles:
        local: development
        local-dogfood: development
        production: production
    hot-reload: false
    mode: ssr
    deployment:
        endpoint-ports:
            http: 3000
        public-egress-ports:
            - 443
        # Solution self-registration mutates what the nav renders and what the
        # solution page loads as a Module-Federation remote, on the same port that
        # serves every browser-facing page. Only a path match separates the two,
        # and only in the mesh's L7 layer; /api/internal/solutions is read by the
        # proxy over pod-local loopback, which the mesh never captures.
        internal-http-routes:
            - path: /api/internal/solutions
              methods:
                - GET
            - path: /api/solutions/register
              methods:
                - DELETE
                - POST
