name: cache
version: 0.0.0
agent:
    kind: codefly:service
    name: redis
    version: 0.0.94
    publisher: codefly.dev
endpoints:
    - name: read
      api: tcp
    - name: write
      api: tcp
spec:
    watch: false
    with-read-replicas: true
    deployment:
        endpoint-ports:
            read: 6379
            write: 6379
