syntax = "proto3";
package customers;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "buf/validate/validate.proto";

// ============================================================================
// Core messages
// ============================================================================

message VersionRequest {}

message VersionResponse {
    string version = 1 [(buf.validate.field).string.min_len = 1];
}

// User represents a user in the system
message User {
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  string primary_email = 2 [(buf.validate.field).string.email = true];
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp last_login = 5;
  UserStatus status = 6;
  map<string, string> profile = 7;
  bool email_verified = 8;
}

// UserIdentity represents a user's authentication method
message UserIdentity {
  string uuid = 1;
  string user_uuid = 2;
  string provider = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50,
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string provider_id = 4 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 255
  }];
  string provider_email = 5 [(buf.validate.field).string.email = true];
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_used = 7;
  map<string, string> provider_data = 8;
  bool email_verified = 9;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_DELETED = 4;
}

// ============================================================================
// Organization
// ============================================================================

message Organization {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string slug = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 63,
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
  }];
  string owner_id = 4 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp created_at = 5;
}

message OrgMembership {
  string org_id = 1;
  string user_id = 2;
  OrgRole role = 3;
  google.protobuf.Timestamp joined_at = 4;
}

enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_MEMBER = 1;
  ORG_ROLE_ADMIN = 2;
  ORG_ROLE_OWNER = 3;
}

// ============================================================================
// Team
// ============================================================================

message Team {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TeamMembership {
  string team_id = 1;
  string user_id = 2;
  TeamRole role = 3;
  google.protobuf.Timestamp joined_at = 4;
}

enum TeamRole {
  TEAM_ROLE_UNSPECIFIED = 0;
  TEAM_ROLE_MEMBER = 1;
  TEAM_ROLE_ADMIN = 2;
  TEAM_ROLE_OWNER = 3;
}

// ============================================================================
// Roles & Permissions (generic resource:action model)
// ============================================================================

message Permission {
  string resource = 1 [(buf.validate.field).string.min_len = 1];
  string action = 2 [(buf.validate.field).string.min_len = 1];
}

message Role {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3;
  repeated Permission permissions = 4;
  bool built_in = 5;
  string org_id = 6;  // empty = global
}

message RoleAssignment {
  string id = 1;
  string subject_id = 2 [(buf.validate.field).string.uuid = true];
  SubjectKind subject_kind = 3;
  string role_id = 4 [(buf.validate.field).string.uuid = true];
  string org_id = 5;
  string scope = 6;     // optional fine-grained scope
  google.protobuf.Timestamp assigned_at = 7;
}

enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  SUBJECT_KIND_USER = 1;
  SUBJECT_KIND_TEAM = 2;
}

// PrincipalKind classifies a principal — humans, services, or agents
// — for filtering/UI without affecting authorization. The auth layer
// itself treats every Principal uniformly. ANY change here MUST stay
// in sync with the SQL CHECK constraint on principals.kind and with
// codefly's policy.Principal Kind constants.
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_HUMAN = 1;
  PRINCIPAL_KIND_SERVICE = 2;
  PRINCIPAL_KIND_AGENT = 3;
}

// Principal mirrors the principals table 1:1 — the unified identity
// row used by every action, audit event, and delegation grant.
//
// id matches users.uuid for kind=HUMAN, api_keys.id for kind=SERVICE,
// and is a fresh server-generated UUID for kind=AGENT. We do NOT
// enforce these as foreign keys at the DB level (independent
// lifecycles); the equality is convention and the backfill migration.
message Principal {
  string id = 1 [(buf.validate.field).string.uuid = true];
  PrincipalKind kind = 2;
  string display_name = 3 [(buf.validate.field).string.min_len = 1];
  // org_id NULL/empty for kind=HUMAN (cross-org); required for
  // SERVICE and AGENT. Server-side validation enforces.
  string org_id = 4;
  // agent_identifier is "publisher/name:version" for kind=AGENT;
  // empty otherwise. Required when kind=AGENT.
  string agent_identifier = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
  string revoked_reason = 8;
}

// Decision is what the PDP returns for a Decide call. ALLOW means
// proceed; DENY means refuse with reason; REQUIRE_APPROVAL means
// the action is conditionally permitted but needs a grantor's
// approval first (used by the M7+ synchronous escalation flow). The
// agent SDK turns REQUIRE_APPROVAL into a RequestEscalation call.
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY = 2;
  DECISION_REQUIRE_APPROVAL = 3;
}

// ============================================================================
// Request / Response messages
// ============================================================================

// --- User ---

message RegisterUserRequest {
  string primary_email = 1 [(buf.validate.field).string.email = true];
  map<string, string> profile = 2;
  UserIdentity identity = 3;
}

message RegisterUserResponse {
  User user = 1;
  UserIdentity identity = 2;
}

message GetUserRequest {
  oneof identifier {
    option (buf.validate.oneof).required = true;
    string uuid = 1 [(buf.validate.field).string.uuid = true];
    string email = 2 [(buf.validate.field).string.email = true];
  }
}

message GetSelfRequest {}

message GetSelfResponse {
  User user = 1;
  repeated UserIdentity identities = 2;
  repeated Organization organizations = 3;
  repeated RoleAssignment role_assignments = 4;
}

message ListUsersRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = { gt: 0, lte: 100 }];
  string page_token = 2;
  UserStatus status = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message UpdateUserRequest {
  string uuid = 1 [(buf.validate.field).string.uuid = true];
  User user = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message AddIdentityRequest {
  string user_uuid = 1 [(buf.validate.field).string.uuid = true];
  UserIdentity identity = 2;
}

message FindUserByIdentityRequest {
  string provider = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50,
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string provider_id = 2 [(buf.validate.field).string = { min_len: 1, max_len: 255 }];
}

message ListUserIdentitiesRequest {
  string user_uuid = 1 [(buf.validate.field).string.uuid = true];
}

message ListUserIdentitiesResponse {
  repeated UserIdentity identities = 1;
}

// --- Organization Settings (branding) ---

message OrgSettings {
  string org_id = 1;
  string logo_url = 2;
  string primary_color = 3;
  string custom_domain = 4;
  string favicon_url = 5;
}

message GetOrgSettingsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message UpdateOrgSettingsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string logo_url = 2;
  string primary_color = 3;
  string custom_domain = 4;
  string favicon_url = 5;
}

// --- Organization ---

message CreateOrganizationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string slug = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 63,
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
  }];
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message GetOrganizationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message AddOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  OrgRole role = 3;
}

message RemoveOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message ListOrgMembersRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListOrgMembersResponse {
  repeated OrgMembership members = 1;
}

// --- Team ---

message CreateTeamRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3;
}

message CreateTeamResponse {
  Team team = 1;
}

message ListTeamsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message AddTeamMemberRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  TeamRole role = 3;
}

message RemoveTeamMemberRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message ListTeamMembersRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListTeamMembersResponse {
  repeated TeamMembership members = 1;
}

// --- Roles & Permissions ---

message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  repeated Permission permissions = 3;
  string org_id = 4;  // empty = global
}

message CreateRoleResponse {
  Role role = 1;
}

message ListRolesRequest {
  string org_id = 1;  // empty = list global roles
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message DeleteRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message AssignRoleRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  SubjectKind subject_kind = 2;
  string role_id = 3 [(buf.validate.field).string.uuid = true];
  string org_id = 4;
  string scope = 5;
}

message AssignRoleResponse {
  RoleAssignment assignment = 1;
}

message RevokeRoleRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  string role_id = 2 [(buf.validate.field).string.uuid = true];
  string org_id = 3;
  string scope = 4;
}

// ListRoleAssignmentsRequest — read assignments scoped to an org.
// subject_id (optional) filters to assignments for that user/team
// only; empty returns every assignment in the org. Used by the
// admin UI's "manage roles for member X" panel.
message ListRoleAssignmentsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string subject_id = 2;  // empty → all subjects in this org
  SubjectKind subject_kind = 3;  // unspecified → both users + teams
}

message ListRoleAssignmentsResponse {
  repeated RoleAssignment assignments = 1;
}

message CheckPermissionRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  SubjectKind subject_kind = 2;
  string resource = 3 [(buf.validate.field).string.min_len = 1];
  string action = 4 [(buf.validate.field).string.min_len = 1];
  string org_id = 5;
  string scope = 6;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

// --- Decide (the new permission-check primitive) ---
//
// Decide is the principal-aware successor to CheckPermission. It
// accepts a single principal_id (no SubjectKind disambiguation —
// the principals table answers that), structured action and
// resource, optional context for caveat evaluation, and an
// optional delegation_proof carrying a Biscuit token (M6+).
//
// CheckPermission stays alongside Decide for backwards compat; new
// callers should use Decide. Once all callers migrate, CheckPermission
// becomes a thin wrapper over Decide.
message DecideRequest {
  string principal_id = 1 [(buf.validate.field).string.uuid = true];
  // action is dotted, e.g. "github.merge_pr" or "fs.write".
  string action = 2 [(buf.validate.field).string.min_len = 1];
  // resource is typed, e.g. "repo:codefly-dev/codefly.dev" or
  // "file:/etc/passwd". Empty string means "no specific resource"
  // (rare; usually for global actions).
  string resource = 3;
  // resource_id is an optional sub-identifier (e.g. PR number).
  // Pure metadata for audit; not used in authz today.
  string resource_id = 4;
  string org_id = 5;
  // context is a free-form structured map for caveat evaluation
  // (Cedar/Rego rules consume it). Common keys: ci_status, labels,
  // pr_number. Unknown keys ignored.
  google.protobuf.Struct context = 6;
  // risk_level is an advisory tier the caller's manifest declared
  // for this action. The PDP MAY use it to gate approval flow;
  // missing → treat as policy default.
  string risk_level = 7;
  // delegation_proof is an optional Biscuit token proving the
  // caller acquired delegated authority for this action. Until M6
  // lands, this field is unused — pass empty bytes.
  bytes delegation_proof = 8;
  // declared_permissions is the caller's manifest-declared
  // permission set (M4+). The PDP enforces this as a ceiling: even
  // if a role grants the action, the manifest must also have
  // declared it. Until M4 lands, empty list = "no ceiling enforced
  // at this layer."
  repeated Permission declared_permissions = 9;
}

message DecideResponse {
  Decision decision = 1;
  string reason = 2;
  // decision_path traces the role/permission match for human-
  // readable explanation. Format: "role:editor → perm:github.read_pr"
  // or "manifest-ceiling: action not declared" or "no role grants".
  string decision_path = 3;
  // approval_request_id is set when decision=REQUIRE_APPROVAL —
  // identifies the saas-starter delegation_grants row created for
  // this pending approval. Empty otherwise.
  string approval_request_id = 4;
}

// --- Principal CRUD (M1 promoted to RPCs in M2) ---

message GetPrincipalRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAgentPrincipalRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string agent_identifier = 2 [(buf.validate.field).string.min_len = 1];
}

message CreateAgentPrincipalRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // agent_identifier in canonical "publisher/name:version" form.
  string agent_identifier = 2 [(buf.validate.field).string.min_len = 1];
  string display_name = 3;
}

message RevokePrincipalRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

message ListPrincipalsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // kind filters; UNSPECIFIED returns all kinds in the org
  // (humans via membership, services + agents via direct org_id).
  PrincipalKind kind = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
  string page_token = 4;
}

message ListPrincipalsResponse {
  repeated Principal principals = 1;
  string next_page_token = 2;
}

// --- Identity resolution (for auth sidecar) ---

message ResolveIdentityRequest {
  string provider = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50,
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string provider_id = 2 [(buf.validate.field).string = { min_len: 1, max_len: 255 }];
}

message ResolveIdentityResponse {
  string user_id = 1;
  string org_id = 2;
  repeated string roles = 3;      // deprecated, kept for backward compat
  bool found = 4;
  string org_role = 5;            // "owner"|"admin"|"member"
  string platform_role = 6;       // "super_admin"|"support"|"billing"|absent
}

// ============================================================================
// Services
// ============================================================================

// UserService — user CRUD and identity management
service UserService {

  rpc Version(VersionRequest) returns (VersionResponse) {
    option (google.api.http) = { get: "/v1/version" };
  }

  rpc GetSelf(GetSelfRequest) returns (GetSelfResponse) {
    option (google.api.http) = { get: "/v1/users/self" };
  }

  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {
    option (google.api.http) = { post: "/v1/users" body: "*" };
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{uuid}"
      additional_bindings { get: "/v1/users:byEmail" }
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/v1/users" };
  }

  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = { patch: "/v1/users/{uuid}" body: "user" };
  }

  rpc DeleteUser(GetUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/users/{uuid}" };
  }

  rpc AddIdentity(AddIdentityRequest) returns (UserIdentity) {
    option (google.api.http) = { post: "/v1/users/{user_uuid}/identities" body: "identity" };
  }

  rpc FindUserByIdentity(FindUserByIdentityRequest) returns (User) {
    option (google.api.http) = { get: "/v1/users:findByIdentity" };
  }

  rpc ListUserIdentities(ListUserIdentitiesRequest) returns (ListUserIdentitiesResponse) {
    option (google.api.http) = { get: "/v1/users/{user_uuid}/identities" };
  }
}

// OrganizationService — org and membership management
service OrganizationService {

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (google.api.http) = { post: "/v1/organizations" body: "*" };
  }

  rpc GetOrganization(GetOrganizationRequest) returns (Organization) {
    option (google.api.http) = { get: "/v1/organizations/{id}" };
  }

  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = { get: "/v1/organizations" };
  }

  rpc AddMember(AddOrgMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/organizations/{org_id}/members" body: "*" };
  }

  rpc RemoveMember(RemoveOrgMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/organizations/{org_id}/members/{user_id}" };
  }

  rpc ListMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse) {
    option (google.api.http) = { get: "/v1/organizations/{org_id}/members" };
  }

  rpc GetOrgSettings(GetOrgSettingsRequest) returns (OrgSettings) {
    option (google.api.http) = { get: "/v1/organizations/{org_id}/settings" };
  }

  rpc UpdateOrgSettings(UpdateOrgSettingsRequest) returns (OrgSettings) {
    option (google.api.http) = { put: "/v1/organizations/{org_id}/settings" body: "*" };
  }
}

// TeamService — team and membership management
service TeamService {

  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (google.api.http) = { post: "/v1/organizations/{org_id}/teams" body: "*" };
  }

  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (google.api.http) = { get: "/v1/organizations/{org_id}/teams" };
  }

  rpc AddMember(AddTeamMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/teams/{team_id}/members" body: "*" };
  }

  rpc RemoveMember(RemoveTeamMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/teams/{team_id}/members/{user_id}" };
  }

  rpc ListMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse) {
    option (google.api.http) = { get: "/v1/teams/{team_id}/members" };
  }
}

// PermissionService — RBAC management and enforcement
service PermissionService {

  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = { post: "/v1/roles" body: "*" };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = { get: "/v1/roles" };
  }

  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/roles/{id}" };
  }

  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    option (google.api.http) = { post: "/v1/role-assignments" body: "*" };
  }

  rpc RevokeRole(RevokeRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/role-assignments" };
  }

  rpc ListRoleAssignments(ListRoleAssignmentsRequest) returns (ListRoleAssignmentsResponse) {
    option (google.api.http) = { get: "/v1/role-assignments" };
  }

  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse) {
    option (google.api.http) = { post: "/v1/permissions:check" body: "*" };
  }

  // Decide is the principal-aware permission check (M2). New
  // callers should use Decide; CheckPermission is kept for backward
  // compatibility while existing clients migrate. Both RPCs route
  // through the same Postgres CheckPermission query in M2; they
  // diverge starting at M4 (manifest ceiling) and M7 (approval flow).
  rpc Decide(DecideRequest) returns (DecideResponse) {
    option (google.api.http) = { post: "/v1/permissions:decide" body: "*" };
  }
}

// PrincipalService — unified principal management (M1 + M2). Humans,
// services, and agents are all rows in the principals table; this
// service is the public CRUD over them. Read paths are admin-only;
// CreateAgent is org-admin scoped (called by the codefly CLI on
// `codefly install`).
service PrincipalService {
  rpc GetPrincipal(GetPrincipalRequest) returns (Principal) {
    option (google.api.http) = { get: "/v1/principals/{id}" };
  }
  rpc GetAgentPrincipal(GetAgentPrincipalRequest) returns (Principal) {
    option (google.api.http) = { get: "/v1/principals:byAgent" };
  }
  rpc CreateAgentPrincipal(CreateAgentPrincipalRequest) returns (Principal) {
    option (google.api.http) = { post: "/v1/principals:agent" body: "*" };
  }
  rpc RevokePrincipal(RevokePrincipalRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/principals/{id}:revoke" body: "*" };
  }
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse) {
    option (google.api.http) = { get: "/v1/principals" };
  }
}

// =====================================================================
// DelegationService — M7 escalation flow + M8 pattern grants
// =====================================================================
//
// Synchronous escalation: an actor (typically an agent that hit a
// RequireApproval decision) requests authority; a grantor approves
// or denies; the gateway mints a fresh scoped-auth token on
// approve. Pattern grants (M8) extend the same table with
// pre-authorized classes of future calls.

message RequestDelegationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string actor_principal_id = 2 [(buf.validate.field).string.uuid = true];
  string action = 3 [(buf.validate.field).string.min_len = 1];
  string resource = 4;
  string resource_id = 5;
  // Justification — REQUIRED. Without it the grantor has no
  // basis to decide; saas-starter rejects empty/whitespace.
  string justification = 6 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Struct context = 7;
  // risk_level: low|medium|high|critical. Empty defaults to low.
  string risk_level = 8;
  // timeout_seconds: how long to wait before auto-expiry.
  // Defaults to 300 (5 min) if zero.
  int32 timeout_seconds = 9;
  // Grantor: optional explicit target ("user:<id>" / "team:<name>");
  // empty → default approver chain.
  string grantor = 10;
  // Idempotency key. Server derives from request content if empty.
  string request_hash = 11;
}

message RequestDelegationResponse {
  string id = 1;
  string status = 2;     // typically "pending"; may be "approved" if a pattern matches (M8)
  google.protobuf.Timestamp expires_at = 3;
}

message WaitForDelegationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
}

// DelegationEvent is one streaming event delivered to a
// subscriber. The agent SDK reads exactly one event (the
// terminal decision) and disconnects.
message DelegationEvent {
  string id = 1;
  string status = 2;        // approved | denied | expired | cancelled
  google.protobuf.Timestamp decided_at = 3;
  string grantor_principal_id = 4;
  string reason = 5;
  // On approve: the gateway's freshly minted scoped-auth token.
  // Empty on deny / expired / cancelled.
  string scoped_auth_token = 6;
  // On approve: the unique id of the minted token (for audit
  // correlation). Same value as the encoded token's `id` field.
  string minted_token_id = 7;
}

message DecideDelegationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  // Decision: approved | denied. (expired/cancelled are state
  // transitions handled by other paths.)
  string decision = 3 [(buf.validate.field).string.min_len = 1];
  // Reason: required when decision=denied; optional on approve.
  string reason = 4;
}

message DelegationGrant {
  string id = 1;
  string org_id = 2;
  string actor_principal_id = 3;
  string grantor_principal_id = 4;
  string action = 5;
  string resource = 6;
  string resource_id = 7;
  string justification = 8;
  string status = 9;
  string risk_level = 10;
  string kind = 11;        // one_shot | pattern
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp decided_at = 13;
  google.protobuf.Timestamp expires_at = 14;
  string decision_reason = 15;
  string minted_token_id = 16;
}

message ListPendingDelegationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = { gte: 0, lte: 200 }];
  string page_token = 3;
}

message ListPendingDelegationsResponse {
  repeated DelegationGrant grants = 1;
  string next_page_token = 2;
}

service DelegationService {
  // RequestDelegation creates a new pending grant. Idempotent on
  // (org_id, request_hash) — same request from a retrying actor
  // returns the original row's id.
  rpc RequestDelegation(RequestDelegationRequest) returns (RequestDelegationResponse) {
    option (google.api.http) = {
      post: "/v1/delegations"
      body: "*"
    };
  }

  // WaitForDelegation streams one terminal event for a grant.
  // Backed by Postgres LISTEN — no polling.
  rpc WaitForDelegation(WaitForDelegationRequest) returns (stream DelegationEvent) {
    option (google.api.http) = {
      get: "/v1/delegations/{id}:wait"
    };
  }

  // DecideDelegation is the grantor's approve/deny action. Called
  // from the approval UI; transitions the row + (on approve)
  // mints the scoped-auth token + fires NOTIFY for any waiting
  // streams.
  rpc DecideDelegation(DecideDelegationRequest) returns (DelegationGrant) {
    option (google.api.http) = {
      post: "/v1/delegations/{id}:decide"
      body: "*"
    };
  }

  // ListPendingDelegations returns paginated pending grants for
  // the approver UI. Sorted critical → high → medium → low,
  // newest-first within tier.
  rpc ListPendingDelegations(ListPendingDelegationsRequest) returns (ListPendingDelegationsResponse) {
    option (google.api.http) = {
      get: "/v1/delegations:pending"
    };
  }
}

// IdentityService — auth provider ID resolution (used by auth sidecar)
service IdentityService {

  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolveIdentityResponse) {
    option (google.api.http) = { post: "/v1/identity:resolve" body: "*" };
  }
}

