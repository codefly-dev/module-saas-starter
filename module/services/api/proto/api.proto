// ============================================================================
// Authentication (JWT token issuance)
// ============================================================================

message AuthenticateRequest {
  string provider = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50,
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string provider_id = 2 [(buf.validate.field).string = { min_len: 1, max_len: 255 }];
  string provider_email = 3;
  bool email_verified = 4;
  map<string, string> profile = 5;
  string device_info = 6;
}

message AuthenticateResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
  bool mfa_required = 5;
  string mfa_token = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message JWKSResponse {
  string keys_json = 1;
}

// BeginOAuthRequest is the FE's first hop on the authorization-code
// flow. Server returns a server-signed `state` token bound to
// (provider, redirect_uri); the FE embeds it in the provider's
// authorize URL alongside its own PKCE code_challenge. Authenticate
// later verifies the state before exchanging the code.
message BeginOAuthRequest {
  string provider = 1 [(buf.validate.field).string.min_len = 1];
  string redirect_uri = 2 [(buf.validate.field).string.min_len = 1];
}

message BeginOAuthResponse {
  // state is opaque to the FE — pass it back unchanged in the
  // authorize URL and again in the Authenticate request.
  string state = 1;
}

// ============================================================================
// Audit log → S3 export config (per-org)
// ============================================================================

message AuditExportConfig {
  string id = 1;
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  string bucket = 3 [(buf.validate.field).string.min_len = 1];
  string region = 4;
  // endpoint empty = real AWS S3; non-empty points at MinIO / R2 / etc.
  string endpoint = 5;
  string prefix = 6;
  string access_key_id = 7;
  // Get returns "" for secret_access_key so the FE can't echo a
  // stored secret. Save with "" preserves the existing one.
  string secret_access_key = 8;
  int32 cadence_minutes = 9 [(buf.validate.field).int32.gte = 5];
  bool enabled = 10;
  google.protobuf.Timestamp last_exported_at = 11;
  string last_error = 12;
  google.protobuf.Timestamp last_error_at = 13;
}

message GetAuditExportConfigRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message SaveAuditExportConfigRequest {
  AuditExportConfig config = 1;
}

message DeleteAuditExportConfigRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

service AuditExportService {
  rpc GetConfig(GetAuditExportConfigRequest) returns (AuditExportConfig) {
    option (google.api.http) = { get: "/v1/audit-export/{org_id}" };
  }
  rpc SaveConfig(SaveAuditExportConfigRequest) returns (AuditExportConfig) {
    option (google.api.http) = { post: "/v1/audit-export" body: "*" };
  }
  rpc DeleteConfig(DeleteAuditExportConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/audit-export/{org_id}" };
  }
}

// ============================================================================
// Consent / TOS acceptance — server-side audit trail
// ============================================================================

message ConsentStatus {
  // accepted_version is the CONSENT_VERSION string the user clicked
  // Accept on. Empty when the user has never accepted.
  string accepted_version = 1;
  google.protobuf.Timestamp accepted_at = 2;
  // current_version is the version the api considers active. The FE
  // shows the banner whenever accepted_version != current_version.
  string current_version = 3;
}

message GetConsentStatusRequest {}

message AcceptConsentRequest {
  string version = 1 [(buf.validate.field).string.min_len = 1];
}

service ConsentService {
  rpc GetStatus(GetConsentStatusRequest) returns (ConsentStatus) {
    option (google.api.http) = { get: "/v1/consent/status" };
  }
  rpc Accept(AcceptConsentRequest) returns (ConsentStatus) {
    option (google.api.http) = { post: "/v1/consent/accept" body: "*" };
  }
}

// AuthService — JWT token issuance and session management
service AuthService {

  // BeginOAuth issues a server-signed `state` for the OAuth code flow.
  // Public RPC: callable without authentication (this is the start of
  // the login flow).
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse) {
    option (google.api.http) = { post: "/v1/auth/oauth/begin" body: "*" };
  }

  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    option (google.api.http) = { post: "/v1/auth/authenticate" body: "*" };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = { post: "/v1/auth/refresh" body: "*" };
  }

  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/auth/logout" body: "*" };
  }

  rpc GetJWKS(google.protobuf.Empty) returns (JWKSResponse) {
    option (google.api.http) = { get: "/v1/auth/.well-known/jwks.json" };
  }
}

