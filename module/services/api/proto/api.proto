// PlatformAdminService — cross-tenant operations for platform operators.
// All RPCs require a platform_role in the JWT claims.
service PlatformAdminService {
  // User management (cross-tenant)
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = { get: "/v1/platform/users" };
  }
  rpc SuspendUser(SuspendUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/platform/users/{user_id}:suspend" body: "*" };
  }
  rpc UnsuspendUser(UnsuspendUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/platform/users/{user_id}:unsuspend" body: "*" };
  }
  rpc ImpersonateUser(ImpersonateUserRequest) returns (ImpersonateUserResponse) {
    option (google.api.http) = { post: "/v1/platform/users/{user_id}:impersonate" body: "*" };
  }

  // Session visibility
  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse) {
    option (google.api.http) = { get: "/v1/platform/sessions" };
  }

  // Entitlements & billing
  rpc GetOrgEntitlements(GetOrgEntitlementsRequest) returns (GetOrgEntitlementsResponse) {
    option (google.api.http) = { get: "/v1/platform/organizations/{org_id}/entitlements" };
  }
  rpc OverrideEntitlement(OverrideEntitlementRequest) returns (OverrideEntitlementResponse) {
    option (google.api.http) = { post: "/v1/platform/organizations/{org_id}/entitlements" body: "*" };
  }

  // Platform admin management (super_admin only)
  rpc GrantPlatformRole(GrantPlatformRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/platform/admins" body: "*" };
  }
  rpc RevokePlatformRole(RevokePlatformRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/platform/admins/{user_id}" };
  }
  rpc ListPlatformAdmins(ListPlatformAdminsRequest) returns (ListPlatformAdminsResponse) {
    option (google.api.http) = { get: "/v1/platform/admins" };
  }

  // Feature flags (platform-only)
  rpc ListFeatureFlags(ListFeatureFlagsRequest) returns (ListFeatureFlagsResponse) {
    option (google.api.http) = { get: "/v1/platform/feature-flags" };
  }
  rpc UpsertFeatureFlag(UpsertFeatureFlagRequest) returns (UpsertFeatureFlagResponse) {
    option (google.api.http) = { put: "/v1/platform/feature-flags/{name}" body: "*" };
  }
}

