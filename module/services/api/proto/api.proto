// ============================================================================
// Webhooks
// ============================================================================

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATUS_PENDING = 1;
  WEBHOOK_DELIVERY_STATUS_SUCCESS = 2;
  WEBHOOK_DELIVERY_STATUS_FAILED = 3;
}

message WebhookSubscription {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  string url = 3 [(buf.validate.field).string.uri = true];
  repeated string events = 4;
  bool active = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
}

message WebhookDelivery {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string subscription_id = 2 [(buf.validate.field).string.uuid = true];
  string event_type = 3;
  string payload = 4;
  WebhookDeliveryStatus status = 5;
  int32 attempts = 6;
  int32 http_status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp delivered_at = 9;
  // response_body — captured upstream response (truncated server-side
  // to 64KiB). Empty when the request never connected.
  string response_body = 10;
  // next_retry_at — only set when status=FAILED and attempts <
  // max_attempts; means the dispatcher will pick this up at that time.
  google.protobuf.Timestamp next_retry_at = 11;
}

message CreateWebhookSubscriptionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string url = 2 [(buf.validate.field).string.uri = true];
  repeated string events = 3;
  string description = 4;
}

message DeleteWebhookSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListWebhookSubscriptionsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = { gt: 0, lte: 100 }];
  string page_token = 3;
}

message ListWebhookSubscriptionsResponse {
  repeated WebhookSubscription subscriptions = 1;
  string next_page_token = 2;
}

message ListWebhookDeliveriesRequest {
  string subscription_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = { gt: 0, lte: 100 }];
  string page_token = 3;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  string next_page_token = 2;
}

message TestWebhookRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // event_type to send. Empty defaults to "webhook.test"; otherwise
  // any string the FE picked from the supported events list. The
  // payload itself is server-generated sample JSON.
  string event_type = 2;
}

message GetWebhookDeliveryRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ReplayWebhookDeliveryRequest {
  // Replay the existing delivery's payload to its subscription's
  // current URL with current secret. Result is a NEW delivery row
  // (full audit trail of the replay). The original row is unchanged.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RotateWebhookSecretRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // grace_period_seconds — how long the OLD secret stays valid for
  // signature verification on incoming replays. 0 = revoke
  // immediately; 86400 (24h) is the recommended default for staged
  // rollouts. Bound to a 7-day max server-side.
  int32 grace_period_seconds = 2;
}

message RotateWebhookSecretResponse {
  // The new signing secret, returned ONCE on rotation. Show + copy
  // in the FE; not retrievable again.
  string secret = 1;
  google.protobuf.Timestamp old_secret_expires_at = 2;
}

// WebhookService — webhook subscription and delivery management
service WebhookService {
  rpc CreateSubscription(CreateWebhookSubscriptionRequest) returns (WebhookSubscription) {
    option (google.api.http) = { post: "/v1/webhooks" body: "*" };
  }
  rpc DeleteSubscription(DeleteWebhookSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/webhooks/{id}" };
  }
  rpc ListSubscriptions(ListWebhookSubscriptionsRequest) returns (ListWebhookSubscriptionsResponse) {
    option (google.api.http) = { get: "/v1/webhooks" };
  }
  rpc ListDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (google.api.http) = { get: "/v1/webhooks/{subscription_id}/deliveries" };
  }
  rpc GetDelivery(GetWebhookDeliveryRequest) returns (WebhookDelivery) {
    option (google.api.http) = { get: "/v1/webhooks/deliveries/{id}" };
  }
  rpc ReplayDelivery(ReplayWebhookDeliveryRequest) returns (WebhookDelivery) {
    option (google.api.http) = { post: "/v1/webhooks/deliveries/{id}:replay" body: "*" };
  }
  rpc TestWebhook(TestWebhookRequest) returns (WebhookDelivery) {
    option (google.api.http) = { post: "/v1/webhooks/{id}:test" body: "*" };
  }
  rpc RotateSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse) {
    option (google.api.http) = { post: "/v1/webhooks/{id}:rotateSecret" body: "*" };
  }
}

// ============================================================================
// Notifications
// ============================================================================

message Notification {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string org_id = 3 [(buf.validate.field).string.uuid = true];
  string title = 4;
  string body = 5;
  string type = 6;
  string action_url = 7;
  google.protobuf.Timestamp read_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListNotificationsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = { gt: 0, lte: 100 }];
  string page_token = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
}

message GetUnreadCountRequest {}

message GetUnreadCountResponse {
  int32 count = 1;
}

message MarkNotificationReadRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message MarkAllNotificationsReadRequest {}

message DeleteNotificationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// NotificationService — user notification management
service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http) = { get: "/v1/notifications" };
  }
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse) {
    option (google.api.http) = { get: "/v1/notifications/unread-count" };
  }
  rpc MarkRead(MarkNotificationReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/notifications/{id}:read" body: "*" };
  }
  rpc MarkAllRead(MarkAllNotificationsReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/notifications:read-all" body: "*" };
  }
  rpc DeleteNotification(DeleteNotificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/notifications/{id}" };
  }
}

// ============================================================================
// Onboarding
// ============================================================================

enum OnboardingStepStatus {
  ONBOARDING_STEP_STATUS_UNSPECIFIED = 0;
  ONBOARDING_STEP_STATUS_PENDING = 1;
  ONBOARDING_STEP_STATUS_COMPLETED = 2;
  ONBOARDING_STEP_STATUS_SKIPPED = 3;
}

message OnboardingStep {
  string step_name = 1 [(buf.validate.field).string.min_len = 1];
  OnboardingStepStatus status = 2;
  google.protobuf.Timestamp completed_at = 3;
}

message OnboardingProgress {
  repeated OnboardingStep steps = 1;
  bool completed = 2;
}

message GetOnboardingProgressRequest {}

message CompleteOnboardingStepRequest {
  string step_name = 1 [(buf.validate.field).string.min_len = 1];
}

message SkipOnboardingStepRequest {
  string step_name = 1 [(buf.validate.field).string.min_len = 1];
}

// OnboardingService — user onboarding flow management
service OnboardingService {
  rpc GetProgress(GetOnboardingProgressRequest) returns (OnboardingProgress) {
    option (google.api.http) = { get: "/v1/onboarding" };
  }
  rpc CompleteStep(CompleteOnboardingStepRequest) returns (OnboardingProgress) {
    option (google.api.http) = { post: "/v1/onboarding/{step_name}:complete" body: "*" };
  }
  rpc SkipStep(SkipOnboardingStepRequest) returns (OnboardingProgress) {
    option (google.api.http) = { post: "/v1/onboarding/{step_name}:skip" body: "*" };
  }
}

// ============================================================================
// GDPR (Data Privacy)
// ============================================================================

enum GDPRRequestType {
  GDPR_REQUEST_TYPE_UNSPECIFIED = 0;
  GDPR_REQUEST_TYPE_EXPORT = 1;
  GDPR_REQUEST_TYPE_DELETION = 2;
}

enum GDPRRequestStatus {
  GDPR_REQUEST_STATUS_UNSPECIFIED = 0;
  GDPR_REQUEST_STATUS_PENDING = 1;
  GDPR_REQUEST_STATUS_PROCESSING = 2;
  GDPR_REQUEST_STATUS_COMPLETED = 3;
  GDPR_REQUEST_STATUS_FAILED = 4;
}

message GDPRRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  GDPRRequestType type = 3;
  GDPRRequestStatus status = 4;
  string download_url = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message RequestDataExportRequest {}

message GetExportStatusRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RequestDeletionRequest {}

message GetDeletionStatusRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GDPRService — GDPR data export and deletion requests
service GDPRService {
  rpc RequestExport(RequestDataExportRequest) returns (GDPRRequest) {
    option (google.api.http) = { post: "/v1/gdpr/export" body: "*" };
  }
  rpc GetExportStatus(GetExportStatusRequest) returns (GDPRRequest) {
    option (google.api.http) = { get: "/v1/gdpr/export/{id}" };
  }
  rpc RequestDeletion(RequestDeletionRequest) returns (GDPRRequest) {
    option (google.api.http) = { post: "/v1/gdpr/delete" body: "*" };
  }
  rpc GetDeletionStatus(GetDeletionStatusRequest) returns (GDPRRequest) {
    option (google.api.http) = { get: "/v1/gdpr/delete/{id}" };
  }
}

// ============================================================================
// MFA (Multi-Factor Authentication)
// ============================================================================

enum MFADeviceType {
  MFA_DEVICE_TYPE_UNSPECIFIED = 0;
  MFA_DEVICE_TYPE_TOTP = 1;
  MFA_DEVICE_TYPE_WEBAUTHN = 2;
}

message MFADevice {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  MFADeviceType device_type = 3;
  string name = 4;
  google.protobuf.Timestamp verified_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SetupTOTPRequest {}

message SetupTOTPResponse {
  string secret = 1;
  string provisioning_uri = 2;
  repeated string backup_codes = 3;
}

message VerifyTOTPRequest {
  string code = 1 [(buf.validate.field).string = { min_len: 6, max_len: 6, pattern: "^[0-9]+$" }];
}

message VerifyTOTPResponse {
  bool valid = 1;
  MFADevice device = 2;
}

message ListMFADevicesRequest {}

message ListMFADevicesResponse {
  repeated MFADevice devices = 1;
}

message RevokeMFADeviceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GenerateBackupCodesRequest {}

message GenerateBackupCodesResponse {
  repeated string backup_codes = 1;
}

// ============================================================================
// SSO Admin (self-serve WorkOS Connections)
// ============================================================================

// OrgSSOConfig is the per-org SSO state. Empty connection_id means
// SSO is not configured. status mirrors WorkOS Connections lifecycle:
//   ""             — not configured
//   "linked"       — admin portal link issued, IdP setup pending
//   "active"       — connection live; email-domain users SSO-routed
//   "disabled"     — connection exists but admin paused it
message OrgSSOConfig {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string provider = 2;            // e.g. "workos"
  string connection_id = 3;       // WorkOS Connection id, when linked
  string organization_id = 4;     // WorkOS Organization id (the customer's tenant on WorkOS)
  string status = 5;              // "linked" | "active" | "disabled" | ""
  google.protobuf.Timestamp configured_at = 6;
}

message GetOrgSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// StartSSOSetupRequest kicks off the admin portal flow. The backend
// (a) ensures a WorkOS Organization exists for the saas-starter org,
// (b) mints a portal link, (c) returns it for browser redirect.
message StartSSOSetupRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // return_url is where WorkOS redirects the admin after they
  // finish IdP setup. Typically the saas-starter /admin/sso page.
  string return_url = 2 [(buf.validate.field).string.uri = true];
}

message StartSSOSetupResponse {
  // portal_link is the one-shot URL the FE redirects the browser
  // to. Expires per WorkOS policy (15 min default). Re-callable to
  // mint a fresh one if the operator needs to re-enter the portal.
  string portal_link = 1;
}

message DisableSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// SSOAdminService — org-admin-gated. Lets paying customers wire up
// SAML / OIDC themselves through the WorkOS Admin Portal without a
// support ticket. Stub-mode (no WORKOS_API_KEY env) returns a
// placeholder portal link pointing back at /admin/sso?demo=1 so dev
// environments can exercise the FE flow.
service SSOAdminService {
  rpc GetSSO(GetOrgSSORequest) returns (OrgSSOConfig) {
    option (google.api.http) = { get: "/v1/sso/{org_id}" };
  }
  rpc StartSetup(StartSSOSetupRequest) returns (StartSSOSetupResponse) {
    option (google.api.http) = { post: "/v1/sso/setup" body: "*" };
  }
  rpc Disable(DisableSSORequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/sso/disable" body: "*" };
  }
}

// ============================================================================
// Billing — Connect-RPC surface (the REST endpoint exists too, used
// by the auth-sidecar passthrough in production. The Connect path
// works without the sidecar so direct-to-api dev/test setups can
// hit billing flows from the FE.)
// ============================================================================

message OpenBillingPortalRequest {
  string org_id     = 1 [(buf.validate.field).string.uuid = true];
  // return_url is where Stripe redirects after the operator closes
  // the portal. Typically /admin/billing.
  string return_url = 2 [(buf.validate.field).string.uri = true];
}

message OpenBillingPortalResponse {
  string url = 1; // Stripe-hosted billing portal URL — one-shot.
}

// Invoice — trimmed view of Stripe's invoice object. Amounts are in
// the smallest currency unit (cents for USD/EUR); FE divides by 100.
message Invoice {
  string id = 1;
  string number = 2;
  // paid | open | void | uncollectible | draft
  string status = 3;
  int64 amount_due = 4;
  int64 amount_paid = 5;
  string currency = 6;
  google.protobuf.Timestamp created = 7;
  string hosted_invoice_url = 8;
  string invoice_pdf = 9;
  google.protobuf.Timestamp period_start = 10;
  google.protobuf.Timestamp period_end = 11;
}

message ListInvoicesRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32  limit  = 2; // 0 → server default (12)
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

service BillingService {
  rpc OpenPortal(OpenBillingPortalRequest) returns (OpenBillingPortalResponse) {
    option (google.api.http) = { post: "/v1/billing/connect/portal" body: "*" };
  }
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (google.api.http) = { get: "/v1/billing/invoices/{org_id}" };
  }
}

// ============================================================================
// User Settings — per-user preferences blob, JSONB-backed
// ============================================================================

// UserEmailSettings — top-level transactional email opt-ins.
// `security` is forced-on server-side but exposed here so the
// unsubscribe page can reflect that to the user.
message UserEmailSettings {
  optional bool product = 1;
  optional bool marketing = 2;
  optional bool security = 3;
  optional bool weekly_digest = 4;
}

message UserNotificationSettings {
  optional bool in_app = 1;
  optional bool push = 2;
  optional bool sound = 3;
}

// UserSettings — per-user preferences. All fields optional. The
// FE submits ONLY changed keys; the api jsonb-merges onto the row.
// Adding a field is a no-op (FE bumps + new key flows through).
message UserSettings {
  // "light" | "dark" | "system"
  optional string theme = 1;
  // IETF tag: "en", "fr", "es-419", etc.
  optional string locale = 2;
  // IANA tz: "America/New_York", "UTC".
  optional string timezone = 3;
  // "iso" | "us" | "eu"
  optional string date_format = 4;
  // "12h" | "24h"
  optional string time_format = 5;

  optional UserEmailSettings email = 6;
  optional UserNotificationSettings notifications = 7;
}

message GetUserSettingsRequest {}

message UpdateUserSettingsRequest {
  // Partial — only the keys to change. Nested objects are replaced
  // wholesale (the FE always sends the full nested object).
  UserSettings patch = 1;
}

// UserSettingsService — per-caller (no org scoping). The auth
// interceptor's user id determines whose settings are read/written;
// no admin override surface (admins use PlatformAdminService for
// other-user impersonation flows).
service UserSettingsService {
  rpc Get(GetUserSettingsRequest) returns (UserSettings) {
    option (google.api.http) = { get: "/v1/user/settings" };
  }
  rpc Update(UpdateUserSettingsRequest) returns (UserSettings) {
    option (google.api.http) = { post: "/v1/user/settings" body: "*" };
  }
}

// MFAService — multi-factor authentication device and TOTP management
service MFAService {
  rpc SetupTOTP(SetupTOTPRequest) returns (SetupTOTPResponse) {
    option (google.api.http) = { post: "/v1/mfa/totp/setup" body: "*" };
  }
  rpc VerifyTOTP(VerifyTOTPRequest) returns (VerifyTOTPResponse) {
    option (google.api.http) = { post: "/v1/mfa/totp/verify" body: "*" };
  }
  rpc ListDevices(ListMFADevicesRequest) returns (ListMFADevicesResponse) {
    option (google.api.http) = { get: "/v1/mfa/devices" };
  }
  rpc RevokeDevice(RevokeMFADeviceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/mfa/devices/{id}" };
  }
  rpc GenerateBackupCodes(GenerateBackupCodesRequest) returns (GenerateBackupCodesResponse) {
    option (google.api.http) = { post: "/v1/mfa/backup-codes" body: "*" };
  }
}

// ============================================================================
// IntrospectionService — self-describing service catalog
//
// Each service in a codefly module owns its own proto. This RPC
// describes THIS service (the api service) — its RPCs, the RBAC
// vocabulary it enforces, the RLS-protected tables it owns, the
// API-key scopes it accepts.
//
// Module-level view: a module is a collection of services. To
// answer "what can the saas-starter module do?", an aggregator
// (CLI command, gateway endpoint, Mind, etc.) walks every service
// in the module and merges each one's GetServiceInfo response.
// The aggregator is OUT OF SCOPE for this proto — keep cross-
// service concerns out of per-service definitions.
//
// All RPCs here are PUBLIC (no auth required) — they describe the
// API surface, not tenant data. The response REDACTS privileged
// (platform_admin, mfa) RPCs for unauthenticated callers; see
// threat-model note on the service.
// ============================================================================

// ServiceInfo — top-level identity of the service this catalog
// describes. The `module` field locates this service within its
// codefly module so an aggregator can group across services.
message ServiceInfo {
  string name = 1;          // service name, e.g. "api"
  string module = 2;        // owning module, e.g. "saas-starter"
  string version = 3;       // semver of the service's API surface
  string description = 4;
  string repo_url = 5;
}

// RPCInfo — one entry per gRPC RPC this service exposes.
message RPCInfo {
  string service = 1;          // proto-service name, e.g. "PermissionService"
  string method = 2;           // e.g. "AssignRole"
  string http_method = 3;      // "POST" | "GET" | "DELETE" | "PUT"
  string http_path = 4;        // e.g. "/v1/role-assignments"
  string description = 5;
  repeated string scopes = 6;  // required scopes when called via API key
  string handler_authz = 7;    // "public"|"auth"|"org_member"|"org_admin"|"platform_admin"|"mfa"
  bool emits_audit = 8;        // writes to audit_events?
}

// PermissionInfo — RBAC vocabulary this service enforces.
message PermissionInfo {
  string resource = 1;
  string action = 2;
  string description = 3;
  repeated string built_in_roles = 4;
}

// RLSPolicyInfo — RLS-protected table this service depends on (the
// table itself lives in the store service's schema, but this api
// service is the enforcer).
message RLSPolicyInfo {
  string table = 1;
  string policy_shape = 2;     // "direct"|"join"|"polymorphic"|"self_referential"
  bool fail_closed = 3;
  string scope_column = 4;     // typically "org_id"
  string notes = 5;
}

// ScopeInfo — API-key scope this service accepts.
message ScopeInfo {
  string scope = 1;            // e.g. "api_keys:write"
  string description = 2;
}

// ServiceCapabilities — the full self-description of one service.
message ServiceCapabilities {
  ServiceInfo info = 1;
  repeated RPCInfo rpcs = 2;
  repeated PermissionInfo permissions = 3;
  repeated RLSPolicyInfo rls_tables = 4;
  repeated ScopeInfo scopes = 5;
}

message GetServiceInfoRequest {}
message GetServiceInfoResponse {
  ServiceCapabilities capabilities = 1;
}

// IntrospectionService — describes THIS service only.
//
// Threat model: the API surface is not a secret — anyone with the
// binary can grep for it. But unauthenticated probes should not get
// a free attack-surface map. The server response REDACTS RPCs whose
// HandlerAuthz is "platform_admin" or "mfa" for unauthenticated
// callers. Authenticated callers see the full list. Callers must
// still pass the relevant auth tier to invoke any non-public RPC.
//
// Rate-limit: same shared limiter as the rest of the surface;
// tighten if this becomes a probe vector.
service IntrospectionService {
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse) {
    option (google.api.http) = { get: "/v1/.well-known/service-info" };
  }
}
