version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: auth-sidecar/pkg/gen
plugins:
  # Codefly invokes this template; explicit versions make generation
  # reproducible across developer machines and clean CI runners.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../code/pkg/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: ../code/pkg/gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.29.0
    out: ../code/pkg/gen
    opt: paths=source_relative
