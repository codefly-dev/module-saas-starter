path: /v1/mfa
routes:
    - path: /v1/mfa/totp/setup
      method: POST
      extension:
        exposed: true
        protected: true
    - path: /v1/mfa/totp/verify
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/mfa/devices
      method: GET
      extension:
        exposed: true
        protected: true
    - path: /v1/mfa/devices/{id}
      method: DELETE
      extension:
        exposed: true
        protected: true
    - path: /v1/mfa/backup-codes
      method: POST
      extension:
        exposed: true
        protected: true
