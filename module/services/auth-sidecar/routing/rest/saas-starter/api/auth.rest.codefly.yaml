path: /v1/auth
routes:
    - path: /v1/auth/authenticate
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/auth/refresh
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/auth/logout
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/auth/.well-known/jwks.json
      method: GET
      extension:
        exposed: true
        protected: false
