# Routes without protobuf RPC ownership remain explicit and finite.
path: /v1
routes:
    - path: /v1/auth/magic-link
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/auth/magic-link/verify
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/billing/webhook
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/email/webhook/resend
      method: POST
      extension:
        exposed: true
        protected: false
    - path: /v1/billing/checkout
      method: POST
      extension:
        exposed: true
        protected: true
    - path: /v1/billing/portal
      method: POST
      extension:
        exposed: true
        protected: true
