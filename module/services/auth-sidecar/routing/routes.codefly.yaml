# Static route whitelist for the auth-sidecar gateway.
#
# SECURITY: NO route is exposed by default. Every single gRPC method
# (both REST and Connect paths) must be explicitly listed here.
# Unlisted endpoints are BLOCKED with 404.
#
# Each route specifies:
#   service:   upstream service name (resolved via codefly network mappings)
#   method:    HTTP method for REST path (Connect is always POST)
#   rest:      REST path (from google.api.http annotation)
#   connect:   Connect RPC path (/package.Service/Method)
#   auth:      "required" | "public" | "mfa_pending"
#              required   = must have valid JWT
#              public     = no auth needed (e.g. login, webhooks)
#              mfa_pending = accepts mfa_token (short-lived, not full JWT)
#
# Generated by: codefly sync service auth-sidecar
# Source: api/proto/user.proto

# ═══════════════════════════════════════════════════════════════
# AuthService — public (unauthenticated by design)
# ═══════════════════════════════════════════════════════════════
routes:
  - service: api
    rest: { method: POST, path: "/v1/auth/authenticate" }
    connect: "/customers.AuthService/Authenticate"
    auth: public

  - service: api
    rest: { method: POST, path: "/v1/auth/refresh" }
    connect: "/customers.AuthService/RefreshToken"
    auth: public

  - service: api
    rest: { method: POST, path: "/v1/auth/logout" }
    connect: "/customers.AuthService/Logout"
    auth: public

  - service: api
    rest: { method: GET, path: "/v1/auth/.well-known/jwks.json" }
    connect: "/customers.AuthService/GetJWKS"
    auth: public

  # ═══════════════════════════════════════════════════════════════
  # MFAService — verify is mfa_pending, rest is authenticated
  # ═══════════════════════════════════════════════════════════════
  - service: api
    rest: { method: POST, path: "/v1/mfa/totp/verify" }
    connect: "/customers.MFAService/VerifyTOTP"
    auth: mfa_pending

  - service: api
    rest: { method: POST, path: "/v1/mfa/totp/setup" }
    connect: "/customers.MFAService/SetupTOTP"
    auth: required

  - service: api
    rest: { method: GET, path: "/v1/mfa/devices" }
    connect: "/customers.MFAService/ListDevices"
    auth: required

  - service: api
    rest: { method: DELETE, path: "/v1/mfa/devices/{id}" }
    connect: "/customers.MFAService/RevokeDevice"
    auth: required

  - service: api
    rest: { method: POST, path: "/v1/mfa/backup-codes" }
    connect: "/customers.MFAService/GenerateBackupCodes"
    auth: required

  # ═══════════════════════════════════════════════════════════════
  # Billing webhooks — public (Stripe sends HMAC-signed, no JWT)
  # ═══════════════════════════════════════════════════════════════
  - service: api
    rest: { method: POST, path: "/v1/billing/webhook" }
    auth: public

  - service: api
    rest: { method: POST, path: "/v1/billing/checkout" }
    auth: required

  - service: api
    rest: { method: POST, path: "/v1/billing/portal" }
    auth: required

