    auth: required

  - service: api
    rest: { method: GET, path: "/v1/users" }
    connect: "/customers.UserService/ListUsers"
    auth: required

  - service: api
    rest: { method: PATCH, path: "/v1/users/{uuid}" }
    connect: "/customers.UserService/UpdateUser"
    auth: required

  - service: api
    rest: { method: DELETE, path: "/v1/users/{uuid}" }
    connect: "/customers.UserService/DeleteUser"
    auth: required

  - service: api
    rest: { method: POST, path: "/v1/users/{user_uuid}/identities" }
    connect: "/customers.UserService/AddIdentity"
    auth: required

  - service: api
    rest: { method: GET, path: "/v1/users:findByIdentity" }
    connect: "/customers.UserService/FindUserByIdentity"
    auth: required

  - service: api
    rest: { method: GET, path: "/v1/users/{user_uuid}/identities" }
    connect: "/customers.UserService/ListUserIdentities"
    auth: required

