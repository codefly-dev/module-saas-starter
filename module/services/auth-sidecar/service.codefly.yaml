name: auth-sidecar
version: 0.0.0
description: |
  Single ingress + auth brain. Hosts two listeners:
    - gRPC ext_authz (for Envoy in production)
    - HTTP reverse proxy (for local dev via codefly run)
  Every request to the module goes through this service.
agent:
  kind: codefly:service
  name: go-grpc
  version: 0.0.146
  publisher: codefly.dev
service-dependencies:
  - name: accounts
  - name: frontend
endpoints:
  - name: grpc
    visibility: module
    api: grpc
  - name: http
    visibility: public
spec:
  hot-reload: true
  # Auth-sidecar is itself the HTTP ingress; it doesn't need grpc-gateway
  # to expose a REST facade of its internal proto.
  rest-endpoint: false
