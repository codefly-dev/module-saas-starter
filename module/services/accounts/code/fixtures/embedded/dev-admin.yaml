# dev-admin fixture — seeds a complete dev environment
# Used with: codefly run service --fixture dev-admin
# This file is shared across all services in the module.

# User ids are pinned so a reseed keeps the same principal uuid: committed
# configuration (grants, e2e specs, runbooks) can quote a fixture principal
# without re-deriving it after every fresh seed.
users:
  - id: 00000000-0000-7000-8000-0000000000a1
    email: admin@acme.com
    name: Sarah Chen
    role: super_admin
    provider: email
    provider_id: dev-admin
    # Development-only assurance attestation. The fixture validator is never
    # wired in production; this lets browser journeys exercise strict AAL2
    # operations without weakening their runtime policy.
    mfa_verified: true

  - id: 00000000-0000-7000-8000-0000000000a2
    email: alice@acme.com
    name: Alice Johnson
    role: admin
    provider: email
    provider_id: dev-alice

  - id: 00000000-0000-7000-8000-0000000000a3
    email: bob@acme.com
    name: Bob Williams
    role: member
    provider: email
    provider_id: dev-bob

  - id: 00000000-0000-7000-8000-0000000000a4
    email: carol@acme.com
    name: Carol Davis
    role: member
    provider: email
    provider_id: dev-carol

  - id: 00000000-0000-7000-8000-0000000000a5
    email: dana@example.com
    name: Dana Lee
    role: member
    provider: email
    provider_id: dev-dana

# Organization ids are pinned for the same reason as user ids: a module
# principal grant (MODULE_PRINCIPALS) names its tenant by organization id, and a
# committed grant can only quote an id that survives a fresh seed.
organizations:
  - id: 00000000-0000-7000-8000-0000000000c1
    name: Acme Corp
    owner: admin@acme.com
    members:
      - email: alice@acme.com
        role: admin
      - email: bob@acme.com
        role: member
      - email: carol@acme.com
        role: member

teams:
  - name: Engineering
    org: Acme Corp
    members:
      - alice@acme.com
      - bob@acme.com

  - name: Design
    org: Acme Corp
    members:
      - carol@acme.com

roles:
  - org: Acme Corp
    name: Collection reader
    description: Read documents in explicitly granted collections
    permissions:
      - resource: documents
        action: read

collections:
  - org: Acme Corp
    label: Wiki
    role: Collection reader
    readers:
      - admin@acme.com
      - bob@acme.com
