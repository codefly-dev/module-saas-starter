version: v2
modules:
  - path: .
    # `codefly/` contains the narrow dependency-client facade. The service's
    # canonical server schema lives under saas/accounts/v1 and must not generate
    # duplicate Go/Connect/REST symbols.
    excludes:
      - codefly
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - COMMENTS
    - STANDARD
  # The package is versioned and directory-aligned. Remaining exceptions are
  # explicit debt: P1-DOC-001 completes declaration comments; P1-PROTO-005
  # replaces shared Empty/nonstandard request-response types through a
  # compatibility-safe API transition rather than breaking stable v1 clients.
  except:
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE
    # SUBJECT_KIND_USER is a deprecated wire-compatible alias for PRINCIPAL.
    # Removing or renumbering it would break existing v1 binary/JSON clients.
    - ENUM_NO_ALLOW_ALIAS
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  # The S3/minio audit-export feature was removed wholesale (no client shipped
  # a stable dependency on it). These two deletions are the intentional break.
  # Each waiver is scoped to the single rule that the deletion trips, so every
  # other breaking rule still guards these paths (a later field renumber, type
  # change, etc. is NOT waived) and every other file stays fully protected.
  ignore_only:
    # audit_export.proto is deleted; waive only the file-deletion rule for it.
    FILE_NO_DELETE:
      - saas/accounts/v1/audit_export.proto
    # The solution-registration cold cutover (#952) deletes the whole
    # runtime-asserted presence surface: a solution's presence is now DELIVERED
    # by its declaration, so the writer RPCs a deployment used to heartbeat
    # through, and the request/response and observation messages behind them,
    # have no caller left. Legacy means delete, not deprecate — a retained
    # writer is a second way to assert presence, which is the thing the cutover
    # removes. Migration 26 drops the matching columns in the same change, so
    # there is no window in which the old surface could be served.
    #
    # Each waiver below is scoped to the single rule the deletion trips. buf
    # ignores are path-scoped, so a file is the narrowest expressible scope; the
    # comments record what inside each file is intended to go. Every other
    # breaking rule still guards these files, and the deletions are listed one
    # by one in the pull request body.
    ENUM_VALUE_NO_DELETE:
      # SolutionRegistrationStatus.SOLUTION_REGISTRATION_STATUS_EXPIRED (3):
      # derived from a lapsed lease, and there is no lease. Reserved in the
      # proto so the number is never reused.
      - saas/accounts/v1/solution_registry.proto
    # buf ignores are path-scoped, so neither entry can be narrowed to the single
    # message — the comments record the intended scope.
    MESSAGE_NO_DELETE:
      # AccessibleScope, ListAccessibleScopesResponse and ListMyAccessibleScopesRequest
      # moved to accessible_scopes.proto (issue #577) so a published client can bind
      # the caller-scoped read without also carrying the administrative authz surface.
      # Same package, same fully-qualified names, same wire format.
      - saas/accounts/v1/authorization.proto
      # ListOrgMembersRequest/Response, ListTeamsRequest/Response and
      # ListTeamMembersRequest/Response moved to directory.proto so a published
      # client can bind the read-only directory without the organization and
      # team administration surfaces. Same package, same fully-qualified names,
      # same wire format; every RPC stays where it was.
      - saas/accounts/v1/organizations.proto
      - saas/accounts/v1/teams.proto
      # Only AuditExportJob was dropped from jobs.proto. PrivacyExportJob's fields,
      # and every other rule, stay guarded.
      - saas/exports/v1/jobs.proto
      # PutSolutionRegistrationRequest and DeleteSolutionRegistrationRequest are
      # the deleted writer RPCs' messages; SolutionFrontendRegistration and
      # SolutionBackendRegistration are the observations a deployment used to
      # submit. All four belong to the removed writer surface (#952).
      - saas/accounts/v1/solution_registry.proto
    # ListMyAccessibleScopes moved from PermissionService to the new
    # AccessibleScopeService in accessible_scopes.proto (issue #577), which changes
    # its Connect/gRPC procedure path. Its REST route (GET /v1/accessible-scopes) is
    # unchanged, and the pinned catalog-count tests plus the generator drift gate
    # still fail on any RPC that disappears without the catalogs moving with it.
    RPC_NO_DELETE:
      - saas/accounts/v1/authorization.proto
      # PutSolutionRegistration and DeleteSolutionRegistration: the registry is
      # read-only to the wire now, written only by reconciling the declaration
      # (#952). No replacement RPC takes their place, so nothing moved — the
      # capability is gone.
      - saas/accounts/v1/solution_registry_service.proto
    # target_collection (a free-text string that was neither resolvable nor
    # grantable) is replaced by a scope-node boundary binding across the three
    # datasource messages (issue #473). Waive only field deletion for this file;
    # every other breaking rule still guards it.
    #
    # root_scope_path (a caller-chosen ltree path that let two installs collide or
    # nest) is replaced by a server-derived, UUID-labelled root node (issue #480).
    # Waive only field deletion for this file; every other breaking rule still
    # guards it.
    #
    # The FILE category flags a field deletion even when the number and name are
    # reserved — reservation is honoured by FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    # in the WIRE categories, which this module does not use. Every field below
    # is reserved in its proto regardless: the waiver is what makes CI pass, the
    # reservation is what stops the number being reused.
    FIELD_NO_DELETE:
      - saas/accounts/v1/datasource.proto
      - saas/accounts/v1/installations.proto
      # SolutionFrontendBinding.lease_expires_at (4),
      # SolutionBackendBinding.lease_expires_at (5) — presence is delivered, so
      # nothing renews a lease — and SolutionRegistration.runtime_boundary (9),
      # which is sealed into the Work Context instead of returned on a readable
      # record (#952).
      - saas/accounts/v1/solution_registry.proto
      # ModuleCurrentInstallationResponse.solution_identifier (3): a reusable
      # route alias, replaced by target_id and binding_id, which are identities.
      - saas/accounts/v1/module_capabilities.proto
