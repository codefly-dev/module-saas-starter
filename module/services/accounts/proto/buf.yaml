version: v2
modules:
  - path: .
    # `codefly/` contains the narrow dependency-client facade. The service's
    # canonical server schema lives under saas/accounts/v1 and must not generate
    # duplicate Go/Connect/REST symbols.
    excludes:
      - codefly
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - COMMENTS
    - STANDARD
  # The package is versioned and directory-aligned. Remaining exceptions are
  # explicit debt: P1-DOC-001 completes declaration comments; P1-PROTO-005
  # replaces shared Empty/nonstandard request-response types through a
  # compatibility-safe API transition rather than breaking stable v1 clients.
  except:
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE
    # SUBJECT_KIND_USER is a deprecated wire-compatible alias for PRINCIPAL.
    # Removing or renumbering it would break existing v1 binary/JSON clients.
    - ENUM_NO_ALLOW_ALIAS
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  # The S3/minio audit-export feature was removed wholesale (no client shipped
  # a stable dependency on it). These two deletions are the intentional break.
  # Each waiver is scoped to the single rule that the deletion trips, so every
  # other breaking rule still guards these paths (a later field renumber, type
  # change, etc. is NOT waived) and every other file stays fully protected.
  ignore_only:
    # audit_export.proto is deleted; waive only the file-deletion rule for it.
    FILE_NO_DELETE:
      - saas/accounts/v1/audit_export.proto
    # buf ignores are path-scoped, so neither entry can be narrowed to the single
    # message — the comments record the intended scope.
    MESSAGE_NO_DELETE:
      # AccessibleScope, ListAccessibleScopesResponse and ListMyAccessibleScopesRequest
      # moved to accessible_scopes.proto (issue #577) so a published client can bind
      # the caller-scoped read without also carrying the administrative authz surface.
      # Same package, same fully-qualified names, same wire format.
      - saas/accounts/v1/authorization.proto
      # Only AuditExportJob was dropped from jobs.proto. PrivacyExportJob's fields,
      # and every other rule, stay guarded.
      - saas/exports/v1/jobs.proto
    # ListMyAccessibleScopes moved from PermissionService to the new
    # AccessibleScopeService in accessible_scopes.proto (issue #577), which changes
    # its Connect/gRPC procedure path. Its REST route (GET /v1/accessible-scopes) is
    # unchanged, and the pinned catalog-count tests plus the generator drift gate
    # still fail on any RPC that disappears without the catalogs moving with it.
    RPC_NO_DELETE:
      - saas/accounts/v1/authorization.proto
    # target_collection (a free-text string that was neither resolvable nor
    # grantable) is replaced by a scope-node boundary binding across the three
    # datasource messages (issue #473). Waive only field deletion for this file;
    # every other breaking rule still guards it.
    #
    # root_scope_path (a caller-chosen ltree path that let two installs collide or
    # nest) is replaced by a server-derived, UUID-labelled root node (issue #480).
    # Waive only field deletion for this file; every other breaking rule still
    # guards it.
    FIELD_NO_DELETE:
      - saas/accounts/v1/datasource.proto
      - saas/accounts/v1/installations.proto
