syntax = "proto3";

package saas.accounts.v1;

import "google/protobuf/empty.proto";

// Codefly dependency-client facade.
//
// Codefly currently advertises a service's gRPC dependency contract from the
// proto/codefly/api.proto convention. Accounts' canonical, catalog-complete
// schema is split under saas/accounts/v1; this deliberately narrow facade keeps
// identity enforcement plus real dependency-test credential provisioning
// available to generated service clients without duplicating these symbols in
// Accounts' own Buf generation (buf.yaml excludes this file). Keep field
// numbers and wire method names aligned with the canonical schemas.

message FixtureAuthentication {
  string token = 1;
}

message AuthenticateRequest {
  string provider = 1;
  string provider_id = 2 [deprecated = true];
  string provider_email = 3 [deprecated = true];
  bool email_verified = 4 [deprecated = true];
  map<string, string> profile = 5;
  string device_info = 6;
  oneof authentication {
    FixtureAuthentication fixture = 8;
  }
}

message User {
  string uuid = 1;
}

message AuthenticateResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message JWKSResponse {
  string keys_json = 1;
}

service AuthService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  rpc GetJWKS(google.protobuf.Empty) returns (JWKSResponse);
}

message ListOrganizationsRequest {}

message Organization {
  string id = 1;
}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
}

message ResolveIdentityRequest {
  string provider = 1;
  string provider_id = 2;
}

message ResolveIdentityResponse {
  string user_id = 1;
  string org_id = 2;
  repeated string roles = 3;
  bool found = 4;
  string org_role = 5;
  string platform_role = 6;
}

service IdentityService {
  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolveIdentityResponse);
}

message ValidateAPIKeyRequest {
  string key = 1;
}

message ValidateAPIKeyResponse {
  bool valid = 1;
  string user_id = 2;
  string organization_id = 3;
  repeated string scopes = 4;
  repeated string workspaces = 5;
  repeated string roles = 6;
  map<string, string> attributes = 7;
  string principal_kind = 8;
}

enum APIKeyEnvironment {
  API_KEY_ENVIRONMENT_UNSPECIFIED = 0;
  API_KEY_ENVIRONMENT_LIVE = 1;
  API_KEY_ENVIRONMENT_TEST = 2;
}

message Permission {
  string resource = 1;
  string action = 2;
}

message CreateAPIKeyRequest {
  string organization_id = 1;
  string name = 2;
  repeated Permission scopes = 3;
  APIKeyEnvironment environment = 4;
}

message CreateAPIKeyResponse {
  string plaintext_key = 2;
}

service APIKeyService {
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
}

// Narrow dependency-client mirror of the canonical WorkContextService
// consumer authority methods. Field numbers and full wire method names must
// stay aligned with saas/accounts/v1/work_contexts.proto.
message WorkContextScope {
  string resource_kind = 1;
  repeated string actions = 2;
  repeated string resource_ids = 3;
}

message WorkContextRevisionSubject {
  string principal_id = 1;
  repeated WorkContextScope scopes = 2;
}

message CheckAuthorizationRevisionRequest {
  string org_id = 1;
  string owner_principal_id = 2;
  uint64 authorization_revision = 3;
  repeated WorkContextRevisionSubject subjects = 4;
}

message AuthorizeEvidenceReadRequest {
  string org_id = 1;
  string caller_principal_id = 2;
  optional string owner_principal_id = 3;
  optional string task_id = 4;
  optional string session_id = 5;
}

service WorkContextService {
  rpc CheckAuthorizationRevision(CheckAuthorizationRevisionRequest) returns (google.protobuf.Empty);
  rpc AuthorizeEvidenceRead(AuthorizeEvidenceReadRequest) returns (google.protobuf.Empty);
}
