syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// MFA (Multi-Factor Authentication)
// ============================================================================

enum MFADeviceType {
  MFA_DEVICE_TYPE_UNSPECIFIED = 0;
  MFA_DEVICE_TYPE_TOTP = 1;
  MFA_DEVICE_TYPE_WEBAUTHN = 2;
}

message MFADevice {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  MFADeviceType device_type = 3;
  string name = 4;
  google.protobuf.Timestamp verified_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SetupTOTPRequest {}

message SetupTOTPResponse {
  string secret = 1;
  string provisioning_uri = 2;
  repeated string backup_codes = 3;
}

message VerifyTOTPRequest {
  string code = 1 [(buf.validate.field).string = {
    len: 6
    pattern: "^[0-9]+$"
  }];
}

message VerifyTOTPResponse {
  bool valid = 1;
  MFADevice device = 2;
}

message ListMFADevicesRequest {}

message ListMFADevicesResponse {
  repeated MFADevice devices = 1;
}

message RevokeMFADeviceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GenerateBackupCodesRequest {}

message GenerateBackupCodesResponse {
  repeated string backup_codes = 1;
}

message BeginWebAuthnRegistrationRequest {}

message BeginWebAuthnRegistrationResponse {
  string ceremony_token = 1;
  // JSON-encoded PublicKeyCredentialCreationOptions generated by the server.
  string public_key_options_json = 2;
}

message FinishWebAuthnRegistrationRequest {
  string ceremony_token = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 255
  }];
  string credential_response_json = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 131072
  }];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

message FinishWebAuthnRegistrationResponse {
  MFADevice device = 1;
}

// MFAService — multi-factor authentication device and TOTP management
service MFAService {
  rpc BeginWebAuthnRegistration(BeginWebAuthnRegistrationRequest) returns (BeginWebAuthnRegistrationResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.webauthn_registration_started.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/mfa/webauthn/register/begin"
      body: "*"
    };
  }
  rpc FinishWebAuthnRegistration(FinishWebAuthnRegistrationRequest) returns (FinishWebAuthnRegistrationResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.webauthn_registered.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/mfa/webauthn/register/finish"
      body: "*"
    };
  }
  rpc SetupTOTP(SetupTOTPRequest) returns (SetupTOTPResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.totp_setup_started.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/mfa/totp/setup"
      body: "*"
    };
  }
  rpc VerifyTOTP(VerifyTOTPRequest) returns (VerifyTOTPResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.totp_verified.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/mfa/totp/verify"
      body: "*"
    };
  }
  rpc ListDevices(ListMFADevicesRequest) returns (ListMFADevicesResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/mfa/devices"};
  }
  rpc RevokeDevice(RevokeMFADeviceRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.device_revoked.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {delete: "/v1/mfa/devices/{id}"};
  }
  rpc GenerateBackupCodes(GenerateBackupCodesRequest) returns (GenerateBackupCodesResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_USER
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "mfa.backup_codes_generated.v1"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_MFA
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/mfa/backup-codes"
      body: "*"
    };
  }
}
