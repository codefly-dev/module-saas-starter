syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "codefly/runnable/v0/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "saas/jobs/v1/jobs.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Datasource — a tenant-declared external source (a GitHub repo + paths) whose
// contents are pulled and kept fresh, then ingested into the documents store as
// versioned Entries. saas-starter owns "connection": the datasource record, the
// per-source credential + webhook-signing secret (SecretCipher envelopes), the
// pull trigger, and inbound webhook receipt. The ingest engine that projects the
// enqueued deliveries into Entry/Version lives in the documents module and
// consumes the durable jobs inbox this contract feeds.
// ============================================================================

// DatasourceProvider identifies the external system a datasource connects to.
// GitHub is the bespoke connector; API is the generic "HTTP API with a stored
// credential" connector that covers a large class of sources without a
// per-provider proto change; CRAWLER ingests a documentation website from its
// sitemap.xml; UPLOAD pulls objects from an S3-compatible object store. The enum
// is the extension point for further connectors.
enum DatasourceProvider {
  DATASOURCE_PROVIDER_UNSPECIFIED = 0;
  DATASOURCE_PROVIDER_GITHUB = 1;
  DATASOURCE_PROVIDER_API = 2;
  DATASOURCE_PROVIDER_CRAWLER = 3;
  DATASOURCE_PROVIDER_UPLOAD = 4;
}

// DatasourceStatus is the datasource lifecycle. A datasource is active from
// creation; pausing stops scheduled pulls and webhook ingestion without dropping
// the stored credential, so re-enabling is cheap.
enum DatasourceStatus {
  DATASOURCE_STATUS_UNSPECIFIED = 0;
  DATASOURCE_STATUS_ACTIVE = 1;
  DATASOURCE_STATUS_PAUSED = 2;
  // The source is parked because it cannot make progress for a structural
  // reason somebody must resolve; status_reason says which. The host sets it,
  // never the tenant, so it is worth surfacing unprompted. Already-ingested
  // content is retained and stays readable — degrading stops future pulls, it
  // never withdraws history.
  DATASOURCE_STATUS_DEGRADED = 3;
}

// DatasourceLiveDelivery is how a change at the source reaches this deployment
// without waiting for the periodic reconcile. It is what makes "is this source
// current?" answerable: with no live delivery, a source is current only as of
// its last sync, and reconcile_interval bounds how stale it may be.
//
// It is a property of the source AND of the deployment, which is why one
// boolean could never carry it. A source connected through the GitHub App holds
// no push secret of its own — its pushes arrive at the App's single webhook URL
// — so the per-source webhook_configured flag is false for it whether the
// deployment registered that App webhook or not. Reading that flag alone,
// every App-backed source looks exactly like a source with no live delivery at
// all, which is the most common connect path.
enum DatasourceLiveDelivery {
  DATASOURCE_LIVE_DELIVERY_UNSPECIFIED = 0;
  // Nothing pushes to this source. It is refreshed by the periodic reconcile
  // and by "Sync now", and by nothing else.
  DATASOURCE_LIVE_DELIVERY_NONE = 1;
  // The source's own repository webhook, verified with the signing secret
  // stored against it. This is what webhook_configured has always reported.
  DATASOURCE_LIVE_DELIVERY_SOURCE_WEBHOOK = 2;
  // The deployment's GitHub App webhook: one registered endpoint carrying the
  // pushes of every App-backed source, fanned out per source on receipt. Set
  // only when this deployment has actually registered that webhook, so it is
  // also the answer to "has anyone wired live delivery here at all".
  DATASOURCE_LIVE_DELIVERY_APP_WEBHOOK = 3;
}

// GitHubDatasourceConfig is the public, non-secret configuration of a GitHub
// datasource. The access token and webhook signing secret are never carried
// here; they live only as SecretCipher envelopes in the credential store.
message GitHubDatasourceConfig {
  // "owner/name", e.g. "codefly-dev/module-saas-starter".
  string repo = 1;
  // Repository-relative path prefixes to ingest. Empty means the whole repo.
  repeated string paths = 2;
  // Git ref (branch) to pull. Empty resolves to the repository default branch.
  string branch = 3;
  // Optional case-insensitive file suffixes, e.g. [".md", ".mdx"]. Empty
  // admits every file type within paths. Applied before content is fetched.
  repeated string file_extensions = 4;
}

// ApiCredentialKind is how the generic API connector presents its stored
// credential on every outbound request. The credential material itself lives in
// the secret store; only the kind (and, for KIND_HEADER/KIND_QUERY, the header
// or parameter name, and for KIND_OAUTH2 the token endpoint and client id) is
// non-secret config.
enum ApiCredentialKind {
  API_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // Authorization: Bearer <credential>.
  API_CREDENTIAL_KIND_BEARER = 1;
  // Authorization: Basic <credential>, where the stored credential is the
  // already-encoded "user:password" pair.
  API_CREDENTIAL_KIND_BASIC = 2;
  // <credential_header>: <credential>, for APIs that take a raw token in a
  // named header (e.g. X-API-Key).
  API_CREDENTIAL_KIND_HEADER = 3;
  // <credential_query_param>=<credential> appended to the request query, for
  // APIs that take the key as a query-string parameter (e.g. ?api_key=…).
  API_CREDENTIAL_KIND_QUERY = 4;
  // OAuth 2.0 refresh-token flow: the stored credential is a refresh token
  // (plus, for a confidential client, a client secret). saas exchanges it for a
  // short-lived access token at fetch time, rotates the stored token set, and
  // presents the access token as Authorization: Bearer.
  API_CREDENTIAL_KIND_OAUTH2 = 5;
}

// ApiOAuth2Config is the non-secret OAuth 2.0 configuration of an API source
// whose credential_kind is API_CREDENTIAL_KIND_OAUTH2. The refresh token and
// client secret are never carried here; they live only as a SecretCipher
// envelope in the credential store and are rotated in place on refresh.
message ApiOAuth2Config {
  enum Grant {
    // Default preserves stored refresh-token sources.
    GRANT_UNSPECIFIED = 0;
    GRANT_REFRESH_TOKEN = 1;
    GRANT_CLIENT_CREDENTIALS = 2;
    GRANT_AUTHORIZATION_CODE = 3;
  }
  Grant grant = 4;
  // Token endpoint the refresh_token grant is exchanged at, e.g.
  // "https://oauth2.example.com/token". Absolute http(s) URL.
  string token_url = 1;
  // OAuth client id presented on the refresh request.
  string client_id = 2;
  // Scopes requested on refresh; empty requests the token's existing scopes.
  repeated string scopes = 3;
}

// ApiDatasourceConfig is the public, non-secret configuration of a generic
// API-with-credentials datasource. The credential value (bearer/basic/header
// token) and any webhook signing secret are never carried here; they live only
// as SecretCipher envelopes in the credential store.
message ApiDatasourceConfig {
  // Base URL of the API, e.g. "https://api.example.com".
  string base_url = 1;
  // Resource path, relative to base_url, whose response is pulled and handed to
  // the ingest inbox, e.g. "/v1/documents".
  string resource_path = 2;
  ApiCredentialKind credential_kind = 3;
  // Header name for API_CREDENTIAL_KIND_HEADER; ignored for the other kinds.
  string credential_header = 4;
  // Query-string parameter name for API_CREDENTIAL_KIND_QUERY; ignored for the
  // other kinds.
  string credential_query_param = 5;
  // OAuth 2.0 configuration for API_CREDENTIAL_KIND_OAUTH2; unset for the other
  // kinds.
  ApiOAuth2Config oauth2 = 6;
}

// CrawlerDatasourceConfig is the public configuration of a web/sitemap crawler
// datasource. It needs no credential: it reads the sitemap and fetches the
// listed pages over public HTTP.
message CrawlerDatasourceConfig {
  // Absolute http(s) URL of the site's sitemap.xml.
  string sitemap_url = 1;
  // Upper bound on pages fetched per sync. Zero applies the connector default.
  uint32 max_pages = 2;
}

// UploadDatasourceConfig is the public, non-secret configuration of an
// S3-compatible object-storage datasource. The secret access key is never
// carried here; it lives only as a SecretCipher envelope in the credential
// store. Addressing is path-style, so it works against MinIO and other
// S3-compatible stores as well as AWS S3.
message UploadDatasourceConfig {
  // Absolute http(s) endpoint of the object store, e.g.
  // "https://s3.us-east-1.amazonaws.com" or a MinIO endpoint.
  string endpoint = 1;
  // Signing region, e.g. "us-east-1".
  string region = 2;
  string bucket = 3;
  // Key prefix to pull under; empty pulls the whole bucket.
  string prefix = 4;
  // AWS-style access key id. The matching secret access key is the credential.
  string access_key_id = 5;
  // Upper bound on objects fetched per sync. Zero applies the connector default.
  uint32 max_objects = 6;
}

// Datasource is one connected external datasource. It is org-scoped and carries
// only non-secret projection fields; credential material is deliberately absent.
// Exactly one provider config (github, api, crawler, or upload) is set, matching
// provider.
message Datasource {
  reserved 4;
  reserved "target_collection";
  string id = 1;
  string org_id = 2;
  DatasourceProvider provider = 3;
  GitHubDatasourceConfig github = 5;
  DatasourceStatus status = 6;
  // True once a webhook signing secret has been stored for the datasource, so
  // clients can reflect whether live updates are wired without exposing it.
  bool webhook_configured = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // When the leased sync worker last completed a pull for an api, crawler, or
  // upload source. Never set for a github source, whose ingest is tracked by
  // last_ingested_at instead.
  google.protobuf.Timestamp last_synced_at = 10;
  ApiDatasourceConfig api = 11;
  CrawlerDatasourceConfig crawler = 12;
  UploadDatasourceConfig upload = 13;
  // The scope node whose subtree the pulled Entries land in — the data boundary
  // this source writes into (issue #473). Grantable like any scope node.
  string boundary_node_id = 14;
  // When the change-set compiler last durably enqueued a change set: a webhook
  // delivery, the periodic reconcile, or a tenant pressing "Sync now", which for
  // this provider dispatches a forced reconcile rather than a pull. Set only for
  // a github source — the other providers advance last_synced_at instead, so at
  // most one of the two clocks ever ticks for a given source. Unset until the
  // first delivery lands.
  google.protobuf.Timestamp last_ingested_at = 15;
  // Head commit fully enqueued as a change set at last_ingested_at; the compiler
  // diffs the next delivery from it. Empty until the first delivery lands, and
  // like last_ingested_at set only for a github source.
  string last_ingested_commit = 16;
  // Why the source left DATASOURCE_STATUS_ACTIVE, in prose a tenant can act on;
  // empty while it is active. Every value is produced by one of a closed set of
  // named constructors in the host, so it carries no credential material, token,
  // or signing secret — raw provider error text can never reach this field.
  string status_reason = 17;
  // The display label of boundary_node_id: the collection's name, as the
  // organization named it. Any member who may list the organization's sources
  // reads it, whether or not they may read the collection's content: it names
  // where the source writes, as repo names what it reads. Carried by
  // ListSources and GetSource; empty in the other responses that return a
  // Datasource.
  string boundary_label = 18;
  // Whether the source's provider meets the datasource connector envelope and
  // passes its conformance suite. A source of a non-conformant provider keeps
  // running, and a client flags it; no new source of that provider can be
  // connected until it conforms.
  bool conformant = 19;
  // What keeps a non-conformant provider off the envelope, in prose. Never
  // empty for a non-conformant source and always empty for a conformant one,
  // so a client that must also read an older host, which sends neither field,
  // can key its flag on this and treat an empty gap as nothing to flag.
  string conformance_gap = 20;
  // How a change at the source reaches this deployment without waiting for the
  // reconcile below. Strictly more informative than webhook_configured, which
  // it does not replace: that field still reports exactly what it always did,
  // whether a signing secret is stored for this source.
  DatasourceLiveDelivery live_delivery = 21;
  // How often this source is reconciled from scratch when nothing pushes — the
  // bound on how stale it may be. Zero means the periodic reconcile is off for
  // it, which together with live_delivery NONE means it only ever changes when
  // somebody presses "Sync now".
  google.protobuf.Duration reconcile_interval = 22;
}

message AddGitHubSourceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // "owner/name".
  string repo = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 255
    pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  }];
  repeated string paths = 3 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 512
      }
    }
  }];
  string branch = 4 [(buf.validate.field).string.max_len = 255];
  reserved 5;
  reserved "target_collection";
  // The data boundary the pulled Entries land in (issue #473): either an
  // existing scope node's id, or a label to mint a new `collection` node under
  // the org. Exactly one is required.
  oneof boundary {
    option (buf.validate.oneof).required = true;
    string boundary_node_id = 8 [(buf.validate.field).string.uuid = true];
    string collection_label = 9 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }
  // Plaintext, repository-scoped fine-grained GitHub PAT used to read the
  // repository. Encrypted through the SecretCipher at receipt; only its envelope
  // reference is persisted.
  //
  // Empty connects the source through the deployment's GitHub App instead: the
  // host resolves the installation covering `repo` itself and mints a
  // short-lived, repository-scoped installation token for every fetch, so no
  // token is ever pasted or stored. That path requires this organization to
  // have completed App setup (BeginGitHubAppSetup then CompleteGitHubAppSetup)
  // for the installation covering `repo`, and is refused when no App is
  // registered for the deployment.
  string access_token = 6 [(buf.validate.field).string.max_len = 1024];
  // Plaintext shared secret GitHub signs push deliveries with
  // (X-Hub-Signature-256). Optional at creation; when omitted, live webhook
  // ingestion stays off until a later call supplies one. Encrypted at receipt.
  string webhook_secret = 7 [(buf.validate.field).string.max_len = 1024];
  // Optional file suffix allowlist, intersected with paths (not a glob).
  repeated string file_extensions = 10 [(buf.validate.field).repeated = {
    max_items: 32
    items: { string: { min_len: 2 max_len: 33 pattern: "^\\.[A-Za-z0-9][A-Za-z0-9._-]*$" } }
  }];
}

message AddGitHubSourceResponse {
  Datasource datasource = 1;
}

// AddSourceRequest is the provider-agnostic connect call. provider selects the
// connector; the config oneof carries that provider's non-secret configuration
// (the variant must match provider); credential carries the plaintext secret the
// connector authenticates with (a GitHub token, or the API connector's
// bearer/basic/header credential), encrypted through the SecretCipher at receipt
// so only its envelope reference is persisted.
message AddSourceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  DatasourceProvider provider = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 3;
  reserved "target_collection";
  oneof config {
    GitHubDatasourceConfig github = 4;
    ApiDatasourceConfig api = 5;
    CrawlerDatasourceConfig crawler = 8;
    UploadDatasourceConfig upload = 9;
  }
  // The data boundary the pulled Entries land in (issue #473): either an
  // existing scope node's id, or a label to mint a new `collection` node under
  // the org. Exactly one is required.
  oneof boundary {
    option (buf.validate.oneof).required = true;
    string boundary_node_id = 12 [(buf.validate.field).string.uuid = true];
    string collection_label = 13 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
  }
  // Plaintext credential the connector authenticates with (a GitHub token, the
  // API connector's bearer/basic/header credential, or the object store's secret
  // access key). Optional for providers that need none, such as the crawler.
  // Encrypted at receipt. Its absence for a credential-taking provider is
  // rejected by the connector.
  string credential = 6 [(buf.validate.field).string.max_len = 4096];
  // Plaintext webhook signing secret. Optional; when omitted, live webhook
  // ingestion stays off until a later call supplies one. Encrypted at receipt.
  string webhook_secret = 7 [(buf.validate.field).string.max_len = 1024];
  // Plaintext OAuth 2.0 client secret, for API_CREDENTIAL_KIND_OAUTH2 with a
  // confidential client. Optional (a public client omits it). Encrypted at
  // receipt alongside the refresh token carried in credential; never projected.
  string oauth2_client_secret = 10 [(buf.validate.field).string.max_len = 1024];
}

message AddSourceResponse {
  Datasource datasource = 1;
}

// DatasourceConfigField describes one non-secret config input a provider needs,
// so the UI can render the connect form from the catalog rather than hardcoding
// it per provider.
message DatasourceConfigField {
  // Config field key, matching the provider's config message field name.
  string key = 1;
  string display_name = 2;
  string help = 3;
  bool required = 4;
}

// DatasourceConnectorInterface is one of the five connector interfaces a
// provider is served through. The set is closed; the set of providers is open.
enum DatasourceConnectorInterface {
  DATASOURCE_CONNECTOR_INTERFACE_UNSPECIFIED = 0;
  // Files: bytes with a media type and a path (a repository, a drive, a bucket).
  DATASOURCE_CONNECTOR_INTERFACE_FILES = 1;
  // Pages: a rendered body in a parent/child hierarchy (a knowledge base, a crawled site).
  DATASOURCE_CONNECTOR_INTERFACE_PAGES = 2;
  // Records: typed rows the provider's schema describes (a CRM, a ticket system).
  DATASOURCE_CONNECTOR_INTERFACE_RECORDS = 3;
  // Messages: mail and chat, a body and attachments plus the message itself.
  DATASOURCE_CONNECTOR_INTERFACE_MESSAGES = 4;
  // Events: calendar entries.
  DATASOURCE_CONNECTOR_INTERFACE_EVENTS = 5;
}

// DatasourceCredentialMode is how a connector authenticates to its provider.
// The host holds every credential; the mode says which kind a connect asks for.
enum DatasourceCredentialMode {
  DATASOURCE_CREDENTIAL_MODE_UNSPECIFIED = 0;
  // The provider serves the source without a credential.
  DATASOURCE_CREDENTIAL_MODE_NONE = 1;
  // An org-level app or installation the host holds.
  DATASOURCE_CREDENTIAL_MODE_ORG_APP = 2;
  // A person's own OAuth grant; such a source is readable by that person alone.
  DATASOURCE_CREDENTIAL_MODE_USER_OAUTH = 3;
  // A token or key the tenant supplies once.
  DATASOURCE_CREDENTIAL_MODE_STATIC_SECRET = 4;
}

// DatasourceReadersModel is how a connector derives each item's readers.
enum DatasourceReadersModel {
  DATASOURCE_READERS_MODEL_UNSPECIFIED = 0;
  // The provider has no per-item access list: every item is readable by
  // whoever may read the source's boundary.
  DATASOURCE_READERS_MODEL_SOURCE_SCOPED = 1;
  // The provider's per-item access lists are translated into host users and
  // teams; what cannot be translated is readable by the boundary's
  // administrators only.
  DATASOURCE_READERS_MODEL_TRANSLATED = 2;
}

// DatasourceConnectorBudget is the limits a connector serves within: the size
// of one call, and the quota of calls one credential may spend per window.
// Syncs a person started use the whole quota; background syncs use at most
// background_share_percent of it, so they always leave room for a person.
message DatasourceConnectorBudget {
  uint32 max_items_per_call = 1;
  int64 max_bytes_per_call = 2;
  int64 max_item_bytes = 3;
  uint32 operations_per_window = 4;
  int64 window_seconds = 5;
  uint32 background_share_percent = 6;
}

// DatasourceProviderDescriptor is one catalog entry: everything the UI needs to
// offer and configure a provider without provider-specific code.
message DatasourceProviderDescriptor {
  DatasourceProvider provider = 1;
  string display_name = 2;
  string description = 3;
  repeated DatasourceConfigField config_fields = 4;
  // Whether the provider can verify inbound webhook deliveries.
  bool supports_webhook = 5;
  // Credential kinds this connector accepts, so the UI can offer the matching
  // credential inputs. Empty for a connector with a bespoke credential shape
  // (GitHub: an access token plus an optional webhook secret).
  repeated ApiCredentialKind supported_credential_kinds = 6;
  // The connector's registry key, e.g. "github".
  string connector = 7;
  DatasourceConnectorInterface interface = 8;
  repeated DatasourceCredentialMode credential_modes = 9;
  DatasourceReadersModel readers_model = 10;
  // Unset for a provider that is not conformant.
  DatasourceConnectorBudget budget = 11;
  // Whether the provider meets the datasource connector envelope and passes
  // its conformance suite.
  bool conformant = 12;
  // What keeps a non-conformant provider off the envelope; empty otherwise.
  string conformance_gap = 13;
  // Whether a new source of this provider may be connected now. False for a
  // non-conformant provider, and for one that translates provider permissions
  // while this deployment does not enforce them at read.
  bool accepts_new_sources = 14;
  // Whether THIS deployment has configured the provider-level push endpoint
  // this connector receives on. supports_webhook says the connector can take
  // pushes at all; this says an operator has wired them here. The pair is what
  // distinguishes "this provider has no push path" from "it has one and nobody
  // turned it on", which otherwise look identical from every client: both leave
  // every source of it with no live delivery. Always false for a connector
  // whose supports_webhook is false.
  bool live_delivery_configured = 15;
  // Sync admission remains accepts_new_sources; operations have a separate gate.
  bool accepts_operations = 16;
  string operations_gap = 17;
  string oauth_authorize_url = 18;
  string oauth_token_url = 19;
  repeated string oauth_scopes = 20;

}

message GetDatasourceCatalogRequest {}

message GetDatasourceCatalogResponse {
  repeated DatasourceProviderDescriptor providers = 1;
}

message ListSourcesRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListSourcesResponse {
  repeated Datasource datasources = 1;
}

message GetSourceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message GetSourceResponse {
  Datasource datasource = 1;
}

message SyncSourceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
  // Optional replacement PAT: validate and encrypt for this existing GitHub
  // source before queuing sync. Empty keeps the saved credential. Never returned.
  string access_token = 3 [(buf.validate.field).string.max_len = 4096];
  // Reconnect the source: from now on its syncs run on behalf of the caller,
  // exactly as when a person connects it (the source's delegations move to the
  // caller). A replacement access_token is always a reconnect. Without one,
  // only a GitHub source that holds no credential (a public repository)
  // reconnects this way: the repository is proved still readable without a
  // credential, then the delegation is recorded and a sync is queued. A source
  // that holds a credential reconnects only with a replacement for it.
  bool reconnect = 4;
}

message SyncSourceResponse {
  // Durable jobs-inbox id of the enqueued sync request. The pull runs
  // asynchronously in a leased worker; this id lets callers trace it.
  string job_id = 1;
}

message GetSourceSyncRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string source_id = 2 [(buf.validate.field).string.uuid = true];
  // The sync to read: the job id SyncSource returned. Empty reads the source's
  // latest sync, whatever started it — the first sync enqueued at connect, a
  // "Sync now", the periodic reconcile or a webhook delivery — so a client can
  // show progress for a sync it did not start itself.
  string job_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message SourceSyncDelivery {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  saas.jobs.v1.JobState state = 2 [(buf.validate.field).required = true];
  saas.jobs.v1.JobExecutionReference execution = 3;
}

// SourceSyncPhase is the stage the host has reached in one sync of a source.
// (Not module_capabilities' SourceSyncStage, which names the one occurrence a
// collection's provenance records.) The phases are the host's own work only: once the change set is handed off, what
// the consuming module does with each file is the module's to report.
enum SourceSyncPhase {
  SOURCE_SYNC_PHASE_UNSPECIFIED = 0;
  // Accepted and waiting for a worker, or waiting out a retry (failure then
  // says why and until when).
  SOURCE_SYNC_PHASE_QUEUED = 1;
  // A worker holds the sync: resolving the branch head and fetching the
  // repository over git.
  SOURCE_SYNC_PHASE_FETCHING = 2;
  // The change set is compiled and its files are being handed to the
  // consuming module's queue; changes counts them.
  SOURCE_SYNC_PHASE_COMPILED = 3;
  // The whole change set is on the consuming module's queue and the module has
  // not yet taken all of it.
  SOURCE_SYNC_PHASE_HANDED_OFF = 4;
  // The host's part is finished: the module took every file handed to it, or
  // there was nothing to hand off.
  SOURCE_SYNC_PHASE_DONE = 5;
  // The sync stopped and will not retry; failure says why.
  SOURCE_SYNC_PHASE_FAILED = 6;
}

// SourceSyncFailureReason classifies why a sync is waiting or failed, so a
// client can offer the remedy without parsing prose.
enum SourceSyncFailureReason {
  SOURCE_SYNC_FAILURE_REASON_UNSPECIFIED = 0;
  // The provider rate limited the host; retry_at is when the limit resets,
  // when the provider said.
  SOURCE_SYNC_FAILURE_REASON_RATE_LIMITED = 1;
  // The stored credential was rejected or cannot be read: reconnect.
  SOURCE_SYNC_FAILURE_REASON_CREDENTIAL = 2;
  // The provider denied access to the repository.
  SOURCE_SYNC_FAILURE_REASON_ACCESS_DENIED = 3;
  // The repository, branch or content was not found.
  SOURCE_SYNC_FAILURE_REASON_NOT_FOUND = 4;
  // The source selects more than the host holds for one source: narrow it.
  SOURCE_SYNC_FAILURE_REASON_TOO_LARGE = 5;
  // The host itself cannot sync right now (a dependency is missing or down).
  SOURCE_SYNC_FAILURE_REASON_HOST_UNAVAILABLE = 6;
  // Any other failure; message says what can be said safely.
  SOURCE_SYNC_FAILURE_REASON_OTHER = 7;
  // The consuming module dead-lettered a file the host handed it.
  SOURCE_SYNC_FAILURE_REASON_DELIVERY_FAILED = 8;
}

// SourceSyncTrigger is what started a sync.
enum SourceSyncTrigger {
  SOURCE_SYNC_TRIGGER_UNSPECIFIED = 0;
  // A tenant pressed "Sync now", or connected the source.
  SOURCE_SYNC_TRIGGER_MANUAL = 1;
  // The periodic reconcile.
  SOURCE_SYNC_TRIGGER_SCHEDULED = 2;
  // A webhook delivery from the provider.
  SOURCE_SYNC_TRIGGER_WEBHOOK = 3;
}

// SourceSyncChanges counts the change set a sync compiled, relative to the
// commit the host last handed off for the source.
message SourceSyncChanges {
  // Files the change set hands off: every in-scope file for a full snapshot,
  // the changed files for an incremental change set.
  uint32 files = 1;
  uint32 added = 2;
  uint32 modified = 3;
  uint32 deleted = 4;
  // False when the split into added/modified/deleted is unknown, e.g. a
  // snapshot after a force push whose previous commit is gone. files is known
  // either way.
  bool split_known = 5;
  // True for a full snapshot, false for an incremental change set.
  bool snapshot = 6;
  // The commit the change set brings the source to.
  string commit = 7;
}

// SourceSyncFailure is why a sync is waiting to retry, or why it failed.
message SourceSyncFailure {
  SourceSyncFailureReason reason = 1;
  // The stable failure code, e.g. "datasource.github_rate_limited".
  string code = 2;
  // What happened, in prose a tenant can act on. Every value comes from a
  // closed set of host-authored messages; raw provider text never reaches it.
  string message = 3;
  // True while the sync will try again; false once it has failed for good.
  bool retrying = 4;
  // When the next attempt may run: for a rate limit, when the limit resets.
  google.protobuf.Timestamp retry_at = 5;
}

// SourceSyncProgress is one sync's phases, each stamped from the durable
// record the host keeps of it — no stage is inferred from elapsed time.
message SourceSyncProgress {
  SourceSyncPhase phase = 1;
  SourceSyncTrigger trigger = 2;
  // When the sync was accepted.
  google.protobuf.Timestamp queued_at = 3;
  // When a worker last started on it (the latest attempt).
  google.protobuf.Timestamp fetching_at = 4;
  // When the first file of the compiled change set was handed off.
  google.protobuf.Timestamp compiled_at = 5;
  // When the whole change set was on the module's queue.
  google.protobuf.Timestamp handed_off_at = 6;
  // When the sync reached DONE or FAILED.
  google.protobuf.Timestamp finished_at = 7;
  // Set once the change set is compiled. Unset when the sync handed nothing
  // off; with phase DONE that means the source had not changed.
  SourceSyncChanges changes = 8;
  // Set while the sync waits to retry, and when it failed.
  SourceSyncFailure failure = 9;
  // How many attempts the host has made, and may make.
  uint32 attempt = 10;
  uint32 max_attempts = 11;
}

message GetSourceSyncResponse {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  saas.jobs.v1.JobState state = 2 [(buf.validate.field).required = true];
  repeated SourceSyncDelivery deliveries = 3;
  SourceSyncProgress progress = 4;
}

message DeleteSourceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteSourceResponse {}

// GitHubAppRepository is one repository a verified App installation grants this
// host read access to.
message GitHubAppRepository {
  // "owner/name".
  string repo = 1;
  // The repository's default branch, so a client can offer it without a second
  // round trip. Empty when GitHub reported none.
  string default_branch = 2;
  // True when this organization already connects this repository, so a client
  // can present it as connected rather than offering it twice.
  bool already_connected = 3;
}

message BeginGitHubAppSetupRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message BeginGitHubAppSetupResponse {
  // Where to send the browser to install the App and choose repositories. It
  // carries the state below, and an installation that returns without it is
  // refused.
  string install_url = 1;
  // One-time setup state, bound server-side to this organization and to the
  // user who began the setup. Redeemable exactly once.
  string state = 2;
  // When the state stops being redeemable.
  google.protobuf.Timestamp expires_at = 3;
}

message CompleteGitHubAppSetupRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // The state handed out by BeginGitHubAppSetup and echoed back through the
  // redirect.
  string state = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // The installation the redirect claims was installed. A claim, never
  // authority: it is a small integer supplied by a browser, so the host both
  // verifies it against GitHub as the App and requires `code` below to
  // attribute it to the caller, and refuses one already bound to a different
  // organization.
  string installation_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[0-9]+$"
  }];
  // The authorization code GitHub appends to the setup redirect when the App
  // requests user authorization during installation. The host trades it for a
  // user-to-server token and requires that user to reach the installation,
  // which is what stops one organization claiming another's installation by
  // naming its id. Required: without it an installation is attributable to
  // nobody.
  string code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message CompleteGitHubAppSetupResponse {
  // The installation the host verified and bound to this organization.
  string installation_id = 1;
  // Repositories that installation grants, each connectable with no token.
  repeated GitHubAppRepository repositories = 2;
}

message MigrateGitHubSourceToAppRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message MigrateGitHubSourceToAppResponse {
  Datasource datasource = 1;
}

// ============================================================================
// Datasource directory — what the host knows about provider principals, so a
// connector that translates a provider's per-item access lists can name host
// users and teams. Every mapping is explicit: a person links their own provider
// account by signing in to the provider (never matched by email), an
// administrator binds a provider group to a host team, and an administrator
// verifies a domain before "anyone in the domain" can mean anything.
// ============================================================================

// DatasourceAccountLink is one person's provider account, proven by signing in
// to the provider as that account.
message DatasourceAccountLink {
  string id = 1;
  string org_id = 2;
  string user_id = 3;
  // The connector the account belongs to, e.g. "github".
  string connector = 4;
  // The provider's stable id for the account.
  string provider_account_id = 5;
  // The account's current handle at the provider, for people; not identity.
  string provider_account_login = 6;
  google.protobuf.Timestamp created_at = 7;
}

// DatasourceGroupBinding maps one provider group onto one host team, by an
// administrator's decision. An unbound provider group grants nothing.
message DatasourceGroupBinding {
  string id = 1;
  string org_id = 2;
  string connector = 3;
  // The provider's id for the group, e.g. "acme/platform" for a GitHub team.
  string provider_group_id = 4;
  string team_id = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

// DatasourceDomainStatus is where a domain's verification stands.
enum DatasourceDomainStatus {
  DATASOURCE_DOMAIN_STATUS_UNSPECIFIED = 0;
  // Claimed; the TXT record has not been found yet.
  DATASOURCE_DOMAIN_STATUS_PENDING = 1;
  // The TXT record was found: the domain is the tenant's.
  DATASOURCE_DOMAIN_STATUS_VERIFIED = 2;
}

// DatasourceVerifiedDomain is a domain an administrator claimed for the tenant.
// Only a verified one lets a provider's "anyone in the domain" grant the
// boundary's readers; a pending one grants nothing.
message DatasourceVerifiedDomain {
  string id = 1;
  string org_id = 2;
  // Lower-case domain name, e.g. "example.com".
  string domain = 3;
  DatasourceDomainStatus status = 4;
  // The DNS TXT record that proves control: its name and the value it must
  // carry. Not a secret: it proves only that whoever controls the domain's DNS
  // published it.
  string txt_record_name = 5;
  string txt_record_value = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

// DatasourceDirectoryTeam is a host team an administrator may bind a group to.
message DatasourceDirectoryTeam {
  string id = 1;
  string name = 2;
}

message BeginDatasourceAccountLinkRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string connector = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 32
    pattern: "^[a-z][a-z0-9-]{1,31}$"
  }];
  // Where the provider sends the browser back. The provider checks it against
  // the callback URLs registered for the host's app; empty uses its default.
  string redirect_uri = 3 [(buf.validate.field).string.max_len = 2048];
  // Required for generic OAuth: the personal source created by this caller.
  string source_id = 4;
}

message BeginDatasourceAccountLinkResponse {
  // Where to send the browser to sign in to the provider.
  string authorize_url = 1;
  // One-time state, bound to this organization, this person and this
  // connector. The provider echoes it back with the authorization code.
  string state = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompleteDatasourceAccountLinkRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string state = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
  string code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message CompleteDatasourceAccountLinkResponse {
  DatasourceAccountLink link = 1;
}

message ListMyDatasourceAccountLinksRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListMyDatasourceAccountLinksResponse {
  repeated DatasourceAccountLink links = 1;
}

message DeleteDatasourceAccountLinkRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteDatasourceAccountLinkResponse {}

message GetDatasourceDirectoryRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetDatasourceDirectoryResponse {
  repeated DatasourceAccountLink links = 1;
  repeated DatasourceGroupBinding bindings = 2;
  repeated DatasourceVerifiedDomain domains = 3;
  // The organization's teams, the targets a group may be bound to.
  repeated DatasourceDirectoryTeam teams = 4;
}

message BindDatasourceGroupRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string connector = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 32
    pattern: "^[a-z][a-z0-9-]{1,31}$"
  }];
  string provider_group_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string team_id = 4 [(buf.validate.field).string.uuid = true];
}

message BindDatasourceGroupResponse {
  DatasourceGroupBinding binding = 1;
}

message UnbindDatasourceGroupRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message UnbindDatasourceGroupResponse {}

message ClaimDatasourceDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string domain = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 253
  }];
}

message ClaimDatasourceDomainResponse {
  DatasourceVerifiedDomain domain = 1;
}

message VerifyDatasourceDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message VerifyDatasourceDomainResponse {
  DatasourceVerifiedDomain domain = 1;
}

message DeleteDatasourceDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteDatasourceDomainResponse {}

// SourceDelegationRevocation says why a source delegation stopped delegating.
enum SourceDelegationRevocation {
  SOURCE_DELEGATION_REVOCATION_UNSPECIFIED = 0;
  // An org administrator revoked it (RevokeSourceDelegation).
  SOURCE_DELEGATION_REVOCATION_REVOKED = 1;
  // The source was reconnected; a delegation under the reconnecting person
  // replaced this one.
  SOURCE_DELEGATION_REVOCATION_REPLACED = 2;
  // The source was deleted.
  SOURCE_DELEGATION_REVOCATION_SOURCE_DELETED = 3;
  // The person who connected it is no longer a member of the organization.
  SOURCE_DELEGATION_REVOCATION_MEMBER_REMOVED = 4;
  // The person is a member but no longer an owner or admin, the role
  // connecting a source requires.
  SOURCE_DELEGATION_REVOCATION_PERMISSION_LOST = 5;
  // The person's account is deleted or suspended.
  SOURCE_DELEGATION_REVOCATION_USER_INACTIVE = 6;
  // The module no longer declares the binding, or its audience or delegation
  // scopes changed since the person connected.
  SOURCE_DELEGATION_REVOCATION_BINDING_CHANGED = 7;
}

// SourceDelegation records that a person, by connecting a source, delegated
// its sync to one installed operation binding of a consuming module. Which
// module and binding is declared configuration, never chosen by a caller.
message SourceDelegation {
  string id = 1;
  string source_id = 2;
  // principal_id is the person who connected (or last reconnected) the source.
  string principal_id = 3;
  // module is the consuming module's registration prefix.
  string module = 4;
  // binding is the key of the module's operation_audiences entry the
  // delegation confers the source_delegation_scopes of.
  string binding = 5;
  google.protobuf.Timestamp created_at = 6;
  // revoked_at is unset while the delegation is active.
  google.protobuf.Timestamp revoked_at = 7;
  SourceDelegationRevocation revocation = 8;
  // revoked_by is the person whose action revoked it; empty when the host
  // revoked it on finding it no longer supported.
  string revoked_by = 9;
}

message ListSourceDelegationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // source_id narrows the listing to one source.
  optional string source_id = 2 [(buf.validate.field).string.uuid = true];
  // include_revoked lists revoked delegations too, with why they ended.
  bool include_revoked = 3;
}

message ListSourceDelegationsResponse {
  // Newest first.
  repeated SourceDelegation delegations = 1;
}

message RevokeSourceDelegationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message RevokeSourceDelegationResponse {
  SourceDelegation delegation = 1;
}

// DatasourceService is the tenant-facing surface a solution drives (directly or
// through the generated SDK) to declare and operate connected datasources.
// SourceOperation is an admitted route and bounded JSON contract, never a credential.
message SourceOperation {
 string name = 1;
 string description = 2;
 string method = 3;
 string path = 4;
 repeated string query = 5;
 google.protobuf.Struct input_schema = 6;
 google.protobuf.Struct output_schema = 7;
 enum Effect { EFFECT_UNSPECIFIED = 0; EFFECT_READ_ONLY = 1; EFFECT_MUTATION = 2; }
 Effect effect = 8;
 uint32 max_output_bytes = 9;
 string digest = 10;
}
message DeclareSourceOperationsRequest {
 string org_id = 1 [(buf.validate.field).string.uuid = true];
 string source_id = 2 [(buf.validate.field).string.uuid = true];
 repeated SourceOperation operations = 3;
}
message DeclareSourceOperationsResponse { repeated SourceOperation operations = 1; }
message ListSourceOperationsRequest {
 string org_id = 1 [(buf.validate.field).string.uuid = true];
 string source_id = 2 [(buf.validate.field).string.uuid = true];
}
message ListSourceOperationsResponse { repeated SourceOperation operations = 1; }

// InvokeSourceOperationRequest carries exactly one JSON object in input_json.
// effect_id must match x-codefly-effect-id; either location may supply it.
message InvokeSourceOperationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string source_id = 2 [(buf.validate.field).string.uuid = true];
  string operation = 3 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_]{0,63}$"];
  string input_json = 4 [(buf.validate.field).string.max_bytes = 65536];
  string effect_id = 5 [(buf.validate.field).string.max_bytes = 128];
}
// SourceOperationReceipt contains only the committed result and safe metadata.
message SourceOperationReceipt {
  string effect_id = 1;
  string committed_at = 2; // UTC RFC3339Nano, empty for an unknown outcome.
  string status = 3; // committed or unknown; unknown never authorizes redispatch.
  uint32 provider_status = 4;
  string output_json = 5; // Exactly one JSON object; {} when unknown.
}
message InvokeSourceOperationResponse {
  string output_json = 1; // Exactly one JSON object; {} when unknown.
  SourceOperationReceipt receipt = 2;
}
// Lookup uses the caller's verified tenant and the effect's stored binding.
// A single string effect selector is the Runnable runtime's recovery contract.
message LookupInvokeSourceOperationRequest {
  string effect_id = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 128}];
}

service DatasourceService {
  // InvokeSourceOperation calls an admitted operation under current authority.
  rpc InvokeSourceOperation(InvokeSourceOperationRequest) returns (InvokeSourceOperationResponse) {
    option (google.api.http) = {post: "/v1/organizations/{org_id}/datasources/{source_id}/operations/{operation}:invoke" body: "*"};
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "datasource:invoke"
      scopes: "datasource:invoke"
      resource_bindings: {request_field: "source_id" target: RESOURCE_TARGET_OWNED_RESOURCE lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION}
      mfa: MFA_REQUIREMENT_NONE
      audit: {events: "saas.datasource.operation.invoked" emission: AUDIT_EMISSION_SUCCESS_AND_FAILURE}
      idempotency: IDEMPOTENCY_REQUIREMENT_REQUIRED
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (codefly.runnable.v0.operation) = {
      attempt_timeout: {seconds: 60}
      total_timeout: {seconds: 600}
      max_attempts: 5
      backoff: {seconds: 2}
      retryable_codes: ["UNAVAILABLE", "RESOURCE_EXHAUSTED", "ABORTED"]
      audience: "saas-datasource"
      required_scope_slots: {name: "source" required_actions: ["invoke", "read"] lookup: true}
      lookup_method: "/saas.accounts.v1.DatasourceService/LookupInvokeSourceOperation"
      max_input_bytes: 65536
      max_output_bytes: 1048576
      completion: COMPLETION_CALL
    };
  }
  // LookupInvokeSourceOperation recovers a receipt without contacting the provider.
  rpc LookupInvokeSourceOperation(LookupInvokeSourceOperationRequest) returns (InvokeSourceOperationResponse) {
    option (google.api.http) = {get: "/v1/datasource-operation-receipts/{effect_id}"};
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      permissions: "datasource:read"
      scopes: "datasource:read"
      resource_bindings: {request_field: "effect_id" target: RESOURCE_TARGET_OWNED_RESOURCE lookup: RESOURCE_LOOKUP_RESOURCE_TO_ORGANIZATION}
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_SECRET
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }

 // ListSourceOperations reads the currently admitted declarations under source authority.
 rpc ListSourceOperations(ListSourceOperationsRequest) returns (ListSourceOperationsResponse) {
 option (google.api.http) = {get: "/v1/organizations/{org_id}/datasources/{source_id}/operations"};
 option (saas.policy.v1.method_policy) = {
 exposure: EXPOSURE_AUTHENTICATED
 tenant: TENANT_REQUIREMENT_ORG_MEMBER
 resource_bindings: { request_field: "org_id" target: RESOURCE_TARGET_ORGANIZATION lookup: RESOURCE_LOOKUP_DIRECT_ID }
 mfa: MFA_REQUIREMENT_NONE
 audit: { emission: AUDIT_EMISSION_NONE }
 idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
 rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
 request_sensitivity: SENSITIVITY_CONFIDENTIAL
 response_sensitivity: SENSITIVITY_CONFIDENTIAL
 platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
 };
 }

 // DeclareSourceOperations atomically replaces the source operation set, as an administrator.
 rpc DeclareSourceOperations(DeclareSourceOperationsRequest) returns (DeclareSourceOperationsResponse) {
 option (google.api.http) = {post: "/v1/organizations/{org_id}/datasources/{source_id}/operations" body: "*"};
 option (saas.policy.v1.method_policy) = {
 exposure: EXPOSURE_AUTHENTICATED
 tenant: TENANT_REQUIREMENT_ORG_ADMIN
 resource_bindings: { request_field: "org_id" target: RESOURCE_TARGET_ORGANIZATION lookup: RESOURCE_LOOKUP_DIRECT_ID }
 mfa: MFA_REQUIREMENT_NONE
 audit: { events: "saas.datasource.operation.declared" emission: AUDIT_EMISSION_SUCCESS }
 idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
 rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
 request_sensitivity: SENSITIVITY_CONFIDENTIAL
 response_sensitivity: SENSITIVITY_CONFIDENTIAL
 platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
 };
 }

  // AddGitHubSource registers a GitHub repository as a datasource, encrypts and
  // stores its access token (and optional webhook signing secret), and returns
  // the non-secret projection.
  rpc AddGitHubSource(AddGitHubSourceRequest) returns (AddGitHubSourceResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.datasource.source.added"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // AddSource registers a datasource for any provider: it selects the connector
  // by provider, stores the config and the encrypted credential (and optional
  // webhook signing secret), and returns the non-secret projection.
  rpc AddSource(AddSourceRequest) returns (AddSourceResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.datasource.source.added"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_SECRET
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // GetDatasourceCatalog returns the host's connector registry: every provider,
  // its connect metadata, whether it conforms to the datasource connector
  // envelope, and whether it accepts a new source, so a client can render the
  // "connect a source" surface without provider-specific code. The catalog is
  // static, non-secret, and identical for every tenant.
  rpc GetDatasourceCatalog(GetDatasourceCatalogRequest) returns (GetDatasourceCatalogResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
