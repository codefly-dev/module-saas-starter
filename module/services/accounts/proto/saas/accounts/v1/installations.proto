syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "host/installation/v1/installation.proto";
import "google/protobuf/timestamp.proto";
import "saas/accounts/v1/authorization.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Installation identity (issue #474)
//
// An installation is the composition that lets a solution act as itself with
// signed, attributable, revocable authority — the "application permission" half
// of the model beside delegated ("on behalf of a user") flows. It binds a per-org
// agent Principal (the actor), a solution scope node (the authority root), the
// agent's standing scope grant at that node, and an owner of record: a
// reassignable, accountable human org admin. The headless mint that turns an
// installation into a short-lived Work Context lives on WorkContextService
// (StartInstallationTask) beside the other mints.
// ============================================================================

// InstallationStatus is the lifecycle of an installation row. An uninstall is a
// soft delete (status=revoked, revoked_at set) so the agent, grants, and audit
// trail remain resolvable.
enum InstallationStatus {
  INSTALLATION_STATUS_UNSPECIFIED = 0;
  INSTALLATION_STATUS_ACTIVE = 1;
  INSTALLATION_STATUS_REVOKED = 2;
  // Installed, and waiting for the solution to acknowledge its standard install
  // step. Nothing can use a pending installation.
  INSTALLATION_STATUS_PENDING = 3;
  // The solution refused its install step, or never answered within the
  // attempt budget. Nothing can use it; an administrator may retry it.
  INSTALLATION_STATUS_FAILED = 4;
}

// InstallationHealth is resolved live from current authority facts, never
// stored. It is the observable form of the fail-closed mint rule: a
// StartInstallationTask fails exactly when health is not HEALTHY, and transfer
// or re-enable restores it. NO_ELIGIBLE_OWNER means neither the owner of record
// nor any co-owner is currently an org admin (the Zapier-class "connection owner
// left the org" failure), surfaced rather than silently reassigned.
enum InstallationHealth {
  INSTALLATION_HEALTH_UNSPECIFIED = 0;
  INSTALLATION_HEALTH_HEALTHY = 1;
  INSTALLATION_HEALTH_NO_ELIGIBLE_OWNER = 2;
  INSTALLATION_HEALTH_AGENT_REVOKED = 3;
  INSTALLATION_HEALTH_AGENT_DISABLED = 4;
  INSTALLATION_HEALTH_STANDING_GRANT_MISSING = 5;
}

// Installation is one solution's bound identity in an org. Server-assigned ids;
// the browser cannot attest to tenancy, the agent principal, or the scope node.
message Installation {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string org_id = 2 [(buf.validate.field).string.uuid = true];
  string agent_principal_id = 3 [(buf.validate.field).string.uuid = true];
  // Was `solution_identifier`: the free-text route alias. It was the join key
  // every reader used, and because an alias is deliberately reusable by a later
  // binding, an installation that named one inherited whatever took it next.
  // Replaced by target_id below. Reserved rather than reused so no consumer can
  // read an alias out of a field that now carries an identity.
  reserved 4;
  reserved "solution_identifier";
  string owner_principal_id = 5 [(buf.validate.field).string.uuid = true];
  repeated string co_owner_principal_ids = 6;
  string root_scope_node_id = 7 [(buf.validate.field).string.uuid = true];
  InstallationStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp revoked_at = 10;
  // The immutable solution target this installation was consented to: one
  // continuous period of one binding's presence on this host. It is never
  // reused, so a replacement binding — even one claiming the same route alias —
  // is a different target and inherits nothing.
  //
  // Deliberately NOT accompanied by the route alias. The alias is a property of
  // the target that a later generation may move, and resolving it here would
  // mean joining the host's presence state into a request-path listing — which
  // would require granting request traffic read over every organisation's
  // presence to answer about one. A consumer that needs the alias asks
  // ListAvailableSolutions, which serves accepted applied state, and joins on
  // this id.
  //
  // Empty only on a revoked historical row whose target could not be
  // established at the cutover; an active installation always names one.
  string target_id = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Why a revoked installation was revoked, when it was not an administrator
  // uninstalling: the installation-identity cutover, or a tenancy narrowing that
  // withdrew this organisation. Empty on an active row.
  string revoked_reason = 12 [(buf.validate.field).string.max_len = 512];
  // Why the install step failed: the solution's bounded refusal reason, or a
  // fixed reason when it never answered. Empty unless status is FAILED.
  string failure_reason = 13 [(buf.validate.field).string.max_len = 512];
  // Current consent/lifecycle revision, for an explicit re-install approval.
  uint64 revision = 14;
  // Read-only outcome of the exact durable setup attempt. This is not the
  // canonical installation status: an acknowledged setup stays pending until
  // a current administrator resumes the original consent and activation passes.
  string setup_state = 15;
  // Public recovery guidance; transport diagnostics and credentials are omitted.
  string setup_message = 16;
}

message InstallSolutionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // Canonical "publisher/name:version" of the solution's agent. The agent
  // Principal is created idempotently per version.
  string agent_identifier = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  // Was `solution_identifier`: the route alias the installer typed. An alias is
  // reusable, so installing by alias is installing whatever holds it at the
  // moment the write lands — and whatever takes it later. Replaced by target_id.
  reserved 3;
  reserved "solution_identifier";
  // Human display name for the agent principal. Empty defaults to the identifier.
  string display_name = 4 [(buf.validate.field).string.max_len = 512];
  // The authority-root scope path is derived server-side from the created node id
  // (a depth-1 ltree label, ADR-0002), never chosen by the caller: a caller-picked
  // path let two installs collide or nest one under another.
  reserved 5;
  reserved "root_scope_path";
  // Human-readable display label for the solution's authority-root scope node
  // (kind='solution'). The node's ltree path is derived server-side, not this.
  string root_scope_label = 6 [(buf.validate.field).string.max_len = 512];
  // The least-privilege role granted to the agent at the root node. This is
  // deliberately NOT the full "<namespace>:catalog" role; widening is a separate,
  // audited admin action.
  string role_id = 7 [(buf.validate.field).string.uuid = true];
  // The accountable human of record. Must be a current org admin. Empty defaults
  // to the calling admin.
  string owner_principal_id = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Succession set: any one being a current org admin keeps the installation
  // healthy. Each must be a human principal.
  repeated string co_owner_principal_ids = 9 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.items.string.uuid = true
  ];
  // The agent's delegated-execution ceiling (migration 108): the Work Context
  // audiences it may be minted for and the resource kinds it may ever touch.
  //
  // Empty = unrestricted FOR THIS INSTALLATION'S OWN WORK, which is what an
  // administrator consented to when they installed it.
  //
  // A mint made with a credential delivered to a THIRD PARTY on a person's
  // behalf — an MCP client the person authorized for this one solution — is not
  // bounded by these lists. Its ceiling is the invoke bindings of the
  // consumer's delivered authority, as this installation's scope consented to
  // them when it was installed; a consumer with no delivered authority has no
  // ceiling, and such a mint is refused. These lists can only narrow that
  // ceiling: an empty list adds no bound, and a list naming more admits
  // nothing extra.
  repeated string allowed_audiences = 10 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 512
  ];
  repeated string allowed_scopes = 11 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 128
  ];
  // The solution target being installed, from ListAvailableSolutions. Required.
  //
  // An installer chooses an identity, never an address. The target must be LIVE
  // and ACCEPTED when the install lands: installing a withdrawn target would
  // record consent to a presence that already ended, and installing a target
  // whose newest generation was refused would record consent to a release this
  // host never admitted.
  string target_id = 12 [(buf.validate.field).string.uuid = true];
  // Installed consent as JSON: capabilities, queues, namespaces,
  // external_namespaces, resources, read_audiences, operation_audiences and
  // artifact_policies, with the same shapes as the module envelope grant.
  // Must be a subset of the current ceiling. Omitted selects that ceiling;
  // an explicit {} grants nothing. Tenant and identity are never scope fields.
  optional string scope = 13 [(buf.validate.field).string = {min_len: 2 max_bytes: 1048576}];
  // Required: the exact offer and installation state reviewed by the admin.
  host.installation.v1.ConsentApproval approval = 14;

}

// An org administrator may only remove installed authority. The host reads
// the current revision and serializes the narrowing with other lifecycle acts.
message NarrowInstallationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  // Same JSON shape as InstallSolution.scope; {} removes all capability access.
  string scope = 3 [(buf.validate.field).string = {min_len: 2 max_bytes: 1048576}];
}

message RetryInstallationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
}

message UninstallSolutionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
}

message TransferInstallationOwnershipRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  // The new owner of record. Must be a current org admin.
  string new_owner_principal_id = 3 [(buf.validate.field).string.uuid = true];
  // Replaces the co-owner succession set wholesale.
  repeated string co_owner_principal_ids = 4 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.items.string.uuid = true
  ];
}

message GetInstallationRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetInstallationResponse {
  Installation installation = 1;
  // Resolved live at read time from current authority facts.
  InstallationHealth health = 2;
}

// ListInstallationsRequest asks what one organization has installed. Every other
// RPC on this service names a single installation, so until this existed nothing
// could answer "what has this org installed?" — which is the authority read a
// per-organization solution projection is built on (issue #949).
message ListInstallationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // Restrict to one lifecycle status. UNSPECIFIED returns every status, so a
  // caller that must see only live installs asks for ACTIVE explicitly rather
  // than leaning on a default that would silently widen if the enum grew.
  InstallationStatus status = 2;
  // Page bound. 0 -> server default; capped so an organization with many
  // installations can never return an unbounded result in one call.
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  // Opaque cursor from a previous response's next_page_token; empty for page one.
  string page_token = 4;
}

// InstallationSummary is one row of the listing: the installation, plus the health
// resolved live beside it exactly as GetInstallation resolves it for one. Health
// travels with the row because a consumer that renders an installed solution as
// unavailable would otherwise need one GetInstallation per installation.
message InstallationSummary {
  Installation installation = 1;
  InstallationHealth health = 2;
}

message ListInstallationsResponse {
  repeated InstallationSummary installations = 1;
  // Set when more installations remain; pass it back as page_token. Empty on the
  // last page.
  string next_page_token = 2;
}

// InstallationService composes and administers installations. The headless mint
// that turns an installation into a short-lived Work Context is
// WorkContextService.StartInstallationTask.
// A host review binds the shared solution approval to its live delivery and
// explicit supporting-module consents. Return this unchanged when installing.
message ReviewedSolutionInstall {
  string org_id = 1;
  string actor_id = 2;
  string target_id = 3;
  string target = 4;
  string binding_id = 5;
  string release = 6;
  string delivery_digest = 7;
  host.installation.v1.ConsentApproval approval = 8;
  string installation_role = 9;
  repeated ReviewedSupportingModule modules = 10;
}

message ReviewedSupportingModule {
  string principal = 1;
  string target_id = 2;
  string target = 3;
  string binding_id = 4;
  string release = 5;
  string delivery_digest = 6;
  string installation_role = 7;
  // Nonempty means reuse this sufficient installation without rewriting consent.
  string reuse_installation_id = 8;
  // The existing module owner's exact consent scope; never a machine role grant.
  string scope = 9;
  host.installation.v1.ConsentApproval approval = 10;
  bool required = 11;
}

message ReviewSolutionInstallRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string target_id = 2 [(buf.validate.field).string.uuid = true];
}
message InstallReviewedSolutionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  ReviewedSolutionInstall review = 2 [(buf.validate.field).required = true];
}

service InstallationService {
  // Review one solution release and its supporting module access before consent.
  rpc ReviewSolutionInstall(ReviewSolutionInstallRequest) returns (ReviewedSolutionInstall) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {request_field: "org_id" target: RESOURCE_TARGET_ORGANIZATION lookup: RESOURCE_LOOKUP_DIRECT_ID}
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {post: "/v1/solution-installations/review" body: "*"};
  }
  // Consent to the exact review; retries retain its original per-owner receipts.
  rpc InstallReviewedSolution(InstallReviewedSolutionRequest) returns (Installation) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {request_field: "org_id" target: RESOURCE_TARGET_ORGANIZATION lookup: RESOURCE_LOOKUP_DIRECT_ID}
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {post: "/v1/solution-installations" body: "*"};
  }
  // InstallSolution composes an installation in one transaction: an idempotent
  // agent Principal with its ceiling, a solution scope node, the agent's standing
  // least-privilege grant at that node, and the installation row with its owner of
  // record. Emits installation.created with the grantor and ceiling.
  rpc InstallSolution(InstallSolutionRequest) returns (Installation) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.installation.created"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/installations"
      body: "*"
    };
  }

  // UninstallSolution reverses an install: it revokes the agent principal, removes
  // its standing grant, and marks the installation revoked. The solution scope node
  // is left in place (inert without a grant or a live agent) so a reinstall reuses
  // it. Idempotent on an already-revoked installation.
  rpc UninstallSolution(UninstallSolutionRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.installation.revoked"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}:uninstall"
      body: "*"
    };
  }

  // A narrowing applies directly: it atomically bumps the installation
  // revision, cancels its org's work and records audit.
  rpc NarrowInstallation(NarrowInstallationRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.installation.narrowed"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}:narrow"
      body: "*"
    };
  }

  // RetryInstallation runs a failed installation's install step again, at the
  // same revision. The installation is pending until the solution acknowledges.
  rpc RetryInstallation(RetryInstallationRequest) returns (Installation) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.installation.retried"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}:retry"
      body: "*"
    };
  }

  // TransferInstallationOwnership reassigns the owner of record and replaces the
  // co-owner succession set. This is how a "connection owner left the org"
  // failure is repaired: an admin transfers the installation to a current admin,
  // restoring its health.
  rpc TransferInstallationOwnership(TransferInstallationOwnershipRequest) returns (Installation) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.installation.ownership_transferred"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}:transferOwnership"
      body: "*"
    };
  }

  // GetInstallation returns one installation plus its live health, so an admin UI
  // can see when an installation has gone unhealthy (owner offboarded, agent
  // disabled, grant expired) before the next headless task fails closed.
  rpc GetInstallation(GetInstallationRequest) returns (GetInstallationResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_MEMBER
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/installations/{installation_id}"};
  }

  // ListInstallations enumerates one organization's installations with their live
  // health. It is internal-tier on purpose: it takes the organization as a request
  // field, so only a caller holding the cluster-internal credential may ask, and
  // the tenant it asks about is the one the auth-gateway projected from a verified
  // identity — never one a browser supplied. It sits beside
  // PermissionService.ListAccessibleScopes for that reason: the two are read
  // together to answer what a viewer's organization installed and what that viewer
  // was granted.
  rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }

  // ListAvailableSolutions is the catalogue: the solution targets an
  // administrator may install right now.
  //
  // It answers from ACCEPTED applied state — a live target whose binding's
  // newest APPLIED generation is a present one — and deliberately not from the
  // diagnostic ListSolutionHostBindings, which also reports desired generations
  // that were refused. The distinction is the point: a refused generation is
  // something an operator must see and something an administrator must not be
  // able to consent to, because consenting to a release this host never admitted
  // records authority over a presence that does not exist.
  //
  // It carries the route alias, which the installation record deliberately does
  // not: here the alias is a display and routing fact read from the target in
  // the same statement, not an identity anything joins on.
  rpc ListAvailableSolutions(ListAvailableSolutionsRequest) returns (ListAvailableSolutionsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    // Mounted under `/v1/installations`, a prefix the catalog already owns.
    // A `/v1/solutions` route would have taken that prefix away from every
    // composed module that may register one, which is a contract change with
    // every downstream composer and not a side effect of adding a read.
    option (google.api.http) = {get: "/v1/installations:listAvailable"};
  }

  // ListOrganizationInstallations is an organisation administrator's view of
  // what that organisation has installed: each active installation with its live
  // health, the catalogue row of the target it installed, the scope path of its
  // authority root, and the teams a grant reaches there.
  //
  // It is the org-admin companion to the internal ListInstallations, and it is a
  // separate method rather than a relaxed policy on that one: ListInstallations
  // is read by the gateway for an organisation it projected from a verified
  // identity, and a bare tenant credential must never reach it. This one binds
  // the organisation to the caller's own admin membership, exactly as
  // ListAvailableSolutions does, so no organisation's administrator can read
  // another's. The one exception is inherited, not added here: a platform
  // super administrator (not impersonating) passes the organisation-admin check
  // for every organisation, as on every other organisation-admin method, and so
  // may list any organisation's installations.
  rpc ListOrganizationInstallations(ListOrganizationInstallationsRequest) returns (ListOrganizationInstallationsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_READ
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
    option (google.api.http) = {get: "/v1/installations"};
  }

  // GrantInstallationToTeam exposes an installation to a team: a scope grant of
  // the given role to the team at the installation's authority-root node. The
  // host resolves that node from the installation, so a caller never names a
  // scope path. The role must permit using a solution, or the grant would expose
  // nothing; the team must belong to the organisation. Using a solution is the
  // minimum the role must permit, not a ceiling: the team holds everything the
  // role permits beneath the installation's authority root, exactly as a
  // GrantScope of that role at that node would give it. Emits scope.granted, the
  // same event and audit record as any other scope grant, because it is one.
  // Organisation-admin, with the same platform super administrator exception
  // ListOrganizationInstallations describes.
  rpc GrantInstallationToTeam(GrantInstallationToTeamRequest) returns (GrantInstallationToTeamResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.scope.granted"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
      impersonation: IMPERSONATION_REQUIREMENT_FORBIDDEN
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}/teams"
      body: "*"
    };
  }

  // RevokeInstallationFromTeam removes one team grant at an installation's
  // authority-root node. It is a narrowing, so it applies directly, with its
  // audit record in one transaction, exactly as RevokeScope does. It removes the one grant
  // at the authority root that granted_teams reports; a team that also reaches
  // the installation from a grant above keeps that reach. Organisation-admin,
  // with the same platform super administrator exception.
  rpc RevokeInstallationFromTeam(RevokeInstallationFromTeamRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_AUTHENTICATED
      tenant: TENANT_REQUIREMENT_ORG_ADMIN
      resource_bindings: {
        request_field: "org_id"
        target: RESOURCE_TARGET_ORGANIZATION
        lookup: RESOURCE_LOOKUP_DIRECT_ID
      }
      mfa: MFA_REQUIREMENT_NONE
      audit: {
        events: "saas.scope.revoked"
        emission: AUDIT_EMISSION_SUCCESS
      }
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_STANDARD_WRITE
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
      impersonation: IMPERSONATION_REQUIREMENT_FORBIDDEN
    };
    option (google.api.http) = {
      post: "/v1/installations/{installation_id}/teams/{team_id}:revoke"
      body: "*"
    };
  }
}

message ListOrganizationInstallationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // Page bound. 0 -> server default; capped as ListInstallations is.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  // Opaque cursor from a previous response's next_page_token; empty for page one.
  string page_token = 3;
}

// OrganizationInstallation is one active installation as its organisation's
// administrator manages it.
message OrganizationInstallation {
  Installation installation = 1;
  // Resolved live, exactly as ListInstallations resolves it.
  InstallationHealth health = 2;
  // The catalogue row of the installed target, from the same accepted applied
  // state ListAvailableSolutions serves: its route alias, applied release and
  // generations. Absent when this host no longer offers the target — the
  // installation outlives the presence it was consented to, and an absent row
  // says so rather than naming a release the host does not apply.
  AvailableSolution target = 3;
  // The scope path of the installation's authority-root node: where a grant
  // that exposes it is written. Read from the node, never derived from its id.
  string root_scope_path = 4;
  // Teams an active grant reaches at this installation, in the two kinds the
  // platform Catalogue keeps apart: granted at its authority root, and inherited
  // from a grant above it. Only the first is exposure granted to this
  // installation; RevokeInstallationFromTeam removes those.
  repeated CollectionReadGrant granted_teams = 5;
  repeated CollectionReadGrant inherited_teams = 6;
  // Whether this installation will actually work, and what is unmet if it will
  // not. Resolved live from the same facts health is resolved from plus the
  // module registry and this organisation's sources; never stored.
  InstallationReadiness readiness = 7;
  // The modules this installed target declares it reaches, and this
  // organisation's installation of each. Empty for a target whose applied
  // manifest declares no operation binding it redeems on a person's behalf.
  repeated ReachedModule reached_modules = 8;
}

// ReadinessConditionKind is what kind of thing is unmet. A reader acts on the
// words in `detail`; the kind is for the surface to choose an action and for a
// consumer to count one kind without parsing prose.
enum ReadinessConditionKind {
  READINESS_CONDITION_KIND_UNSPECIFIED = 0;
  // The solution has not acknowledged its standard install step yet.
  READINESS_CONDITION_KIND_INSTALL_STEP_PENDING = 1;
  // It refused the install step, or never answered within the attempt budget.
  READINESS_CONDITION_KIND_INSTALL_STEP_FAILED = 2;
  // The installation record itself is not healthy: the InstallationHealth
  // value, restated as a condition so one list holds every reason it will not
  // work rather than two places a reader has to join.
  READINESS_CONDITION_KIND_RECORD_UNHEALTHY = 3;
  // The module registry holds no principal for this target's module at all, so
  // every Work Context it asks for is denied.
  READINESS_CONDITION_KIND_MODULE_PRINCIPAL_OMITTED = 4;
  // An operation binding the applied manifest asks for derived nothing: the
  // envelope allows no such binding, or allows nothing of it. This is the
  // condition that reported HEALTHY on a validation cell while four bindings were
  // dropped.
  READINESS_CONDITION_KIND_OPERATION_BINDING_OMITTED = 5;
  // A source this organisation has connected holds no active delegation to a
  // module that accepts them, so that module cannot read it on anyone's behalf.
  READINESS_CONDITION_KIND_SOURCE_NOT_DELEGATED = 6;
  // A module this target declares it reaches is not installed in this
  // organisation, so every call it makes there is refused.
  READINESS_CONDITION_KIND_REACHED_MODULE_NOT_INSTALLED = 7;
  // A grant of this solution could not CARRY the access it declares it consumes
  // on one reached module, so the team holds nothing there and the pages that
  // reach it will be refused. `detail` says which of the two reasons it is: the
  // chosen role permits none of what the solution consumes there, or the
  // declared scope is narrowed to named resources, which a role cannot express.
  READINESS_CONDITION_KIND_CARRIED_MODULE_ACCESS_NOT_DERIVED = 8;
}

// ReadinessClearedBy is who can clear a condition. It is stated rather than
// implied by the action, because "nobody at this surface can" is itself the
// answer a reader needs — an envelope that withholds a binding is the platform
// operator's, and offering an administrator a button would be a lie.
enum ReadinessClearedBy {
  READINESS_CLEARED_BY_UNSPECIFIED = 0;
  // The person reading the page, acting as themselves: their own delegation.
  READINESS_CLEARED_BY_VIEWER = 1;
  READINESS_CLEARED_BY_ORGANIZATION_ADMIN = 2;
  READINESS_CLEARED_BY_PLATFORM_OPERATOR = 3;
  // Nobody: the host is waiting for the solution itself to answer.
  READINESS_CLEARED_BY_NOBODY = 4;
}

// ReadinessAction is what clears the condition, named as the act rather than as
// a control, so a surface that cannot offer one still reports the same fact.
enum ReadinessAction {
  READINESS_ACTION_UNSPECIFIED = 0;
  // No act at this surface clears it. The condition says where it is cleared.
  READINESS_ACTION_NONE_AT_THIS_SURFACE = 1;
  READINESS_ACTION_RETRY_INSTALL_STEP = 2;
  READINESS_ACTION_RECONNECT_SOURCE = 3;
  READINESS_ACTION_TRANSFER_OWNERSHIP = 4;
  READINESS_ACTION_INSTALL_REACHED_MODULE = 5;
  // Wait: the host is expecting an answer and no act brings it forward.
  READINESS_ACTION_WAIT = 6;
}

// ReadinessCondition is one thing that is unmet, in the words of whoever owns
// it, with who can clear it and what clears it.
message ReadinessCondition {
  ReadinessConditionKind kind = 1;
  // What the condition is about: the binding, the source, the module. Empty when
  // the condition is about the installation as a whole.
  string subject = 2;
  // Why it is unmet, as the part of the host that owns the fact words it. Never
  // a generic "not ready": the reason is the whole value of the condition.
  string detail = 3;
  ReadinessClearedBy cleared_by = 4;
  ReadinessAction action = 5;
  // The source the action addresses, for RECONNECT_SOURCE. Empty otherwise.
  string source_id = 6;
}

// InstallationReadiness is whether the installation will work, which is NOT
// whether its record exists. InstallationHealth answers about the record — it
// is active, its owner is an admin, its standing grant is there — and on
// a validation cell it reported HEALTHY for ten installations while four declared
// operation bindings had derived nothing. Readiness is the other question, and
// it is false while any condition below is unmet.
message InstallationReadiness {
  // True only when `unmet` is empty.
  bool ready = 1;
  repeated ReadinessCondition unmet = 2;
}

// ReachedModule is one module an installed target declares it reaches on the
// asking person's own session, and this organisation's installation of that
// module.
//
// A solution granted to a team was refused by every module it reaches that the
// same team was not granted — four separate refusals on a validation cell, each
// a bare Forbidden. The set is the applied manifest's own declaration, and a
// grant of the solution now CARRIES it: GrantInstallationToTeam derives a grant
// at each reached module from this very set, traceable to the solution's grant
// and revoked with it (CarriedModuleAccess). This field stays a read, so the
// setup page can state the set a grant will carry before anyone grants it. It is
// never a per-module grant step a person performs — that is the trail this ends.
message ReachedModule {
  // The audience the manifest names: the module reached.
  string audience = 1;
  // This organisation's ACTIVE installation of that module, which is where the
  // team grant is written. Empty when it has not installed it — then the
  // readiness condition says so and no grant is offered.
  string installation_id = 2;
  // The route alias of the installed module, for the reader. Empty with
  // installation_id.
  string route_alias = 3;
}

message ListOrganizationInstallationsResponse {
  repeated OrganizationInstallation installations = 1;
  // Set when more installations remain; pass it back as page_token.
  string next_page_token = 2;
}

message GrantInstallationToTeamRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  string team_id = 3 [(buf.validate.field).string.uuid = true];
  // The role the team holds at the installation's authority root. It must permit
  // using a solution (or carry the wildcard); a role that does not would expose
  // nothing, and is refused rather than written. Everything else the role
  // permits is granted too, beneath that root.
  string role_id = 4 [(buf.validate.field).string.uuid = true];
}

// CarriedModuleAccess is one derived grant a solution's grant carried: the
// access the solution declares it consumes on one module it reaches, intersected
// with the role the administrator chose, written at that module's own
// authority-root node.
//
// The role is this host's own, derived and owned by it: it appears in no picker,
// cannot be edited, deleted, assigned organisation-wide or granted by hand, and
// is revoked with the grant that caused it. What it permits is the intersection
// and never the chosen role, which is the whole property — a person's own direct
// reach into a reached module is exactly what the solution declared, not
// whatever the administrator's role would have permitted there.
message CarriedModuleAccess {
  // The module reached, as the applied manifest's binding names its audience.
  string audience = 1;
  // This organisation's installation of that module, whose authority root the
  // derived grant is written at.
  string installation_id = 2;
  // The node the derived grant was written at: that installation's authority
  // root, resolved from the installation and never supplied by a caller.
  string scope_path = 3;
  // The derived role. Read it to learn what was carried; never grant it.
  string role_id = 4;
  // What the derived role permits, each written "<resource kind>:<action>" — the
  // declared consumption intersected with the chosen role, in the words the
  // declaration uses.
  repeated string scopes = 5;
}

message GrantInstallationToTeamResponse {
  ScopeGrant grant = 1;
  // The module access this grant carried, one entry per module the solution
  // declares it reaches and this organisation has installed. A team granted a
  // solution reaches every module the solution reaches on its members' own
  // sessions, by construction: there is no per-module grant step for a person to
  // discover by being refused.
  repeated CarriedModuleAccess carried = 2;
  // Where it carried nothing, and why — in the same response as the grant,
  // because a refusal a person learns about by hitting a Forbidden later is the
  // failure this replaces. Stated in the same condition vocabulary the setup
  // page reads, so one reader works through one list.
  repeated ReadinessCondition unmet = 3;
}

message RevokeInstallationFromTeamRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  string team_id = 3 [(buf.validate.field).string.uuid = true];
  // The role of the grant being removed, as granted_teams reports it. A team may
  // hold more than one role at the same node, and each is its own grant.
  string role_id = 4 [(buf.validate.field).string.uuid = true];
}

// AvailableSolution is one installable solution target: its immutable identity,
// the release the host currently has applied for it, and where it is routed.
message AvailableSolution {
  // The immutable target identity an install names. Never reused.
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  // The binding whose presence this target records. Carried so an operator can
  // correlate a catalogue row with delivery; an installation does not join on it,
  // because one binding may have several targets over time.
  string binding_id = 2;
  // The route alias the applied generation claims — `/solutions/<alias>/*`. A
  // later generation may move it, so it is never an identity.
  string route_alias = 3;
  // The applied release: publisher, name, version.
  string release_publisher = 4;
  string release_name = 5;
  string release_version = 6;
  // The generation that opened this target, and the newest applied generation.
  // Equal until a later generation is applied for the same presence.
  uint64 opened_generation = 7;
  uint64 applied_generation = 8;
  // True when this organization already has an ACTIVE installation of this
  // target. A catalogue shows it as installed rather than offering it twice; the
  // unique index over (org_id, target_id) would refuse the second install anyway,
  // and an administrator should not have to discover that by being refused.
  bool installed = 9;
  // What this target is, as its registration declared it: `module` or
  // `solution`. Read from the registration in the same statement as the rest of
  // the row; a reader is told rather than inferring it from the alias, because a
  // module and a solution are set up differently and the page says which it is.
  // Empty when the registration declared neither.
  string kind = 10 [(buf.validate.field).string.max_len = 32];
}

message ListAvailableSolutionsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // Page bound. 0 -> server default; capped for the same reason the installation
  // listing is capped.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  string page_token = 3;
}

message ListAvailableSolutionsResponse {
  repeated AvailableSolution solutions = 1;
  string next_page_token = 2;
}
