syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Federation registration credential exchange.
//
// These messages live in their own file, with deliberately minimal imports, so
// the auth-gateway can generate the same types from the same source proto and
// call MintModuleRegistration / MintSolutionRegistration / MintModuleWorkContext /
// MintModuleOperationContext / MintSourceOperationContext (all declared on
// ModuleCapabilitiesService) over the internal listener. Sharing the generated
// definition rather than restating the wire shape is what keeps the two sides
// from drifting.
//
// Two registrant kinds, one issuer. A composed module federates a REST prefix;
// a solution additionally registers a gateway upstream and a Module-Federation
// remote that executes in the host origin. Their credentials are declared,
// minted, and audience-scoped separately so holding one never confers the
// other's authority — the solution credential is the strictly larger grant.

// ModuleMintRegistrationRequest asks for the credential a module presents to
// federate its REST prefix with the gateway. secret is the module's own
// registration secret, provisioned by the composition; accounts compares it
// against the digest declared for `prefix`, so the credential for one module
// never yields a token for another.
message ModuleMintRegistrationRequest {
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message ModuleMintRegistrationResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// SolutionMintRegistrationRequest asks for the credential a solution presents to
// register — and later update or delete — its gateway upstream and its frontend
// Module-Federation remote. secret is the solution's own registration secret,
// provisioned by the composition; accounts compares it against the digest
// declared for `solution_id`, so the credential for one solution never yields a
// token for another.
message SolutionMintRegistrationRequest {
  string solution_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message SolutionMintRegistrationResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ModuleMintWorkContextRequest asks for the Work Context a composed module
// presents to the module-facing capability surface. It carries the same
// registration secret the credential exchange above uses: a module proves which
// module it is once, with one credential, and the principal it acts as is
// derived from that prefix rather than configured separately.
//
// The tenant the capability is bound to is not requested. It is the one declared
// for that principal by the deployment, so a module cannot name a tenant by
// asking, and the response reports which one was sealed.
message ModuleMintWorkContextRequest {
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

// ModuleMintWorkContextResponse carries the signed capability plus the identity
// it asserts, so a module can attribute its own work without parsing the token.
message ModuleMintWorkContextResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string principal_id = 3;
  string tenant = 4;
}

// ModuleMintOperationContextRequest asks for a Work Context addressed to one of
// the calling module's installed operation audiences, with no person present —
// the capability background work (a journal replay, a scheduled refresh) uses to
// call another module's service. It authenticates exactly like
// ModuleMintWorkContextRequest, with the module's identity secret for `prefix`.
//
// The caller names only the binding. Audience, scopes, tenant, actor and
// lifetime are deployment policy: the binding's `headless_scopes`, the tenant
// declared for the module principal, and a short fixed lifetime. A binding that
// declares no headless scopes cannot be minted this way at all.
message ModuleMintOperationContextRequest {
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  string binding = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// ModuleMintOperationContextResponse carries the signed capability and what it
// asserts, so a module can attribute and route its call without parsing it.
message ModuleMintOperationContextResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string principal_id = 3;
  string tenant = 4;
  string audience = 5;
  string binding = 6;
}

// ModuleMintSourceOperationContextRequest asks for a Work Context that runs one
// datasource source's sync with the authority a person delegated when they
// connected (or reconnected) the source. It authenticates exactly like
// ModuleMintWorkContextRequest, with the module's identity secret for `prefix`.
//
// The caller names the delegation — by its id, or by the source whose active
// delegation to this module is meant — and nothing else. Tenant, owner,
// audience, scopes and lifetime come from the delegation and the binding it
// names: the source's organization, the person who connected it, and exactly
// that binding's `source_delegation_scopes`.
message ModuleMintSourceOperationContextRequest {
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  oneof delegation {
    option (buf.validate.oneof).required = true;
    // delegation_id names one delegation. A revoked one is refused with
    // PERMISSION_DENIED; one that does not exist, belongs to another module,
    // or is in an organization the module does not serve is refused the same
    // way, indistinguishably.
    string delegation_id = 3 [(buf.validate.field).string.uuid = true];
    // source_id names a source; its active delegation to the calling module is
    // used. A source with none is FAILED_PRECONDITION, reason
    // DELEGATION_MISSING: a person must connect or reconnect it.
    string source_id = 4 [(buf.validate.field).string.uuid = true];
  }
}

// ModuleMintSourceOperationContextResponse carries the signed capability and
// what it asserts, so a module can attribute and route its call without
// parsing it.
message ModuleMintSourceOperationContextResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // principal_id is the calling module's service principal: the actor.
  string principal_id = 3;
  // tenant is the source's organization.
  string tenant = 4;
  string audience = 5;
  string binding = 6;
  string delegation_id = 7;
  string source_id = 8;
  // owner_principal_id is the person who delegated the source: the owner.
  string owner_principal_id = 9;
}
