syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Module-registration credential exchange.
//
// These messages live in their own file, with deliberately minimal imports, so
// the auth-gateway can generate the same types from the same source proto and
// call MintModuleRegistration (declared on ModuleCapabilitiesService) over the
// internal listener. Sharing the generated definition rather than restating the
// wire shape is what keeps the two sides from drifting.

// ModuleMintRegistrationRequest asks for the credential a module presents to
// federate its REST prefix with the gateway. secret is the module's own
// registration secret, provisioned by the composition; accounts compares it
// against the digest declared for `prefix`, so the credential for one module
// never yields a token for another.
message ModuleMintRegistrationRequest {
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string secret = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message ModuleMintRegistrationResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}
