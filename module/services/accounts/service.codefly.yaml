name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    # DEV RENDER ONLY, labelled: a dev prerelease of the go-grpc agent change
    # that advertises named endpoints' ports (codefly-dev/service-go-grpc#140).
    version: 0.1.48-dev.f37710ffe968
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - email
    - federation
    - github-app
    - identity
    - internal-auth
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    # The internal tier a composed module may call, on a listener of its own:
    # only business.ModuleAuthorityProcedures, each behind the internal
    # credential. A module declares a dependency on this endpoint, never on the
    # private rest listener (INTERNAL_TRANSPORT.md).
    - name: authority
      api: grpc
      visibility: module
    - name: connect
      visibility: module
    - name: grpc
    - name: rest
spec:
    connect-endpoint: true
    hot-reload: true
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        endpoint-ports:
            authority: 9091
            connect: 8080
            grpc: 9090
            rest: 8080
        public-egress-ports:
            - 443
