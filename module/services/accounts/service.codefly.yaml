name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    # A released agent, moved by `codefly update workspace`. The floor is 0.1.50:
    # the release that ships the runtime-packages capability this service's spec
    # declares below, and carries #146 (a port rendered for every declared
    # endpoint). It advertises docker-build-recipe v3, v4 and v5, so it needs a
    # codefly whose host support reaches v4 — see scripts/ci/install-codefly.sh.
    # 0.1.53 additionally carries core v0.15.2 and the fix that lets a scaffolded
    # service resolve its own address (service-go-grpc#165).
    version: 0.1.53
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - datasource-keys
    - email
    - federation
    - gateway-trust
    - github-app
    - identity
    - identity-provider
    - internal-auth
    - internal-transport
    - key-service
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    # The internal tier a composed module may call, on a listener of its own:
    # only business.ModuleAuthorityProcedures, each behind the internal
    # credential. A module declares a dependency on this endpoint, never on the
    # private rest listener (INTERNAL_TRANSPORT.md).
    - name: authority
      api: grpc
      visibility: internal
    - name: connect
      visibility: internal
    - name: grpc
    - name: rest
spec:
    connect-endpoint: true
    hot-reload: true
    # The datasource fetch reads a repository over git's smart-HTTP transport by
    # running git (pkg/datasource/github). The runtime stage carries only the CA
    # bundle otherwise, so without this the binary is present, the refusal is
    # correct, and every repository sync fails on a cell while working in dev,
    # where the host's own git is on PATH.
    runtime-packages:
        - git
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        # No endpoint-ports: go-grpc binds every endpoint on the port Codefly
        # allocates for it, so each pod port is its deployed port, which the
        # render takes from Codefly. endpoint-ports is only for a port the
        # process binds at a fixed number the allocation does not give it.
        public-egress-ports:
            - 443
