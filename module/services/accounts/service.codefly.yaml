name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    # A released agent. 0.1.50 is the release that ships the runtime-packages
    # capability this service's spec declares below, and it also carries #146 (a
    # port rendered for every declared endpoint), which the dev prerelease this pin
    # replaced predated. It advertises docker-build-recipe v3, v4 and v5, so it needs
    # a codefly whose host support reaches v4 — see scripts/ci/install-codefly.sh.
    version: 0.1.50
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - email
    - federation
    - gateway-trust
    - github-app
    - identity
    - internal-auth
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    # The internal tier a composed module may call, on a listener of its own:
    # only business.ModuleAuthorityProcedures, each behind the internal
    # credential. A module declares a dependency on this endpoint, never on the
    # private rest listener (INTERNAL_TRANSPORT.md).
    - name: authority
      api: grpc
      visibility: module
    - name: connect
      visibility: module
    - name: grpc
    - name: rest
spec:
    # The PEM the cell's Vault certificate chains to. The cell's workload-CA
    # stage publishes `vault-ca` into the product namespace; accounts defaults
    # VAULT_CA_FILE to this mount path joined with the ConfigMap's `ca.crt`
    # (pkg/vaultconnection.DefaultCAFile), so a cell's coordinate contract does
    # not have to restate a path that belongs to this render.
    #
    # Optional because a local k3d render has no such ConfigMap and the pod must
    # still start — local runs reach the composed `vault` service over loopback
    # and need no CA at all.
    #
    # STAGED: the pinned go-grpc agent drops this field. The mount support is
    # owed on codefly-dev/service-go-grpc#156, and the agent pin here moves when
    # it releases — `goGRPCMountFloor` in vault_binding_test.go names both steps.
    config-mounts:
        - config-map: vault-ca
          mount-path: /etc/vault/ca
          name: vault-ca
          optional: true
    connect-endpoint: true
    hot-reload: true
    # The datasource fetch reads a repository over git's smart-HTTP transport by
    # running git (pkg/datasource/github). The runtime stage carries only the CA
    # bundle otherwise, so without this the binary is present, the refusal is
    # correct, and every repository sync fails on a cell while working in dev,
    # where the host's own git is on PATH.
    runtime-packages:
        - git
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        # No endpoint-ports: go-grpc binds every endpoint on the port Codefly
        # allocates for it, so each pod port is its deployed port, which the
        # render takes from Codefly. endpoint-ports is only for a port the
        # process binds at a fixed number the allocation does not give it.
        public-egress-ports:
            - 443
