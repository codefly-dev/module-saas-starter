name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    # DEV PIN: an unreleased agent prerelease. It already carries the
    # runtime-packages capability this service's spec declares below (added in the
    # agent at f2f2c0c, an ancestor of this build), which is why the pin was moved
    # here. Move it to the release that ships that capability before this module is
    # tagged. Do not move it forward to 0.1.48-dev.42ce38050224 or later yet: those
    # emit docker-build-recipe/v5, and the codefly the CI gate installs reads v3.
    version: 0.1.50
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - email
    - federation
    - gateway-trust
    - github-app
    - identity
    - internal-auth
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    # The internal tier a composed module may call, on a listener of its own:
    # only business.ModuleAuthorityProcedures, each behind the internal
    # credential. A module declares a dependency on this endpoint, never on the
    # private rest listener (INTERNAL_TRANSPORT.md).
    - name: authority
      api: grpc
      visibility: module
    - name: connect
      visibility: module
    - name: grpc
    - name: rest
spec:
    connect-endpoint: true
    hot-reload: true
    # The datasource fetch reads a repository over git's smart-HTTP transport by
    # running git (pkg/datasource/github). The runtime stage carries only the CA
    # bundle otherwise, so without this the binary is present, the refusal is
    # correct, and every repository sync fails on a cell while working in dev,
    # where the host's own git is on PATH.
    runtime-packages:
        - git
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        # No endpoint-ports: go-grpc binds every endpoint on the port Codefly
        # allocates for it, so each pod port is its deployed port, which the
        # render takes from Codefly. endpoint-ports is only for a port the
        # process binds at a fixed number the allocation does not give it.
        public-egress-ports:
            - 443
