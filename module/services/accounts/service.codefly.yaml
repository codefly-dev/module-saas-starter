name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    # DEV PIN: an unreleased agent prerelease (git in the service image, for datasource reads over git). Move it to the
    # release that ships the change before this module is tagged.
    version: 0.1.48-dev.f2f2c0c6ff13
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - email
    - federation
    - github-app
    - identity
    - internal-auth
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    # The internal tier a composed module may call, on a listener of its own:
    # only business.ModuleAuthorityProcedures, each behind the internal
    # credential. A module declares a dependency on this endpoint, never on the
    # private rest listener (INTERNAL_TRANSPORT.md).
    - name: authority
      api: grpc
      visibility: module
    - name: connect
      visibility: module
    - name: grpc
    - name: rest
spec:
    connect-endpoint: true
    hot-reload: true
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        # Pod ports, for the ports this service binds at a fixed number. The
        # authority endpoint declares none: go-grpc binds the port Codefly
        # allocates for a named endpoint, so its pod port is its deployed
        # (Service) port, which the render takes from Codefly and never from here.
        endpoint-ports:
            connect: 8080
            grpc: 9090
            rest: 8080
        public-egress-ports:
            - 443
