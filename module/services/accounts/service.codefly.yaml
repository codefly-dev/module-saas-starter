name: accounts
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.46
    publisher: codefly.dev
service-dependencies:
    - name: cache
      endpoints:
        - name: read
        - name: write
    - name: store
      endpoints:
        - name: tcp
    - name: telemetry
      endpoints:
        - name: grpc
    - name: vault
      endpoints:
        - name: http
workspace-configuration-dependencies:
    - abuse-protection
    - application
    - billing
    - email
    - federation
    - github-app
    - identity
    - internal-auth
    - module-capabilities
    - observability
    - product-analytics
    - security
    - vault
endpoints:
    - name: connect
      visibility: module
    - name: grpc
    - name: rest
spec:
    connect-endpoint: true
    hot-reload: true
    protocol-output-dirs:
        - code/pkg/gen
        - generated/openapi-raw
    rest-endpoint: true
    service-account:
        name: accounts
    deployment:
        endpoint-ports:
            connect: 8080
            grpc: 9090
            rest: 8080
        public-egress-ports:
            - 443
