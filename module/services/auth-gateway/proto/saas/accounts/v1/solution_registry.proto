syntax = "proto3";

package saas.accounts.v1;

import "google/protobuf/timestamp.proto";

// Read-only projection of the host's declared solution presence. The gateway
// shares these messages and reads the accounts internal listener.

// SolutionRegistrationStatus is derived from applied presence, never from an
// expiring registration lease or the existence of a frontend.
enum SolutionRegistrationStatus {
  SOLUTION_REGISTRATION_STATUS_UNSPECIFIED = 0;
  // Presence is applied. Both modules and solutions may be headless.
  SOLUTION_REGISTRATION_STATUS_ACTIVE = 1;
  // No applied declaration is available for this record.
  SOLUTION_REGISTRATION_STATUS_PENDING = 2;
  // Was `SOLUTION_REGISTRATION_STATUS_EXPIRED`: both halves registered but a
  // lease had lapsed. Presence is delivered, never heartbeat-asserted, so there
  // is no lease to lapse and no status to derive from one. Reserved rather than
  // reused: an old reader decoding 3 would read "expired" out of whatever
  // meaning a later value gave the number.
  reserved 3;
  reserved "SOLUTION_REGISTRATION_STATUS_EXPIRED";
  // Was `SOLUTION_REGISTRATION_STATUS_INCOMPATIBLE`: two REPORTED halves
  // declaring different contract versions. Nothing is reported any more — the
  // frontend block is delivered with the presence and the address is resolved
  // — so the state cannot arise. Reserved rather than reused.
  reserved 4;
  reserved "SOLUTION_REGISTRATION_STATUS_INCOMPATIBLE";
  // An applied removal keeps the declaration as a tombstone.
  SOLUTION_REGISTRATION_STATUS_TOMBSTONED = 5;
}

// SolutionFrontendBinding is the stored frontend half: the `frontend` block of
// the applied presence, copied by accounts in the transaction that applies the
// generation. manifest carries that block as JSON (title, order,
// exposed_module, host_contract, dashboard, surfaces) — the author-declared
// half of the manifest the gateway's registry projection builds, adding the
// host's own constants. Present on either kind when its applied generation
// declares one; absent on a headless component.
message SolutionFrontendBinding {
  int64 revision = 1;
  string manifest = 2;
  // Was `string contract_version`: a version two REPORTED halves were
  // compared on. Nothing is reported, so there is nothing to compare.
  // Reserved rather than reused.
  reserved 3;
  reserved "contract_version";
  // Was `google.protobuf.Timestamp lease_expires_at`: the renewal path is
  // deleted, so a column nothing renews was legacy. Reserved, not reused — a
  // released number never takes another name or type.
  reserved 4;
  reserved "lease_expires_at";
}

// SolutionRegistration is the canonical record. revision is drawn from one
// registry-wide sequence, so revisions are comparable across records and a
// consumer can order two snapshots without a wall clock.
message SolutionRegistration {
  string solution_id = 1;
  // Canonical publisher attribution of the declared record.
  string publisher = 2;
  int64 revision = 3;
  SolutionRegistrationStatus status = 4;
  optional SolutionFrontendBinding frontend = 5;
  // Was `optional SolutionBackendBinding backend`: the upstream a running
  // solution reported at mint and the alias it was addressed by. The address
  // is resolved by the Codefly SDK from the endpoint the applied presence
  // declares and lives in no record; the alias is the registry key. The
  // message is deleted with the field. Reserved rather than reused.
  reserved 6;
  reserved "backend";
  google.protobuf.Timestamp updated_at = 7;
  optional google.protobuf.Timestamp tombstoned_at = 8;
  // Was `string runtime_boundary`: the opaque id every Work Context minted for
  // this solution is sealed under. It is NOT a field a readable record carries
  // — a boundary returned on a readable record is a capability leaking as a
  // label — so it is deleted from the wire rather than renamed, and the host
  // seals it into the capability instead.
  //
  // Reserved rather than reused. A released field number never takes another
  // name or type: a consumer still on the old schema reading 9 would decode a
  // message where it expected a string. `declared` therefore took 10, which
  // cost a digest move and is the price of not corrupting an old reader.
  reserved 9;
  reserved "runtime_boundary";
  // The binding and immutable target that declared this record.
  optional SolutionDeclaredBinding declared = 10;
  // Presentation from the composing workspace's applied declaration. Present
  // only for a solution, independently of its frontend. Membership grants no
  // access, consent or installation; viewer lists filter solutions first.
  optional SolutionGroup group = 11;
}

// SolutionGroup organises solutions in navigation and the catalogue. It is not
// an authorization subject, installation target or scope.
message SolutionGroup {
  string id = 1;
  string title = 2;
  int32 order = 3;
}

// ListSolutionRegistrationsRequest reads the whole registry. There is one
// registry per deployment and it holds tens of records at most, so consumers
// rebuild their cache from a full snapshot rather than tailing a change feed.
message ListSolutionRegistrationsRequest {
  // Tombstones are omitted by default: a routing cache wants the live set. An
  // operator diagnosing "was this deleted or never registered?" asks for them.
  bool include_tombstoned = 1;
}

message ListSolutionRegistrationsResponse {
  repeated SolutionRegistration registrations = 1;
  // Highest revision in the registry, tombstones included. Two consumers that
  // report the same registry_revision have converged on the same state.
  int64 registry_revision = 2;
}

// ============================================================================
// Declared solution presence (issue #952)
//
// A SolutionHostBinding is the document delivery hands this host: which solution
// runs here, at which generation. The host reconciles it into the registration
// record above. These messages are the read surface, and they keep the three
// facts apart on purpose — an operator's first question is which of them is
// wrong.
// ============================================================================

// SolutionDeclaredKind is what a declaration declares the presence of.
//
// Core requires it on every presence document and refuses any other value, so
// every admitted declaration has exactly one of the two. The host used to drop
// it on reconcile, which left the registry unable to say whether a record was a
// solution or a module — and the two are routed on different surfaces with
// different admission, so a host that cannot tell them apart must either serve
// both from one surface or serve neither.
//
// UNSPECIFIED is not a third kind and is never a default. It is what a reader
// decodes from a writer that did not set the field, and both routing surfaces
// refuse it by name rather than picking the kind that happens to be more
// permissive.
enum SolutionDeclaredKind {
  SOLUTION_DECLARED_KIND_UNSPECIFIED = 0;
  // A composed solution instance, routed at /solutions/<alias>/* with
  // per-viewer installation admission.
  SOLUTION_DECLARED_KIND_SOLUTION = 1;
  // One module instance, routed at /v1/<alias>/* with the ordinary
  // authenticated pipeline.
  SOLUTION_DECLARED_KIND_MODULE = 2;
}

// SolutionDeclaredBinding identifies the applied declaration and target.
message SolutionDeclaredBinding {
  // Stable ID of the deployment instance that declared this record. It is not
  // the solution id: a binding ID identifies one instance and may carry
  // characters a path segment may not.
  string binding_id = 1;
  // The generation of that binding the host applied into this record.
  uint64 generation = 2;
  // publisher/name@version of the applied generation.
  string release = 3;
  // The immutable solution target this declaration opened — the identity an
  // installation names. It is carried on the registration record so a consumer
  // that was asked about a ROUTE ALIAS can resolve it to the target that
  // currently serves it and compare identities.
  //
  // That resolution is the whole admission mechanism: a replacement binding
  // which claimed a withdrawn alias resolves to its own target, which no
  // installation of its predecessor names. A record with no declaration carries
  // no target and is therefore admissible to nobody, which is the fail-closed
  // answer and the direction of the cutover.
  string target_id = 4;
  // What the declaration declared the presence of. It decides which routing
  // surface serves this record, so it is carried rather than inferred: a host
  // that read the kind off the shape of a record — a publisher prefix, an alias
  // convention — would be guessing at exactly the question that separates a
  // surface with per-viewer admission from one without.
  SolutionDeclaredKind kind = 5;
}

// SolutionHostBindingGeneration is one generation of one document. The document
// is carried whole, canonically encoded, because "what is this host running" and
// "what has it been asked to run" are both answers an operator needs in full.
message SolutionHostBindingGeneration {
  uint64 generation = 1;
  // The canonical digest of the document, which is how a rewritten generation is
  // told from a re-read of the applied one.
  string digest = 2;
  string document = 3;
  google.protobuf.Timestamp at = 4;
}

// SolutionHostBindingAppliedGeneration is the generation this host reconciled,
// and what it reconciled it into.
message SolutionHostBindingAppliedGeneration {
  SolutionHostBindingGeneration generation = 1;
  // A tombstone generation: the binding is declared absent. It is not an
  // absence — the generation stays on the record, so a late or replayed older
  // generation is still refused after a removal.
  bool removed = 2;
  // The route aliases the applied generation holds. A tombstone holds none.
  repeated string routes = 3;
  // The registration record this generation reconciled into. A tombstone keeps
  // the key it withdrew, which is the only way it knows what to withdraw.
  string solution_id = 4;
  string release = 5;
  // Opaque Codefly endpoint delivery joined to this exact applied document.
  // Only the Codefly SDK interprets it. Empty means no delivered route; neither
  // desired state nor startup addresses are a fallback.
  bytes endpoint_delivery = 6;
}

// SolutionHostBindingState is one binding's whole state: desired, applied, and
// why they differ. Endpoint and manifest observations live on
// SolutionRegistration, separate from the declaration that grants presence.
message SolutionHostBindingState {
  string binding_id = 1;
  string host_coordinate = 2;
  string host_component = 3;
  // The newest generation delivery has shown this host, whether or not it
  // passed.
  optional SolutionHostBindingGeneration desired = 4;
  // The generation this host applied. Absent means nothing has ever passed, so
  // nothing about this binding is being served.
  optional SolutionHostBindingAppliedGeneration applied = 5;
  // The generation delivery is showing that this host has not applied, or 0 when
  // desired and applied agree.
  uint64 pending_generation = 6;
  // Why the pending generation was not applied. Empty when nothing is pending.
  string pending_reason = 7;
  optional google.protobuf.Timestamp pending_since = 8;
  // The registration record this binding declares, when it has applied one. It
  // carries endpoint and manifest observations and their derived status.
  optional SolutionRegistration registration = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ListSolutionHostBindingsRequest reads every declared binding. There is one set
// per deployment and it holds tens of bindings at most, so a consumer rebuilds
// its view from a full snapshot.
message ListSolutionHostBindingsRequest {}

message ListSolutionHostBindingsResponse {
  repeated SolutionHostBindingState bindings = 1;
}
