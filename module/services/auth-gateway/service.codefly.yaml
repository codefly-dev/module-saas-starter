name: auth-gateway
version: 0.0.0
description: |
    Single ingress + auth brain. Hosts two listeners:
      - gRPC ext_authz for Envoy
      - private HTTP API gateway behind the frontend entry
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.48-dev.99c5102c6abe
    publisher: codefly.dev
service-dependencies:
    - name: accounts
      endpoints:
        - name: connect
        - name: grpc
        - name: rest
    - name: cache
      endpoints:
        - name: write
    - name: telemetry
      endpoints:
        - name: grpc
workspace-configuration-dependencies:
    - gateway
    - internal-auth
    - observability
    - security
endpoints:
    - name: grpc
      visibility: module
    - name: rest
      visibility: module
spec:
    hot-reload: true
    protocol-output-dirs:
        - code/pkg/gen
    rest-endpoint: true
    runtime-assets:
        - routing
    service-account:
        name: auth-gateway
    deployment:
        # No endpoint-ports: go-grpc binds every endpoint on the port Codefly
        # allocates for it, so each pod port is its deployed port, which the
        # render takes from Codefly. endpoint-ports is only for a port the
        # process binds at a fixed number the allocation does not give it.
