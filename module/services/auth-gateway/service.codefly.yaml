name: auth-gateway
version: 0.0.0
description: |
    Single ingress + auth brain. Hosts two listeners:
      - gRPC ext_authz Check. Its answer carries identity but never the
        gateway credential, so an Envoy in front of accounts must stamp
        that credential itself.
      - private HTTP API gateway behind the frontend entry
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.50
    publisher: codefly.dev
service-dependencies:
    - name: accounts
      endpoints:
        - name: connect
        - name: grpc
        - name: rest
    - name: cache
      endpoints:
        - name: write
workspace-configuration-dependencies:
    # APP_BASE_URL: this host's own public origin. The gateway publishes it in
    # the RFC 9728 document for a solution's MCP endpoint and requires a token's
    # resource audience to name it, so the origin a client was sent to and the
    # origin a token is accepted at are one operator-pinned value rather than
    # two headers that can disagree.
    - application
    - gateway
    - gateway-trust
    - internal-auth
    - observability
    - security
endpoints:
    - name: grpc
      visibility: module
    - name: rest
      visibility: module
spec:
    hot-reload: true
    protocol-output-dirs:
        - code/pkg/gen
    rest-endpoint: true
    runtime-assets:
        - routing
    service-account:
        name: auth-gateway
    deployment:
        # No endpoint-ports: go-grpc binds every endpoint on the port Codefly
        # allocates for it, so each pod port is its deployed port, which the
        # render takes from Codefly. endpoint-ports is only for a port the
        # process binds at a fixed number the allocation does not give it.
