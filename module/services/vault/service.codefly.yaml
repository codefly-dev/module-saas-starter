name: vault
version: 0.0.0
agent:
    kind: codefly:service
    name: vault
    version: 0.0.35
    publisher: codefly.dev
secret-service-configurations:
    - name: vault
      entries:
        - key: vault_token
endpoints:
    - name: http
      visibility: module
spec:
    transit-key: api-keys
    deployment:
        endpoint-ports:
            http: 8200
