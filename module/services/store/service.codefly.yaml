name: store
version: 0.0.0
agent:
    kind: codefly:service
    name: postgres
    # DEV PIN: an unreleased agent prerelease (the postgres agent change this round needs). Move it to the
    # release that ships the change before this module is tagged.
    version: 0.0.139-dev.9b0c2212c6be
    publisher: codefly.dev
endpoints:
    - name: tcp
      visibility: external
spec:
    database-name: users
    debug: false
    persist: true
    runtime-read-write-roles:
        - app_tenant
        - app_control_plane
        - app_billing_worker
        - app_webhook_worker
        - app_job_worker
    silent: true
    watch: true
    without-ssl: false
    deployment:
        endpoint-ports:
            tcp: 5432
        bootstrap-job-endpoints:
            - tcp
