name: store
version: 0.0.0
agent:
    kind: codefly:service
    name: postgres
    # v0.0.140 publishes runtime-logins and the control-plane capability; 0.0.141
    # also declares each runtime login's password as a required secret, without
    # which a deployment render fails on the missing control-plane key.
    version: 0.0.141
    publisher: codefly.dev
endpoints:
    - name: tcp
      # No `location: external`. Location says the endpoint lives OUTSIDE the
      # system, resolved by DNS rather than allocated an address — and that is
      # false here: the render gives this store a ClusterIP Service and a
      # cluster-internal address, and the generated topology already carries an
      # allocated 5432. `location: external` was inherited from the deprecated
      # `visibility: external`, which conflated reach with location; dropping it
      # is the correction, measured against the staging render rather than
      # reasoned from the word.
      #
      # NOT VERIFIED BY A BOOT: under core v0.8.1 (the CLI CI runs) this flips
      # `Endpoint.External()` from true to false, so how `codefly run` resolves
      # the address for accounts locally is asserted from the render, not from a
      # graph that came up. Reach is unchanged — private, same module only — on
      # v0.8.1, v0.13.0 and v0.14.0, each measured through core's own loader.
      visibility: private
spec:
    database-name: users
    debug: false
    persist: true
    # The request login (read-write-connection) reaches app_tenant and nothing
    # else, so no statement on a request connection can select a wider role.
    runtime-read-write-roles:
        - app_tenant
    # Cross-tenant work authenticates as its own login (control-plane-connection),
    # which accounts uses only for WithControlPlane and the worker pools.
    runtime-logins:
        - name: control-plane
          read-write-roles:
            - app_control_plane
            - app_billing_worker
            - app_webhook_worker
            - app_job_worker
    silent: true
    watch: true
    without-ssl: false
    deployment:
        endpoint-ports:
            tcp: 5432
        bootstrap-job-endpoints:
            - tcp
