schema: codefly/module-package/v2
kind: module-package
id: codefly/saas-starter
version: 0.2.0
minimum-codefly-version: ">=0.3.32 <1.0.0"
artifact-roots:
  - contracts
  - deployment
  - docs
  - fixtures
  - services
  - tools
services:
  - name: accounts
    endpoints: [authority, connect, grpc, rest]
    api-contracts:
      - endpoint: authority
        kind: protobuf
        package: saas.accounts.v1
        path: contracts/api/accounts/authority/contract.binpb
        digest: sha256:22c86b05a4cd6388affa81fd199ca3b7548f7defb36baf4c9222ae9c3bfd7cd1
      - endpoint: connect
        kind: protobuf
        package: ""
        path: contracts/api/accounts/connect/contract.binpb
        digest: sha256:22c86b05a4cd6388affa81fd199ca3b7548f7defb36baf4c9222ae9c3bfd7cd1
  - name: auth-gateway
    endpoints: [grpc, rest]
    api-contracts:
      - endpoint: grpc
        kind: protobuf
        package: saas.gateway.auth.v1
        path: contracts/api/auth-gateway/grpc/contract.binpb
        digest: sha256:bfa928499855f08e7c101ca07a0227442d9a1c3b713180b4e892a7e66302a219
  - name: cache
    endpoints: [read, write]
  - name: frontend
    endpoints: [http]
  - name: marketing
    endpoints: [http]
  - name: object-storage
    endpoints: [grpc]
  - name: store
    endpoints: [tcp]
  - name: vault
    endpoints: [http]
fixtures:
  - name: dev-admin
    description: Acme tenant seeded with an administrator, members, teams and a shared collection
    principals:
      - id: 00000000-0000-7000-8000-0000000000a1
        email: admin@acme.com
        role: super_admin
        token: dev-admin
      - id: 00000000-0000-7000-8000-0000000000a2
        email: alice@acme.com
        role: admin
        token: dev-alice
      - id: 00000000-0000-7000-8000-0000000000a3
        email: bob@acme.com
        role: member
        token: dev-bob
  - name: simple
    description: Single super administrator with no tenant
    principals:
      - id: 00000000-0000-7000-8000-0000000000b1
        email: admin@example.com
        role: super_admin
        token: local-admin
contracts:
  composition: ">=2.0.0 <3.0.0"
  frontendPlugin: ">=1.0.0 <2.0.0"
  settings: ">=1.0.0 <2.0.0"
  permissions: ">=1.0.0 <2.0.0"
  fixtures: ">=1.0.0 <2.0.0"
generators:
  - name: embedded-fixtures
    working-directory: tools
    command: [go, run, ./cmd/module-package, sync-embedded-fixtures, --module, ..]
  - name: composition
    working-directory: tools
    command: [go, run, ./cmd/module-compose, --events, ../contracts/accounts/installation.events.codefly.yaml, --events, ../contracts/accounts/scope.events.codefly.yaml, --events, ../contracts/reference/events.codefly.yaml, --base-events, ../contracts/accounts/saas.events.codefly.yaml]
  - name: composed-protobuf
    working-directory: services/accounts
    command: [buf, generate, proto, --path, proto/saas/composed/settings/v1/settings.proto, --path, proto/saas/composed/org_settings/v1/settings.proto, --path, proto/contributed, --template, buf.gen.composition.yaml]
  - name: composed-go-format
    working-directory: tools
    command: [go, run, ./cmd/module-format-generated, ../services/accounts/code/pkg/gen/saas/composed/settings/v1, ../services/accounts/code/pkg/gen/saas/composed/org_settings/v1, ../services/accounts/code/pkg/gen/contributed]
  - name: composed-python-protobuf
    working-directory: services/accounts
    command: [buf, generate, proto, --path, proto/saas/composed/settings/v1/settings.proto, --path, proto/contributed, --template, buf.gen.composition.python.yaml]
conformance:
  - name: composition-contracts
    working-directory: tools
    command: [go, test, ./composition]
  - name: settings-python-runtime
    working-directory: services/accounts/code/python
    command: [python3, -m, pytest, -q]
migrations:
  - id: composition-v2
    from: ">=0.0.32 <0.1.0"
    breaking: true
  - id: scope-settings-transition
    from: ">=0.1.0 <0.2.0"
    breaking: true
breaking-changes:
  - Consumers resolve the immutable package into a disposable projection instead of editing Starter-owned files.
  - "Audit event types are namespaced under `saas.*` (`auth.login` -> `saas.auth.login`). The wire value of `audit_events.event_type`, the `X-Webhook-Event` header, and webhook routing keys all change; migration 116 rewrites stored history and existing subscriptions in place, so a live subscriber keeps firing, but a consumer that re-creates a subscription from a hardcoded pre-namespace name, or emits one through `ModuleEmitAuditEvent`, is now rejected. No alias layer."
  - "The telemetry service and its dependency contract are removed. SDK Init exports traces when OTEL_EXPORTER_OTLP_ENDPOINT is delivered; no endpoint means no tracing, including native local runs. Exporter initialization failures are logged without stopping the service. Accounts and auth-gateway push metrics to the same endpoint and no longer serve /metrics. Telemetry uses standard process variables, not the removed observability configuration group. Deliver standard OTEL variables to every service through the environment telemetry declaration using a compatible CLI. Existing consumers of the telemetry service must migrate to the HTTPS operations intake."
  - "The two transaction-local settings an RLS policy reads are now the platform Postgres library's own, `codefly.current_tenant_id` and `codefly.current_user_id`, not the host's `app.current_org_id` and `app.current_user_id` (store migration 65). A consumer whose own migrations created tenant policies against the retired names must rewrite them: nothing binds those names as the only read any more, so each such table reads as EMPTY for every caller and every INSERT fails its WITH CHECK, with no error raised anywhere. Run `tools/rls-scope-settings-transition.sql` against the database — it is catalog-driven, idempotent, and reaches a consumer's own policies and routine bodies as well as this module's — or rewrite the predicates onto the two library names. Store migration 66 is that same file applied to this module's ledger: for the length of the compatibility window every predicate reads the library's name with the retired one behind it, and the host binds both generations, so the catalog and the fleet can move independently. A later release closes the window by deleting the retired arm; a policy still reading a retired name alone at that point goes silently empty, which accounts refuses to start against and `tools/rls-migration-gate.mjs` refuses to build."
reserved-namespaces:
