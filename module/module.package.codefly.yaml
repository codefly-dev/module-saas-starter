schema: codefly/module-package/v2
kind: module-package
id: codefly/saas-starter
version: 0.1.0
minimum-codefly-version: 0.3.0
repository: https://github.com/codefly-dev/module-saas-starter.git

artifact:
  media-type: application/vnd.codefly.module.v2+tar
  roots:
    - .
  entry-points:
    module: module.codefly.yaml
    topology: deployment/topology.bindings.codefly.yaml
    frontend: services/frontend/code/package.json
    accounts-proto: services/accounts/proto

provided-services:
  - name: accounts
    endpoints:
      - {name: connect, protocol: connect, visibility: private}
      - {name: grpc, protocol: grpc, visibility: private}
      - {name: rest, protocol: rest, visibility: private}
  - name: auth-sidecar
    endpoints:
      - {name: grpc, protocol: grpc, visibility: module}
      - {name: rest, protocol: rest, visibility: private}
  - name: cache
    endpoints:
      - {name: read, protocol: tcp, visibility: private}
      - {name: write, protocol: tcp, visibility: private}
  - name: frontend
    endpoints:
      - {name: http, protocol: http, visibility: public}
  - name: marketing
    endpoints:
      - {name: http, protocol: http, visibility: public}
  - name: object-storage
    endpoints:
      - {name: accounts, protocol: tcp, visibility: private}
  - name: store
    endpoints:
      - {name: tcp, protocol: tcp, visibility: external}
  - name: telemetry
    endpoints:
      - {name: grpc, protocol: grpc, visibility: private}
  - name: vault
    endpoints:
      - {name: http, protocol: http, visibility: module}

contribution-contracts:
  - id: codefly/saas/frontend-plugin
    versions: ">=2.0.0 <3.0.0"
    entry-points:
      contribution-schema: contracts/frontend/v2/frontend-contribution.schema.json
      metadata: services/frontend/code/packages/saas-plugin-contract/src/index.ts
      react: services/frontend/code/packages/saas-plugin-react/src/index.ts
      capabilities: services/frontend/code/packages/saas-plugin-contract/proto/saas/frontend/plugin/v1/capabilities.proto
  - id: codefly/saas/settings
    versions: ">=1.0.0 <2.0.0"
    entry-points:
      contribution-schema: contracts/settings/v1/settings-contribution.schema.json
      common-settings: services/accounts/proto/saas/settings/v1/common_settings.proto
      generator: tools/cmd/module-compose
      go-runtime: services/accounts/code/pkg/settings
      typescript-runtime: services/frontend/code/packages/saas-settings/src/index.ts
  - id: codefly/saas/permissions
    versions: ">=1.0.0 <2.0.0"
    entry-points:
      contribution-schema: contracts/permissions/v1/permissions-contribution.schema.json
      generator: tools/cmd/module-compose
  - id: codefly/saas/fixtures
    versions: ">=1.0.0 <2.0.0"
    entry-points:
      contribution-schema: contracts/fixtures/v1/fixtures-contribution.schema.json
      generator: tools/cmd/module-compose
      runtime: services/accounts/code/fixtures/seed.go
  - id: codefly/saas/topology
    versions: ">=1.0.0 <2.0.0"
    entry-points:
      contribution-schema: contracts/topology/v1/topology-contribution.schema.json
      composition-generator: tools/cmd/module-compose
      deployment-generator: services/accounts/code/cmd/deployment-topology

generators:
  - id: composition-default
    working-directory: tools
    command: [go, run, ./cmd/module-compose, --module, .., --output, ..]
    outputs:
      - services/frontend/code/src/generated/frontend-contributions.ts
      - services/frontend/code/frontend.install.generated.json
      - services/accounts/proto/saas/composed/settings/v1/settings.proto
      - services/accounts/code/pkg/settingscatalog/catalog_gen.go
      - services/frontend/code/src/gen/saas/settings/v1/field_catalog.ts
      - deployment/generated/contributed-permissions.json
      - deployment/generated/contributed-fixtures.json
      - deployment/generated/contributed-topology.json
  - id: composition-reference
    working-directory: tools
    command: [go, run, ./cmd/module-compose, --module, .., --output, ../generated/reference-composition, --frontend, ../contracts/reference/frontend.codefly.yaml, --settings, ../contracts/reference/settings.codefly.yaml, --permissions, ../contracts/reference/permissions.codefly.yaml, --fixtures, ../contracts/reference/fixtures.codefly.yaml, --topology, ../contracts/reference/topology.codefly.yaml]
    outputs:
      - generated/reference-composition/services/frontend/code/src/generated/frontend-contributions.ts
      - generated/reference-composition/services/frontend/code/frontend.install.generated.json
      - generated/reference-composition/services/accounts/proto/saas/composed/settings/v1/settings.proto
      - generated/reference-composition/services/accounts/code/pkg/settingscatalog/catalog_gen.go
      - generated/reference-composition/services/frontend/code/src/gen/saas/settings/v1/field_catalog.ts
      - generated/reference-composition/deployment/generated/contributed-permissions.json
      - generated/reference-composition/deployment/generated/contributed-fixtures.json
      - generated/reference-composition/deployment/generated/contributed-topology.json
  - id: frontend-service-allowlist
    working-directory: services/frontend/code
    command: [npm, run, generate:plugin-allowlist]
    outputs:
      - services/frontend/code/server/plugin-service-allowlist.generated.json
  - id: frontend-service-manifest
    working-directory: services/frontend/code
    command: [npm, run, generate:plugin-codefly-dependencies]
    outputs:
      - services/frontend/service.codefly.yaml
  - id: deployment-topology
    working-directory: services/accounts/code
    command: [go, run, ./cmd/deployment-topology, -catalog, ../generated/service-catalog.json, -config, ../../../deployment/topology.bindings.codefly.yaml, -frontend-plugin-allowlist, ../../frontend/code/server/plugin-service-allowlist.generated.json, -application-config, ../../../deployment/application.bindings.codefly.yaml, -topology-output, ../../../deployment/generated/service-topology.json, -module-output, ../../../module.codefly.yaml, -services-root, ../.., -network-output, pkg/cataloggen/testdata/network-policy.golden.yaml]
    outputs:
      - deployment/generated/service-topology.json
      - module.codefly.yaml
      - services/accounts/code/pkg/cataloggen/testdata/network-policy.golden.yaml
      - services/accounts/service.codefly.yaml
      - services/auth-sidecar/service.codefly.yaml
      - services/cache/service.codefly.yaml
      - services/frontend/service.codefly.yaml
      - services/marketing/service.codefly.yaml
      - services/object-storage/service.codefly.yaml
      - services/store/service.codefly.yaml
      - services/telemetry/service.codefly.yaml
      - services/vault/service.codefly.yaml

conformance-suites:
  - id: frontend-contract
    working-directory: services/frontend/code
    command: [npm, run, test:plugin-contract]
  - id: frontend-react
    working-directory: services/frontend/code
    command: [npm, run, test:plugin-react]
  - id: settings-runtime
    working-directory: services/accounts/code
    command: [go, test, ./pkg/settings, ./pkg/usersettings]
  - id: composition-contracts
    working-directory: tools
    command: [go, test, ./composition]
  - id: published-frontend-contracts
    working-directory: services/frontend/code
    command: [npm, run, test:published-plugin-contract]
  - id: protobuf-contract-lint
    working-directory: services/accounts/proto
    command: [go, run, github.com/bufbuild/buf/cmd/buf@v1.72.0, lint]
  - id: protobuf-semver
    working-directory: services/accounts/proto
    command: [go, run, github.com/bufbuild/buf/cmd/buf@v1.72.0, breaking, --against, "../../../../.git#ref=v0.0.37,subdir=module/services/accounts/proto"]
  - id: package-integrity
    working-directory: tools
    command: [go, test, ./...]

release:
  supported-from: ">=0.0.32 <0.1.0"
  migrations:
    - from: ">=0.0.32 <0.1.0"
      guide: docs/composition-v2-migration.md
  breaking-changes:
    - version: 0.1.0
      summary: Consumers resolve the immutable package instead of copying Starter-owned files into a writable module tree.

reserved-namespaces:
  - {kind: package, value: "@codefly/saas-"}
  - {kind: protobuf, value: "saas."}
  - {kind: permission, value: "saas."}
  - {kind: settings, value: "common"}
  - {kind: service, value: "accounts"}
  - {kind: service, value: "auth-sidecar"}
  - {kind: service, value: "cache"}
  - {kind: service, value: "frontend"}
  - {kind: service, value: "marketing"}
  - {kind: service, value: "object-storage"}
  - {kind: service, value: "store"}
  - {kind: service, value: "telemetry"}
  - {kind: service, value: "vault"}
