title = "SaaS Starter secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Canonical integrity manifest contains only file paths and SHA-256 hashes"
paths = ['''^module/tools/base-manifest\.json$''']

[[allowlists]]
description = """
Synthetic provider credentials used by the setup-script and webhook tests. The
`codeflyfixture` infix is reserved for values that are deliberately fake, so a
real provider key can never match this allowlist.
"""
regexTarget = "match"
regexes = ['''codeflyfixture''']
