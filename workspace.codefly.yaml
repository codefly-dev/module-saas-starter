name: saas-starter-dev
layout: modules
modules:
    - name: saas-starter

# Durable stores `codefly publish clients` / `codefly publish library` publish
# generated client libraries to, and `codefly install library` resolves from.
#
# There is deliberately NO `go` or `python` store here. Those stores CREATE a
# missing repository on first publish and create it PUBLIC — a consumer must be
# able to `go get` it without codefly or credentials — and a client's bindings
# always carry the WHOLE contract (`services:` in module/clients.codefly.yaml
# trims only the facade). So a single `codefly publish clients saas-starter`,
# run to see what it does, would disclose an endpoint's full message graph
# under an org repository nobody agreed to create. Clients are distributed
# through the per-language SDK repositories instead (AGENTS.md, "Cutting a
# release"); with no store declared, that command fails closed rather than
# publishing. Declaring one is a disclosure decision, not a config tidy-up, and
# belongs in the cell contract once codefly-dev/cli#715 lands.
#
# The typescript entry stays: it names the org's GitHub Packages registry, which
# publishes a scoped package and creates no repository. Credentials (GH_TOKEN /
# NODE_AUTH_TOKEN) belong to release CI, never to a runtime.
libraries:
    publish:
        typescript: {registry: https://npm.pkg.github.com, scope: "@codefly-dev"}

# Repository publication (repo-url, branch, revision, checkout, Argo/Flux
# Application assembly) is owned by the CLI/server promotion driver, not the
# module plugin. The plugin renders module-owned Kubernetes overlays and a
# transport-neutral `deployment/kustomize/bundle.json` from the environments
# below; the promotion driver composes and publishes that bundle. Any legacy
# `gitops:` block left here from an earlier release is ignored.

# Deploy targets the CLI knows about. `codefly deploy --env <name>` and
# `codefly build --env <name>` look these up to resolve cluster +
# registry. Empty env block = bare-name behavior (legacy defaults).
environments:
    # Local k3d cluster for dev/smoke. Image push is unnecessary —
    # LocalApplyManager imports built images into k3d directly. URL is
    # still set so manifests reference predictable image names.
    - name: local
      description: Local k3d cluster for development
      # The default local product graph is deterministic fake-auth. Codefly
      # injects this fixture into every runtime; local-dogfood intentionally
      # omits it and loads the real identity-provider configuration instead.
      fixture: dev-admin
      cluster:
          kind: k3d
          kubeconfig: ~/.kube/config
      registry:
          url: localhost:5001
      namespace: saas-starter
      ingress:
          - name: marketing
            service: marketing
            endpoint: http
            hosts:
                - saas.localhost
                - www.saas.localhost
                - docs.saas.localhost
          - name: product
            service: frontend
            endpoint: http
            hosts:
                - app.saas.localhost
                - localhost

    # Real local product use. This remains a local Codefly runtime, but loads
    # operator-owned identity credentials from configurations/local-dogfood instead
    # of enabling fixture authentication.
    - name: local-dogfood
      description: Local SaaS dogfood with an external identity provider
      cluster:
          kind: k3d
          kubeconfig: ~/.kube/config
      registry:
          url: localhost:5001
      namespace: saas-starter-dogfood

    # AWS EKS production target. Replace registry URL with your ECR
    # repo + bump kubeconfig path to wherever your cluster's config
    # lives (or set $KUBECONFIG and drop the kubeconfig line). `auth:
    # ecr` tells the build pipeline to run `aws ecr get-login-password`
    # before docker push.
    - name: aws
      description: AWS EKS production
      cluster:
          kind: eks
          kubeconfig: ~/Development/codefly.dev/infrastructure/eks/kubeconfig.yaml
      registry:
          url: 621829027644.dkr.ecr.us-east-1.amazonaws.com/saas-starter
          auth: ecr
      namespace: saas-starter
      # Which key service holds this environment's keys would be stated here,
      # in the same vocabulary KEY_SERVICE_BACKEND uses in the `key-service`
      # configuration group — see the commented block below for why the line
      # cannot be written yet, and module/deployment/README.md, "Composing no
      # Vault", for the route that works today:
      #
      #   vault  this module composes its `vault` service here, unless the
      #          `cell-vault` handoff below names one the cell already runs.
      #          The deployed render is durable and needs the seal declared in
      #          module/services/vault/configurations/aws/vault.env.
      #   kms    the keys live in the cell's cloud key-management service. This
      #          module composes NO Vault: no StatefulSet, no PVC, no seal, no
      #          token, and no egress to one. accounts opens no Vault connection
      #          either, so the `vault` groups carry nothing here. Declaring a
      #          `vault` managed service alongside it is refused — there is
      #          nothing for a handoff to point at.
      #
      # Unstated — which is the only thing this file can say today — means
      # `vault`, this module's behaviour before the selection existed.
      # Every module-managed AWS dependency requires an exact endpoint and
      # egress CIDR. Optional secret-references contain provider references,
      # never resolved values. See module/deployment/README.md.
      #
      # `cell-vault` is the one in-cluster kind: it names a Vault the cell runs
      # in a namespace of its own, so this module renders none. It is selected
      # by namespace rather than CIDR, and the caller logs in with an AppRole
      # credential the configuration plane delivers as a secret — nothing in
      # that binding is a file. See module/deployment/README.md, "The cell's
      # Vault", and configurations/local/vault.env plus vault.secret.env for
      # what the `vault` groups must then carry. The in-mesh plaintext address
      # also needs internal-transport/mesh-protected=true. It belongs with
      # `key-service: vault` only; under `kms` there is no Vault to bind.
      #
      # EVERYTHING BELOW IS COMMENTED OUT BECAUSE THE CLI CANNOT PARSE IT. The
      # environment block's schema is the CLI's own
      # `pkg/environments.Environment`, decoded strictly and RECURSIVELY with no
      # extension seam, and its managed-service type carries no `auth-mode` and
      # no `egress-namespace`. Against codefly 0.1.181 either key is rejected
      # with "field auth-mode not found in type
      # environments.EnvironmentManagedService", which fails the whole workspace
      # load — so writing this block would break every local run in this
      # repository, not only an `aws` one.
      #
      # The same gap holds `key-service` (issue #1128), the per-environment
      # statement of whether this module composes a Vault here at all:
      #
      #     key-service: vault   # this module's Vault, or the cell's below
      #     key-service: kms     # the cell's cloud KMS holds the keys; no Vault
      #
      # `kms` withdraws the vault service, every dependency edge to it, and any
      # handoff beside it. The module agent implements and tests all of it; the
      # line becomes writable when the CLI's environment type accepts it, and
      # an unstated selection on a deployed environment becomes a refusal then.
      # Until then a composition with no Vault in ANY environment says so by
      # leaving `vault` out of its `services:` list, which also withdraws the
      # `vault` configuration group. See module/deployment/README.md,
      # "Composing no Vault".
      # managed-services:
      #     store:
      #         kind: rds-postgresql
      #         external-name: database.internal.example.com
      #         egress-cidrs: [10.42.0.0/24]
      #     vault:
      #         kind: cell-vault
      #         external-name: vault.vault.svc.cluster.local
      #         auth-mode: external-identity
      #         egress-namespace: vault
