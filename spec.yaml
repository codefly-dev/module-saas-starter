# Module template specification
# codefly add module --agent saas-starter myapp
name: saas-starter
description: "Complete SaaS foundation — auth, multi-tenancy, RBAC, OPA gateway, impersonation, audit, billing-ready"

services:
  - name: store
    agent:
      kind: codefly:service
      name: external-postgres
      publisher: codefly.dev
    description: "PostgreSQL — users, orgs, teams, roles, sessions, entitlements, audit"

  - name: vault
    agent:
      kind: codefly:service
      name: external-vault
      publisher: codefly.dev
    description: "Vault — JWT signing keys, API key hashing"

  - name: api
    agent:
      kind: codefly:service
      name: go-grpc
      publisher: codefly.dev
    description: "gRPC + REST — UserService, OrgService, TeamService, PermissionService, AuthService, PlatformAdminService, APIKeyService, AuditService, InvitationService"
    dependencies:
      - name: store
      - name: vault

  - name: auth-sidecar
    agent:
      kind: codefly:service
      name: go-grpc
      publisher: codefly.dev
    description: "Envoy ext_authz — JWT/API key validation + embedded OPA per-method RBAC + impersonation detection"
    dependencies:
      - name: api

  - name: frontend
    agent:
      kind: codefly:service
      name: nextjs
      publisher: codefly.dev
    description: "Next.js app — login, org management, admin dashboard, plugin-extensible"
    dependencies:
      - name: api

# What this module exposes to other modules
interface:
  endpoints:
    - service: api
      endpoint: grpc
      visibility: module
    - service: auth-sidecar
      endpoint: grpc
      visibility: module
    - service: frontend
      endpoint: http
      visibility: public

# Capabilities — what you get out of the box
capabilities:
  authentication:
    - WorkOS AuthKit (or custom JWT with Ed25519)
    - Multi-provider identity (Google, GitHub, Apple, Email)
    - API key management (cfly_sk_ prefix, vault-hashed)
    - Impersonation (RFC 8693 act claim, provider-agnostic)
  authorization:
    - Platform admin roles (super_admin, support, billing)
    - Org-level RBAC (owner, admin, member)
    - OPA Rego policies for per-method gateway enforcement
    - Defense-in-depth (gateway + business layer)
  multi-tenancy:
    - Organizations with membership and roles
    - Teams within organizations
    - Invitations with token-based acceptance
  observability:
    - Append-only audit log with immutability triggers
    - Per-mutation audit events with impersonation tracking
  billing-ready:
    - Plans, entitlements, and usage tracking schema
    - Feature flags with rollout percentages
    - EntitlementChecker interface (Stripe adapter pluggable)
  frontend:
    - Plugin-extensible admin UI (config-transform + slot system)
    - openapi-fetch typed API client from proto
    - React Query hooks with cache invalidation
    - DataTable, StatusBadge, OrgSelector reusable components
